<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jack’s Projects</title>
<meta name="theme-color" content="#2F3E9E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.hero .top{margin-bottom:18px;justify-content:flex-end}.gear{width:44px;height:44px;padding:0;justify-content:center}.gear svg{transition:transform .4s}.gear:hover svg{transform:rotate(60deg)}
.tile p{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rows .tile p{-webkit-line-clamp:2}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-top:14px}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:.9rem}
th{text-align:left;padding:14px 16px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:12px 16px;vertical-align:top;border-bottom:1px solid var(--line);color:var(--muted)}
td:first-child{white-space:nowrap;font-weight:700;color:var(--ink)}td:first-child a{color:inherit}
td.te{font:.78rem/1.5 ui-monospace,Menlo,monospace}
tr.sec td{background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:var(--ink);font-weight:800}
.hero .hello{margin-bottom:0}</style>
</head><body>
<div class="wrap">
 <div class="hero">
  <div class="top"><button class="ghost" id="back" type="button" hidden style="margin-right:auto"><span class="bk" data-ic="chev"></span>Back</button><button class="ghost gear" id="gear" type="button" aria-label="Details" aria-pressed="false"><span data-ic="gear"></span></button></div>
  <div class="hello">Jack’s Projects</div>
 </div>
 <section id="pick"><div class="grid" id="profiles" style="margin-top:18px"></div></section>
 <section id="home" hidden>
  <div class="bar">
   <div class="row">
    <label class="sbox"><span class="sic" data-ic="search"></span><input class="search" id="q" type="search" placeholder="Search" aria-label="Search" autocomplete="off"></label>
    <div class="seg" role="group" aria-label="View"><button id="vList"><span data-ic="list"></span>List</button><button id="vGrid"><span data-ic="grid"></span>Grid</button></div>
   </div>
   <div class="chips" id="chips"></div>
  </div>
  <div class="list" id="list"></div>
 </section>
 <section id="details" hidden>
  <div class="tw"><table><thead><tr><th>App</th><th>Category</th><th>What it does</th><th>Technical reference</th></tr></thead><tbody id="rows"></tbody></table></div>
 </section>
</div>
<script src="icons.js"></script><script src="data.js"></script><script src="app.js"></script>
</body></html>
