  // Recommended inputs list for management reviews (wording is this application's own summary).
  const REVIEW_INPUT_TOPICS = [
    'Status of actions from previous reviews', 'Changes in external and internal issues',
    'Customer satisfaction and feedback', 'Quality objectives performance', 'Process performance and product conformity',
    'Nonconformities and corrective actions', 'Monitoring and measurement results', 'Audit results',
    'External provider performance', 'Adequacy of resources', 'Effectiveness of risk and opportunity actions', 'Improvement opportunities'];

  const TRACE_HUBS = ['processes', 'suppliers', 'inspPlans', 'people'];
  const SCHEMA_VERSION = 1;
  const BACKUP_FORMAT = 'offline-qms-backup';
  const MAX_ATTACHMENT_BYTES = 3 * 1024 * 1024;
  const RESERVED = ['id', 'status', 'data', 'history', 'attachments', 'approvals', 'pending', 'revisions', 'created', 'createdBy'];

  /* ------------------------------------------------------------------ store */
  function emptyData(now) {
    const records = {}; Object.keys(ENTITIES).forEach(k => (records[k] = {}));
    return { meta: { schemaVersion: SCHEMA_VERSION, createdAt: now.toISOString(), seq: {}, company: 'Your organization', events: [] }, records };
  }

  function createStore(opts) {
    opts = opts || {};
    let clock = opts.clock || (() => new Date());
    let data = opts.data ? clone(opts.data) : emptyData(clock());
    const listeners = [];

    const now = () => clock();
    const today = () => isoDate(now());
    const ent = name => { const e = ENTITIES[name]; if (!e) throw new QMSError('Unknown record type: ' + name); return e; };
    const raw = (name, id) => (data.records[name] || {})[id] || null;
    const list = name => Object.values(data.records[name] || {}).sort((a, b) => (a.id < b.id ? -1 : 1));
    function user(id) {
      const p = raw('people', id);
      if (!p) throw new QMSError('Unknown user: ' + id);
      if (p.status !== 'Active') throw new QMSError(p.data.name + ' is inactive and cannot act in the system.');
      return p;
    }
    function emit(evt) { listeners.forEach(fn => { try { fn(evt); } catch (e) { /* listener errors must not break writes */ } }); }

    function snapshotOf(rec) {
      const s = clone(rec); delete s.history;
      if (s.attachments) s.attachments = s.attachments.map(a => { const m = Object.assign({}, a); delete m.data; return m; });
      return s;
    }
    function diff(before, after) {
      const changes = [];
      const keys = new Set([...Object.keys(before.data || {}), ...Object.keys(after.data || {})]);
      keys.forEach(k => {
        const a = canonical(before.data[k]), b = canonical(after.data[k]);
        if (a !== b) changes.push({ field: k, from: before.data[k] === undefined ? null : before.data[k], to: after.data[k] === undefined ? null : after.data[k] });
      });
      if (before.status !== after.status) changes.push({ field: 'status', from: before.status || null, to: after.status });
      return changes;
    }
    function appendHistory(rec, entry) {
      rec.history = rec.history || [];
      const prev = rec.history.length ? rec.history[rec.history.length - 1].hash : 'GENESIS';
      entry.seq = rec.history.length + 1;
      entry.snapshotHash = sha256(canonical(snapshotOf(rec)));
      entry.prevHash = prev;
      const body = Object.assign({}, entry); delete body.hash;
      entry.hash = sha256(prev + canonical(body));
      rec.history.push(entry);
    }

    function validateValues(name, values, rec) {
      const e = ent(name), errs = [];
      const check = (fd, v, path) => {
        if (isEmpty(v)) return;
        switch (fd.type) {
          case 'date': if (typeof v !== 'string' || !validDate(v)) errs.push(path + ': invalid date (YYYY-MM-DD)'); break;
          case 'number': {
            const n = Number(v);
            if (typeof v === 'boolean' || !isFinite(n)) errs.push(path + ': must be a number');
            else { if (fd.min !== undefined && n < fd.min) errs.push(path + ': minimum ' + fd.min); if (fd.max !== undefined && n > fd.max) errs.push(path + ': maximum ' + fd.max); }
            break; }
          case 'select': if (!fd.options.includes(v)) errs.push(path + ': "' + v + '" is not an allowed value'); break;
          case 'email': if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) errs.push(path + ': invalid email'); break;
          case 'ref': if (!raw(fd.ref, v)) errs.push(path + ': ' + v + ' does not exist'); break;
          case 'refs': if (!Array.isArray(v)) errs.push(path + ': must be a list'); else v.forEach(x => { if (!raw(fd.ref, x)) errs.push(path + ': ' + x + ' does not exist'); }); break;
          case 'table':
            if (!Array.isArray(v)) { errs.push(path + ': must be a list of rows'); break; }
            if (v.length > 500) errs.push(path + ': too many rows');
            v.forEach((row, i) => { if (!row || typeof row !== 'object') { errs.push(path + ' row ' + (i + 1) + ': invalid'); return; }
              Object.keys(row).forEach(ck => { if (!fd.columns.some(c => c.k === ck)) errs.push(path + ' row ' + (i + 1) + ': unknown column ' + ck); });
              fd.columns.forEach(c => check(c, row[c.k], fd.label + ' row ' + (i + 1) + ' / ' + c.label)); });
            break;
          default: if (typeof v !== 'string') errs.push(path + ': must be text'); else if (v.length > 20000) errs.push(path + ': too long');
        }
      };
      Object.keys(values).forEach(k => {
        const fd = e.fields.find(x => x.k === k);
        if (!fd && k !== 'kpiSnapshot') errs.push('Unknown field: ' + k);
        else if (fd) check(fd, values[k], fd.label);
      });
      const merged = Object.assign({}, rec ? rec.data : {}, values);
      e.fields.forEach(fd => {
        if (fd.required && isEmpty(merged[fd.k])) errs.push(fd.label + ' is required');
        if (fd.unique && !isEmpty(merged[fd.k])) {
          const norm = String(merged[fd.k]).trim().toLowerCase();
          if (list(name).some(o => (!rec || o.id !== rec.id) && String(o.data[fd.k] || '').trim().toLowerCase() === norm)) errs.push(fd.label + ' "' + merged[fd.k] + '" is already used');
        }
      });
      if (e.validate) { const m = e.validate({ data: merged }); if (m) errs.push(m); }
      return errs;
    }
    function normalize(name, values) {
      const e = ent(name), out = {};
      Object.keys(values || {}).forEach(k => {
        let v = values[k];
        const fd = e.fields.find(x => x.k === k);
        if (fd && fd.type === 'number' && v !== '' && v !== null && v !== undefined && !isNaN(Number(v))) v = Number(v);
        if (typeof v === 'string') v = v.trim();
        if (fd && fd.type === 'table' && Array.isArray(v)) v = v.filter(row => row && Object.values(row).some(x => !isEmpty(x))).map(row => {
          const r2 = {}; fd.columns.forEach(c => { let cv = row[c.k]; if (typeof cv === 'string') cv = cv.trim(); if (c.type === 'number' && cv !== '' && cv !== undefined && cv !== null && !isNaN(Number(cv))) cv = Number(cv); if (!isEmpty(cv)) r2[c.k] = cv; }); return r2; });
        out[k] = v;
      });
      return out;
    }

    // Generic guarded mutation: everything that changes a record passes through here.
    function mutate(name, rec, userId, action, comment, fn, extra) {
      const before = clone(rec);
      fn(rec);
      const changes = diff(before, rec);
      appendHistory(rec, Object.assign({ ts: now().toISOString(), user: userId, action, changes, comment: comment || '' }, extra || {}));
      return changes;
    }
    const ctx = (userId, approver) => ({
      today: today(), now: now(), user: userId, approver, db: api,
      touch: (n, r, fn, comment) => mutate(n, r, userId, 'system-update', comment, fn)
    });

    function create(name, values, userId) {
      const e = ent(name);
      if (name !== 'people' || list('people').length) user(userId);
      values = normalize(name, values);
      e.fields.forEach(fd => { if (fd.default !== undefined && isEmpty(values[fd.k])) values[fd.k] = fd.default; });
      e.fields.forEach(fd => { if (fd.readonly) delete values[fd.k]; });
      const errs = validateValues(name, values, null);
      if (errs.length) throw new QMSError('Cannot save ' + e.label.toLowerCase() + ': ' + errs[0], errs);
      const seq = (data.meta.seq[name] || 0) + 1;
      const id = e.prefix + '-' + String(seq).padStart(4, '0');
      if (raw(name, id)) throw new QMSError('ID collision: ' + id);
      const rec = { id, status: e.workflow.initial, data: {}, attachments: [], approvals: [], pending: null, created: now().toISOString(), createdBy: userId, history: [] };
      if (name === 'documents') rec.revisions = [];
      rec.data = values;
      if (e.onCreate) e.onCreate(rec);
      appendHistory(rec, { ts: rec.created, user: userId, action: 'created', changes: Object.keys(rec.data).map(k => ({ field: k, from: null, to: rec.data[k] })), comment: '' });
      data.meta.seq[name] = seq;
      data.records[name][id] = rec;
      emit({ type: 'create', entity: name, id });
      return clone(rec);
    }

    function isLocked(name, rec) { return ent(name).lockedStates.includes(rec.status) || !!rec.pending; }

    function update(name, id, values, userId, comment) {
      const e = ent(name), rec = raw(name, id);
      if (!rec) throw new QMSError(id + ' not found');
      user(userId);
      if (rec.pending) throw new QMSError(id + ' is awaiting approval and cannot be edited. Withdraw or decide the approval first.');
      if (e.lockedStates.includes(rec.status)) throw new QMSError(id + ' is ' + rec.status + ' and locked against editing.' + (e.workflow.transitions.some(t => t.from.includes(rec.status) && t.to === 'Draft') ? ' Start a revision to change it.' : ''));
      values = normalize(name, values);
      e.fields.forEach(fd => { if (fd.readonly) delete values[fd.k]; });
      const errs = validateValues(name, values, rec);
      if (errs.length) throw new QMSError('Cannot save: ' + errs[0], errs);
      const merged = Object.assign({}, rec.data, values);
      if (canonical(merged) === canonical(rec.data)) return { record: clone(rec), changes: [] };
      const changes = mutate(name, rec, userId, 'updated', comment, r => { r.data = merged; });
      emit({ type: 'update', entity: name, id });
      return { record: clone(rec), changes };
    }

    function availableTransitions(name, id) {
      const e = ent(name), rec = raw(name, id);
      if (!rec || rec.pending) return [];
      return e.workflow.transitions.filter(t => t.from.includes(rec.status)).map(t => ({
        to: t.to, label: t.label, comment: !!t.comment,
        approval: typeof t.approval === 'function' ? !!t.approval(rec) : !!t.approval,
        blocked: checkTransition(name, rec, t)
      }));
    }
    function checkTransition(name, rec, t) {
      const e = ent(name);
      const missing = (t.requires || []).filter(k => isEmpty(rec.data[k])).map(k => e.fields.find(x => x.k === k).label);
      if (missing.length) return 'Required before this step: ' + missing.join(', ');
      const errs = validateValues(name, {}, rec);
      if (errs.length) return errs[0];
      return t.guard ? t.guard(rec, api, now()) : null;
    }
    function findTransition(name, rec, to) {
      const t = ent(name).workflow.transitions.find(x => x.from.includes(rec.status) && x.to === to);
      if (!t) throw new QMSError('Transition from "' + rec.status + '" to "' + to + '" is not allowed for ' + ent(name).label.toLowerCase() + 's.');
      return t;
    }
    function applyTransition(name, rec, t, userId, comment, approver) {
      const from = rec.status;
      mutate(name, rec, userId, approver ? 'approved-transition' : 'transition', comment, r => {
        if (t.effect) t.effect(r, ctx(userId, approver));
        r.status = t.to; r.pending = null;
      }, { transition: t.label, fromStatus: from, toStatus: t.to });
    }

    function transition(name, id, to, userId, comment) {
      const rec = raw(name, id);
      if (!rec) throw new QMSError(id + ' not found');
      user(userId);
      if (rec.pending) throw new QMSError(id + ' already has a pending approval.');
      const t = findTransition(name, rec, to);
      if (t.comment && isEmpty(comment)) throw new QMSError('A comment is required for "' + t.label + '".');
      const block = checkTransition(name, rec, t);
      if (block) throw new QMSError(block);
      const needsApproval = typeof t.approval === 'function' ? t.approval(rec) : !!t.approval;
      if (needsApproval) {
        mutate(name, rec, userId, 'approval-requested', comment, r => { r.pending = { to, transition: t.label, requestedBy: userId, requestedAt: now().toISOString(), comment: comment || '' }; }, { transition: t.label });

      return { record: clone(rec), pendingApproval: false };
    }

    function decide(name, id, userId, approve, comment) {
      const rec = raw(name, id);
      if (!rec) throw new QMSError(id + ' not found');
      const u = user(userId);
      if (!rec.pending) throw new QMSError(id + ' has no pending approval.');
      if (u.data.canApprove !== 'Yes') throw new QMSError(u.data.name + ' does not have approval authority.');
      if (rec.pending.requestedBy === userId) throw new QMSError('Segregation of duties: the requester cannot approve their own request.');
      if (!approve && isEmpty(comment)) throw new QMSError('A reason is required when rejecting.');
      const p = rec.pending;
      const t = findTransition(name, rec, p.to);
      if (approve) {
        const block = checkTransition(name, rec, t);
        if (block) throw new QMSError('Cannot approve: ' + block);
      }
      rec.approvals = rec.approvals || [];
      const signature = { decision: approve ? 'Approved' : 'Rejected', transition: p.transition, to: p.to, requestedBy: p.requestedBy, requestedAt: p.requestedAt, by: userId, byName: u.data.name, at: now().toISOString(), comment: comment || '' };
      signature.signatureHash = sha256(canonical(signature) + canonical(rec.data));
      if (approve) {
        rec.approvals.push(signature);
        applyTransition(name, rec, t, userId, comment, userId);
      } else {
        mutate(name, rec, userId, 'approval-rejected', comment, r => { r.approvals.push(signature); r.pending = null; }, { transition: p.transition });

      emit({ type: approve ? 'approved' : 'rejected', entity: name, id });

    }
    function withdraw(name, id, userId, comment) {
      const rec = raw(name, id);
      if (!rec || !rec.pending) throw new QMSError('Nothing to withdraw.');
      user(userId);
      if (rec.pending.requestedBy !== userId) throw new QMSError('Only the requester can withdraw an approval request.');
      mutate(name, rec, userId, 'approval-withdrawn', comment, r => { r.pending = null; });
      emit({ type: 'withdrawn', entity: name, id });
      return clone(rec);
    }

    function addAttachment(name, id, file, userId) {
      const rec = raw(name, id);
      if (!rec) throw new QMSError(id + ' not found');
      user(userId);
      if (!file || !file.name || typeof file.data !== 'string') throw new QMSError('Invalid attachment.');
      const size = file.size !== undefined ? file.size : Math.floor(file.data.length * 0.75);
      if (size > MAX_ATTACHMENT_BYTES) throw new QMSError('Attachment exceeds the ' + (MAX_ATTACHMENT_BYTES / 1048576) + ' MB limit.');
      const att = { id: 'ATT-' + sha256(id + '|' + file.name + '|' + now().toISOString() + '|' + rec.history.length).slice(0, 12), name: String(file.name).slice(0, 200), type: file.type || 'application/octet-stream', size, sha256: sha256(file.data), addedBy: userId, addedAt: now().toISOString(), description: file.description || '', data: file.data };
      mutate(name, rec, userId, 'attachment-added', att.name, r => { r.attachments.push(att); }, { attachment: { id: att.id, name: att.name, sha256: att.sha256 } });
      emit({ type: 'attachment', entity: name, id });

    }
    function removeAttachment(name, id, attId, userId, comment) {
      const rec = raw(name, id);
      if (!rec) throw new QMSError(id + ' not found');
      user(userId);
      if (isLocked(name, rec)) throw new QMSError('Evidence on a locked record cannot be removed.');
      if (isEmpty(comment)) throw new QMSError('A reason is required to remove evidence.');
      const att = rec.attachments.find(a => a.id === attId);
      if (!att) throw new QMSError('Attachment not found');
      mutate(name, rec, userId, 'attachment-removed', comment, r => { r.attachments = r.attachments.filter(a => a.id !== attId); }, { attachment: { id: att.id, name: att.name, sha256: att.sha256 } });
      emit({ type: 'attachment', entity: name, id });
    }
    function comment(name, id, userId, text) {
      const rec = raw(name, id);

      user(userId);
      if (isEmpty(text)) throw new QMSError('Comment is empty.');
      mutate(name, rec, userId, 'comment', String(text).slice(0, 5000), () => {});

    /* relationships: everything that references (entity,id), including table rows */
    function related(name, id) {
      const out = [];
      Object.keys(ENTITIES).forEach(en => {
        const e = ENTITIES[en];
        list(en).forEach(r => {
          e.fields.forEach(fd => {
            if (fd.type === 'ref' && fd.ref === name && r.data[fd.k] === id) out.push({ entity: en, record: r, via: fd.label, direction: 'in' });
            if (fd.type === 'refs' && fd.ref === name && (r.data[fd.k] || []).includes(id)) out.push({ entity: en, record: r, via: fd.label, direction: 'in' });
            if (fd.type === 'table') fd.columns.forEach(c => { if (c.type === 'ref' && c.ref === name && (r.data[fd.k] || []).some(row => row[c.k] === id)) out.push({ entity: en, record: r, via: fd.label + ' / ' + c.label, direction: 'in' }); });
          });
        });
      });
      const rec = raw(name, id);
      if (rec) ENTITIES[name].fields.forEach(fd => {
        const push = tid => { const t = raw(fd.ref, tid); if (t) out.push({ entity: fd.ref, record: t, via: fd.label, direction: 'out' }); };
        if (fd.type === 'ref' && rec.data[fd.k] && fd.ref !== 'people') push(rec.data[fd.k]);
        if (fd.type === 'refs') (rec.data[fd.k] || []).forEach(push);
        if (fd.type === 'table') fd.columns.forEach(c => { if (c.type === 'ref' && c.ref !== 'people') (rec.data[fd.k] || []).forEach(row => { if (row[c.k]) { const t = raw(c.ref, row[c.k]); if (t) out.push({ entity: c.ref, record: t, via: fd.label + ' / ' + c.label, direction: 'out' }); } }); });
      });
      const seen = new Set();
      return out.filter(x => { const k = x.entity + x.record.id + x.direction + x.via; if (seen.has(k)) return false; seen.add(k); return true; });
    }
    function traceChain(name, id, depth) {
      // Breadth-first walk of non-people relationships to show an end-to-end trace (e.g. complaint → NCR → CAPA → risk).
      const seen = new Set([name + ':' + id]), out = [];
      let frontier = [[name, id, 0]];
      while (frontier.length) {
        const next = [];
        frontier.forEach(([n, i, d]) => {
          if (d >= (depth || 3)) return;
          if (d > 0 && TRACE_HUBS.includes(n)) return; // shared hubs (e.g. a process) would link everything to everything
          related(n, i).forEach(x => {
            if (x.entity === 'people') return;
            const key = x.entity + ':' + x.record.id;
            if (seen.has(key)) return; seen.add(key);
            out.push({ entity: x.entity, id: x.record.id, depth: d + 1, from: i, via: x.via });
            next.push([x.entity, x.record.id, d + 1]);

        frontier = next;
      }
      return out;
    }

    function derive(name, rec) { const e = ent(name); return e.derive ? e.derive(rec, api, now()) : {}; }
    function dueOf(name, rec) { const e = ent(name); return e.due ? e.due(rec, api, now()) : null; }
    function dueItems(horizonDays) {
      const t = today(), out = [];
      Object.keys(ENTITIES).forEach(n => list(n).forEach(r => {
        const d = dueOf(n, r);
        if (!d || !d.date) return;
        const left = daysBetween(t, d.date);
        if (left <= (horizonDays === undefined ? 30 : horizonDays)) out.push({ entity: n, id: r.id, title: titleOf(n, r), label: d.label, date: d.date, daysLeft: left, overdue: left < 0, owner: r.data.owner || r.data.person || r.data.leadAuditor || r.data.chair || '' });
      }));

    function pendingApprovals() {

    }
    function titleOf(name, rec) {

      if (name === 'calibrations') { const q = raw('equipment', rec.data.equipment); return (q ? q.data.assetTag : '') + ' — ' + (rec.data.calDate || ''); }
      if (name === 'training') { const p = raw('people', rec.data.person); return (p ? p.data.name : '') + ' — ' + (rec.data.course || ''); }
      if (name === 'inspections') { const p = raw('inspPlans', rec.data.plan); return (p ? p.data.partNumber : '') + ' lot ' + (rec.data.lot || ''); }
      if (name === 'documents') return (rec.data.docNumber || '') + ' ' + (rec.data.title || '');
      return rec.data[e.titleField] || rec.id;
    }

    /* ---------------------------------------------------------------- integrity */
    function verifyRecord(name, rec, errors) {
      const e = ENTITIES[name];
      const where = name + '/' + rec.id;
      if (!new RegExp('^' + e.prefix + '-\\d{4,}$').test(rec.id)) errors.push({ where, code: 'bad-id', msg: 'ID does not match the ' + e.prefix + ' pattern' });
      if (!e.workflow.states.includes(rec.status)) errors.push({ where, code: 'bad-status', msg: 'Unknown status "' + rec.status + '"' });
      if (!Array.isArray(rec.history) || !rec.history.length) { errors.push({ where, code: 'no-history', msg: 'Revision history missing' }); return; }
      let prev = 'GENESIS';
      rec.history.forEach((h, i) => {
        const body = Object.assign({}, h); delete body.hash;
        if (h.prevHash !== prev) errors.push({ where, code: 'chain-broken', msg: 'History entry ' + (i + 1) + ' does not link to the previous entry' });
        if (sha256(prev + canonical(body)) !== h.hash) errors.push({ where, code: 'history-tampered', msg: 'History entry ' + (i + 1) + ' has been altered' });
        if (h.seq !== i + 1) errors.push({ where, code: 'seq', msg: 'History sequence gap at entry ' + (i + 1) });

        if (isEmpty(v)) return;

      });

    }
    function integrityCheck() {

      Object.keys(data.records).forEach(n => { if (!ENTITIES[n]) errors.push({ where: n, code: 'unknown-type', msg: 'Unknown record type in database' }); });
      Object.keys(ENTITIES).forEach(n => {
        const recs = data.records[n] || {};
        Object.keys(recs).forEach(id => {
          count++;
          const r = recs[id];
          if (!r || r.id !== id) { errors.push({ where: n + '/' + id, code: 'key-mismatch', msg: 'Record key does not match its ID' }); return; }
          verifyRecord(n, r, errors);
          const num = parseInt(id.split('-')[1], 10);
          if (num > (data.meta.seq[n] || 0)) errors.push({ where: n + '/' + id, code: 'seq', msg: 'ID is beyond the issued sequence' });
        });
        ENTITIES[n].fields.filter(fd => fd.unique).forEach(fd => {
          const seen = {};
          Object.values(recs).forEach(r => { const v = String(r.data[fd.k] || '').toLowerCase(); if (!v) return; if (seen[v]) errors.push({ where: n + '/' + r.id, code: 'duplicate', msg: fd.label + ' duplicates ' + seen[v] }); else seen[v] = r.id; });
        });
      });
      return { ok: errors.length === 0, count, errors, checkedAt: now().toISOString() };
    }

    /* ---------------------------------------------------------------- export */
    function csvCell(v) {
      let s = v === null || v === undefined ? '' : Array.isArray(v) ? v.join('; ') : String(v);

    }
    function toCSV(name) {
      const e = ent(name);
      const derivedCols = e.derivedList || [];
      const header = ['ID', 'Status'].concat(e.fields.map(fd => fd.label), derivedCols.map(d => d[1]), ['Pending approval', 'Attachments', 'Created', 'Last changed']);
      const rows = list(name).map(r => {
        const d = derive(name, r);
        const vals = e.fields.map(fd => {
          const v = r.data[fd.k];
          if (fd.type === 'table') return (v || []).map(row => fd.columns.map(c => row[c.k] === undefined ? '' : row[c.k]).join(' | ')).join(' ;; ');

        });

    }
    function auditTrailCSV() {
      const header = ['Timestamp', 'Record type', 'Record ID', 'Seq', 'User', 'Action', 'Transition', 'Field', 'From', 'To', 'Comment', 'Entry hash'];
      const rows = [];
      Object.keys(ENTITIES).forEach(n => list(n).forEach(r => r.history.forEach(h => {
        const base = [h.ts, ENTITIES[n].label, r.id, h.seq, h.user, h.action, h.transition || ''];
        const ch = h.changes && h.changes.length ? h.changes : [{ field: '', from: '', to: '' }];
        ch.forEach(c => rows.push(base.concat([c.field, typeof c.from === 'object' ? canonical(c.from) : c.from, typeof c.to === 'object' ? canonical(c.to) : c.to, h.comment, h.hash])));
      })));
      rows.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
      return '﻿' + [header].concat(rows).map(row => row.map(csvCell).join(',')).join('\r\n') + '\r\n';
    }

    /* ---------------------------------------------------------------- backup / restore */
    function logEvent(evt, userId, detail) { data.meta.events.push({ ts: now().toISOString(), user: userId || '', event: evt, detail: detail || '' }); if (data.meta.events.length > 1000) data.meta.events.shift(); }
    function backup(userId) {
      logEvent('backup-exported', userId);
      const payload = clone(data);
      let n = 0; Object.values(payload.records).forEach(m => (n += Object.keys(m).length));
      return { format: BACKUP_FORMAT, formatVersion: 1, schemaVersion: SCHEMA_VERSION, exportedAt: now().toISOString(), recordCount: n, sha256: sha256(canonical(payload)), data: payload };
    }
    const MIGRATIONS = { /* schemaVersion N -> N+1 functions go here: 1: d => { ... ; d.meta.schemaVersion = 2; return d; } */ };
    function inspectBackup(obj) {

      if (obj.formatVersion !== 1) problems.push('Unsupported backup format version ' + obj.formatVersion + '.');
      if (!obj.data || !obj.data.records || !obj.data.meta) return { ok: false, problems: problems.concat('Backup has no data section.') };
      if (sha256(canonical(obj.data)) !== obj.sha256) problems.push('Checksum mismatch: the file was modified or corrupted after export.');
      let d = clone(obj.data);
      if (obj.schemaVersion > SCHEMA_VERSION) problems.push('Backup was made by a newer schema (' + obj.schemaVersion + ') than this application (' + SCHEMA_VERSION + ').');
      for (let v = obj.schemaVersion; v < SCHEMA_VERSION; v++) { if (!MIGRATIONS[v]) { problems.push('No migration from schema ' + v); break; } d = MIGRATIONS[v](d); }
      Object.keys(ENTITIES).forEach(n => { if (!d.records[n]) d.records[n] = {}; });
      const tmp = createStore({ data: d, clock });
      const integ = tmp.integrityCheck();
      if (!integ.ok) problems.push(integ.errors.length + ' integrity error(s), first: ' + integ.errors[0].where + ' — ' + integ.errors[0].msg);

    }

    }

    /* ---------------------------------------------------------------- KPIs */
    function monthKey(d) { return d ? d.slice(0, 7) : ''; }
    function lastMonths(n) {
      const out = [], d = new Date(today() + 'T00:00:00Z'); d.setUTCDate(1);
      for (let i = n - 1; i >= 0; i--) { const x = new Date(d); x.setUTCMonth(d.getUTCMonth() - i); out.push(isoDate(x).slice(0, 7)); }
      return out;
    }
    function closedOn(rec) { for (let i = rec.history.length - 1; i >= 0; i--) if (rec.history[i].toStatus === 'Closed') return rec.history[i].ts.slice(0, 10); return null; }
    function kpis() {
      const t = today(), months = lastMonths(12);
      const capas = list('capas'), ncrs = list('ncrs'), cmps = list('complaints');
      const openCapas = capas.filter(r => !['Closed', 'Cancelled'].includes(r.status));
      const closed = capas.filter(r => r.status === 'Closed');
      const cycle = closed.map(r => daysBetween(r.data.openedDate, closedOn(r) || t));
      const onTime = closed.filter(r => (closedOn(r) || t) <= r.data.dueDate).length;
      const eqp = list('equipment').filter(r => r.status === 'In service');
      const eqStat = eqp.map(r => derive('equipment', r).calStatus);
      const trn = list('training').filter(r => r.status !== 'Cancelled');
      const trnDone = trn.filter(r => ['Completed', 'Verified'].includes(r.status));
      const trnOver = trn.filter(r => r.status === 'Assigned' && r.data.dueDate < t);
      const ins = list('inspections').filter(r => r.status !== 'Open');
      const yieldByMonth = months.map(m => { const xs = ins.filter(r => monthKey(r.data.inspDate) === m); const q = xs.reduce((s, r) => s + Number(r.data.qtyInspected || 0), 0); const rj = xs.reduce((s, r) => s + Number(r.data.qtyRejected || 0), 0); return q ? +(100 * (1 - rj / q)).toFixed(2) : null; });
      const totalQ = ins.reduce((s, r) => s + Number(r.data.qtyInspected || 0), 0), totalR = ins.reduce((s, r) => s + Number(r.data.qtyRejected || 0), 0);
      const evals = list('supplierEvals').filter(r => r.status === 'Completed');
      const sup = list('suppliers');
      const risks = list('risks').filter(r => r.status !== 'Closed');
      const heat = {}; risks.filter(r => r.data.kind === 'Risk').forEach(r => { const k = r.data.likelihood + 'x' + r.data.severity; heat[k] = (heat[k] || 0) + 1; });
      const objs = list('objectives').filter(r => r.status === 'Active').map(r => Object.assign({ id: r.id, title: r.data.title, target: r.data.target, unit: r.data.unit, direction: r.data.direction }, derive('objectives', r)));
      const audits = list('audits'); const yr = t.slice(0, 4);
      const auditsYr = audits.filter(r => (r.data.plannedDate || '').startsWith(yr) && r.status !== 'Cancelled');
      const findings = []; audits.forEach(a => (a.data.findings || []).forEach(x => findings.push(x.type)));
      const respondedCmps = cmps.filter(r => r.data.responseDate);
      const docs = list('documents');
      const due = dueItems(0);
      const summary = {
        capaOpen: openCapas.length,
        capaOverdue: openCapas.filter(r => { const d = dueOf('capas', r); return d && d.date < t; }).length,
        capaAvgCycleDays: cycle.length ? Math.round(cycle.reduce((a, b) => a + b, 0) / cycle.length) : null,
        capaOnTimePct: closed.length ? Math.round(100 * onTime / closed.length) : null,
        ncrOpen: ncrs.filter(r => !['Closed', 'Cancelled'].includes(r.status)).length,
        ncrLast12: ncrs.filter(r => months.includes(monthKey(r.data.detectedDate))).length,
        complaintsOpen: cmps.filter(r => !['Closed', 'Cancelled'].includes(r.status)).length,
        complaintAvgResponseDays: respondedCmps.length ? +(respondedCmps.reduce((s, r) => s + daysBetween(r.data.receivedDate, r.data.responseDate), 0) / respondedCmps.length).toFixed(1) : null,

<script>/* Offline QMS — browser application (no dependencies). */
(function () {
  'use strict';
  const Core = window.QMSCore, Seed = window.QMSSeed, E = Core.ENTITIES;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = v => String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isEmpty = v => v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);

  /* ------------------------------------------------------------ storage */
  const DBNAME = 'offline-qms', KEY = 'database', PREF = 'offline-qms-prefs';
  const Storage = {
    mode: 'memory', idb: null, mem: {},
    async init() {
      try {
        if (!window.indexedDB) throw new Error('no idb');
        this.idb = await new Promise((res, rej) => {
          const r = indexedDB.open(DBNAME, 1);
          r.onupgradeneeded = () => r.result.createObjectStore('kv');
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
          setTimeout(() => rej(new Error('idb timeout')), 4000);
        });
        this.mode = 'indexeddb';
      } catch (e) {
        try { localStorage.setItem('__qms_t', '1'); localStorage.removeItem('__qms_t'); this.mode = 'localstorage'; } catch (e2) { this.mode = 'memory'; }
      }
    },
    async get(k) {
      if (this.mode === 'indexeddb') return new Promise((res, rej) => { const q = this.idb.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); });
      if (this.mode === 'localstorage') return localStorage.getItem(DBNAME + ':' + k);
      return this.mem[k] || null;
    },
    async set(k, v) {
      if (this.mode === 'indexeddb') return new Promise((res, rej) => { const tx = this.idb.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
      if (this.mode === 'localstorage') return localStorage.setItem(DBNAME + ':' + k, v);
      this.mem[k] = v;
    },
    async del(k) {
      if (this.mode === 'indexeddb') return new Promise(res => { const tx = this.idb.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); });
      if (this.mode === 'localstorage') return localStorage.removeItem(DBNAME + ':' + k);
      delete this.mem[k];
    }
  };
  const prefs = (() => { try { return JSON.parse(localStorage.getItem(PREF) || '{}'); } catch (e) { return {}; } })();
  const savePrefs = () => { try { localStorage.setItem(PREF, JSON.stringify(prefs)); } catch (e) { /* storage unavailable */ } };

  /* ------------------------------------------------------------ state */
  let store = null, dirty = false, saveTimer = null, startupIntegrity = null, hasUndo = false;
  const me = () => prefs.user && store && store._raw('people', prefs.user) && store._raw('people', prefs.user).status === 'Active' ? prefs.user : null;
  const meRec = () => (me() ? store._raw('people', me()) : null);
  function setSaveState(t) { $('#saveState').textContent = t; }
  function scheduleSave() {
    setSaveState('Saving…');

      try { await Storage.set(KEY, store.serialize()); setSaveState(Storage.mode === 'memory' ? 'Not persisted' : 'All changes saved'); }
      catch (e) { setSaveState('Save failed'); toast('Could not save to browser storage: ' + e.message + '. Export a backup now.', true); }

  }

  /* ------------------------------------------------------------ ui helpers */

    : /^(Conditional|Due soon|Major|High)$/.test(s) ? 'warn' : 'info';

  /* dialog: returns object of values, or null if cancelled */

        (o.fields || []).map((f, i) => '<label class="fld"><span class="lbl">' + esc(f.label) + (f.required ? ' <span class="req" aria-hidden="true">*</span>' : '') + '</span>' +
          (f.type === 'textarea' ? '<textarea name="' + f.name + '" ' + (f.required ? 'required' : '') + (i === 0 ? ' autofocus' : '') + '>' + esc(f.value || '') + '</textarea>'

  function route() {

      tile('#/list/suppliers', s.supplierAvgScore, 'Avg supplier score', s.supplierApproved + ' approved suppliers') +

    h += '<div class="cols">';

    h += '<section class="panel"><h2>Risk register — open risks</h2>' + heatmap(k.riskHeat) + '</section>';
    h += '<section class="panel"><h2>Overdue and due in 14 days</h2>' + (due.length ? '<ul class="list-plain">' + due.slice(0, 10).map(d => '<li><span><a href="#/rec/' + d.entity + '/' + d.id + '">' + esc(d.id) + '</a> ' + esc(d.title) + ' <span class="muted">· ' + esc(d.label) + '</span></span><span class="nowrap">' + (d.overdue ? badge(-d.daysLeft + 'd overdue', 'crit') : badge(d.daysLeft === 0 ? 'today' : 'in ' + d.daysLeft + 'd', 'warn')) + '</span></li>').join('') + '</ul>' + (due.length > 10 ? '<p><a href="#/reports/due">All ' + due.length + ' items</a></p>' : '') : '<p class="empty">Nothing due.</p>') + '</section>';
    h += '<section class="panel"><h2>Audit findings by type</h2>' + hbarChart(k.findingsByType) + '<p class="muted" style="font-size:12px;margin:6px 0 0">Audit programme ' + s.auditsCompletedThisYear + ' of ' + s.auditsPlannedThisYear + ' completed this year.</p></section>';
    h += '<section class="panel"><h2>Nonconformances by detection point</h2>' + hbarChart(k.ncrBySource) + '</section>';
    h += '</div>';
    return h;
  }
  function dataTable(head, rows) { return '<details class="data-view"><summary>View data table</summary><table class="grid"><thead><tr>' + head.map((x, i) => '<th' + (i ? ' class="num"' : '') + '>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map((x, i) => '<td' + (i ? ' class="num"' : '') + '>' + esc(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></details>'; }
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  function barChart(labels, vals, keys, unit) {
    const W = 380, H = 170, L = 26, B = 22, T = 12, max = niceMax(Math.max.apply(null, vals.concat([1]))), bw = (W - L) / vals.length;
    let g = '';
    const steps = max < 4 ? max : 4;
    for (let i = 0; i <= steps; i++) { const y = T + (H - T - B) * (1 - i / steps); g += '<line class="grid-line" x1="' + L + '" x2="' + W + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 4) + '" y="' + (y + 3) + '" text-anchor="end">' + (+(max * i / steps).toFixed(1)) + '</text>'; }
    const peak = vals.indexOf(Math.max.apply(null, vals));
    vals.forEach((v, i) => {
      const h = (H - T - B) * v / max, x = L + i * bw + bw * 0.2, w = bw * 0.6, y = H - B - h;
      const r = Math.min(4, w / 2, h);
      g += v > 0 ? '<path class="bar" d="M' + x + ',' + (H - B) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (H - B) + 'Z"/>' : '';
      g += '<rect class="hit" x="' + (L + i * bw) + '" y="' + T + '" width="' + bw + '" height="' + (H - T - B) + '" data-tip="' + esc(keys[i] + ': ' + v + ' ' + unit) + '" tabindex="0"/>';
      g += '<text x="' + (x + w / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(labels[i]) + '</text>';
      if (i === peak && v > 0) g += '<text class="lbl-strong" x="' + (x + w / 2) + '" y="' + (y - 4) + '" text-anchor="middle">' + v + '</text>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bar chart of ' + esc(unit) + ' per month">' + g + '<line class="axis" x1="' + L + '" x2="' + W + '" y1="' + (H - B) + '" y2="' + (H - B) + '"/></svg>';
  }
  function lineChart(labels, vals, keys, target, unit) {
    const W = 380, H = 170, L = 32, B = 22, T = 12, R = 8;
    const present = vals.filter(v => v !== null).concat(target ? [Number(target)] : []);
    if (!present.length) return '<p class="empty">No data yet.</p>';
    let lo = Math.floor(Math.min.apply(null, present) - 0.5), hi = Math.ceil(Math.max.apply(null, present) + 0.3);
    if (hi > 100 && unit === '%') hi = 100; if (hi - lo < 2) lo = hi - 2;
    const sx = i => L + (W - L - R) * (vals.length === 1 ? 0.5 : i / (vals.length - 1)), sy = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, y = sy(v); g += '<line class="grid-line" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 4) + '" y="' + (y + 3) + '" text-anchor="end">' + (+v.toFixed(1)) + '</text>'; }
    if (target) g += '<line class="target" x1="' + L + '" x2="' + (W - R) + '" y1="' + sy(target) + '" y2="' + sy(target) + '"/>';
    let d = '', pen = false;
    vals.forEach((v, i) => { if (v === null) { pen = false; return; } d += (pen ? 'L' : 'M') + sx(i).toFixed(1) + ',' + sy(v).toFixed(1); pen = true; });
    g += '<path class="line" d="' + d + '"/>';
    let lastI = -1; vals.forEach((v, i) => { if (v !== null) lastI = i; });
    vals.forEach((v, i) => {
      g += '<text x="' + sx(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(labels[i]) + '</text>';
      if (v === null) return;
      if (i === lastI) g += '<circle class="dot" cx="' + sx(i) + '" cy="' + sy(v) + '" r="4.5"/><text class="lbl-strong" x="' + (sx(i) - 6) + '" y="' + (sy(v) - 8) + '" text-anchor="end">' + v + esc(unit) + '</text>';
      const bw = (W - L - R) / Math.max(1, vals.length - 1);
      g += '<rect class="hit" x="' + (sx(i) - bw / 2) + '" y="' + T + '" width="' + bw + '" height="' + (H - T - B) + '" data-tip="' + esc(keys[i] + ': ' + v + unit + (target ? ' (target ' + target + unit + ')' : '')) + '" tabindex="0"/>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Line chart">' + g + '</svg>';
  }
  function hbarChart(pairs) {
    const W = 380, rowH = 22, L = 130, H = pairs.length * rowH + 4, max = Math.max.apply(null, pairs.map(p => p[1]).concat([1]));
    let g = '';
    pairs.forEach(([lab, v], i) => {
      const y = i * rowH + 4, w = (W - L - 40) * v / max;
      g += '<text x="' + (L - 8) + '" y="' + (y + 14) + '" text-anchor="end">' + esc(lab) + '</text>';
      if (v > 0) { const r = Math.min(4, w); g += '<path class="bar" d="M' + L + ',' + (y + 3) + 'H' + (L + w - r) + 'Q' + (L + w) + ',' + (y + 3) + ' ' + (L + w) + ',' + (y + 3 + r) + 'V' + (y + 17 - r) + 'Q' + (L + w) + ',' + (y + 17) + ' ' + (L + w - r) + ',' + (y + 17) + 'H' + L + 'Z"/>'; }
      g += '<text class="lbl-strong" x="' + (L + w + 6) + '" y="' + (y + 14) + '">' + v + '</text>';
      g += '<rect class="hit" x="0" y="' + y + '" width="' + W + '" height="' + rowH + '" data-tip="' + esc(lab + ': ' + v) + '"/>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Horizontal bar chart">' + g + '<line class="axis" x1="' + L + '" x2="' + L + '" y1="0" y2="' + H + '"/></svg>';
  }
  function sparkline(vals, target) {
    if (!vals.length) return '';
    const W = 120, H = 28, all = vals.concat([Number(target)]), lo = Math.min.apply(null, all), hi = Math.max.apply(null, all), span = hi - lo || 1;
    const sx = i => 2 + (W - 8) * (vals.length === 1 ? 0.5 : i / (vals.length - 1)), sy = v => 3 + (H - 6) * (1 - (v - lo) / span);
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><line class="target" x1="2" x2="' + (W - 2) + '" y1="' + sy(target) + '" y2="' + sy(target) + '"/><path class="line" d="' + vals.map((v, i) => (i ? 'L' : 'M') + sx(i).toFixed(1) + ',' + sy(v).toFixed(1)).join('') + '"/><circle class="dot" r="3" cx="' + sx(vals.length - 1) + '" cy="' + sy(vals[vals.length - 1]) + '"/></svg>';
  }
  function heatmap(heat) {
    let g = '<div class="heat" role="table" aria-label="Risk heat map: likelihood rows, impact columns">';

      for (let s = 1; s <= 5; s++) { const n = heat[l + 'x' + s] || 0, z = Core.utils.riskRating(l * s).toLowerCase(); g += '<div role="cell" class="z-' + z + '" data-tip="' + esc('Likelihood ' + l + ' × impact ' + s + ' = ' + l * s + ' (' + z + '): ' + n + ' risk(s)') + '">' + (n ? '<span class="n">' + n + '</span>' : '') + '</div>'; }
    }
    g += '<div></div>' + [1, 2, 3, 4, 5].map(s => '<div class="ax">I' + s + '</div>').join('') + '</div>';

  }

  /* ------------------------------------------------------------ list */

  }

      '<label class="sr" for="statusFilter">Status</label><select id="statusFilter" data-n="' + n + '"><option value="">All statuses</option>' + e.workflow.states.map(s => '<option' + (s === st ? ' selected' : '') + '>' + esc(s) + '</option>').join('') + '<option value="__pending"' + (st === '__pending' ? ' selected' : '') + '>Awaiting approval</option></select>' +

  /* ------------------------------------------------------------ forms */

  function tableRow(fd, row, i, editable) {

  function roFieldHTML(fd, v) {

  function tableRefLinks(fd, v) {

  function collect(form, n) {
    const out = {};

        const rows = [];

      } else if (t === 'refs') out[k] = $$('input[type=checkbox]:checked', el).map(i => i.value);

    if (rec.pending) {

        '<div class="actions-bar" style="margin:8px 0 0">' + (can ? '<button class="btn primary" data-act="approve" data-n="' + n + '" data-id="' + id + '">Approve</button><button class="btn danger" data-act="reject" data-n="' + n + '" data-id="' + id + '">Reject</button>' : '') +
        (u && p.requestedBy === u.id ? '<button class="btn" data-act="withdraw" data-n="' + n + '" data-id="' + id + '">Withdraw request</button>' : '') +
        (!can && !(u && p.requestedBy === u.id) ? '<span class="muted">' + (u ? (u.data.canApprove !== 'Yes' ? 'You do not have approval authority.' : '') : 'Select an approver to decide.') + '</span>' : '') + '</div></div>';
    } else if (trs.length && u) {
      h += '<div class="actions-bar" role="group" aria-label="Workflow actions">' + trs.map((t, i) => '<div class="act-group"><button class="btn' + (i === 0 && !t.blocked ? ' primary' : '') + '" data-act="go" data-n="' + n + '" data-id="' + id + '" data-to="' + esc(t.to) + '"' + (t.blocked ? ' disabled aria-describedby="blk' + i + '"' : '') + '>' + esc(t.label) + (t.approval ? ' (needs approval)' : '') + '</button>' + (t.blocked ? '<span class="blocked" id="blk' + i + '">' + esc(t.blocked) + '</span>' : '') + '</div>').join('') + '</div>';

    if (tab === 'details') {
      h += '<form id="recForm" class="panel" data-n="' + n + '" data-id="' + id + '" novalidate><div class="form-grid">' + e.fields.map(fd => fieldHTML(n, fd, rec, editable)).join('') + '</div>' +
        (rec.data.kpiSnapshot ? '<h3>Performance snapshot captured when the meeting was recorded</h3>' + snapshotTable(rec.data.kpiSnapshot) : '') +

  /* ------------------------------------------------------------ reports */
  const REPORTS = [['capa', 'Corrective action register'], ['due', 'Overdue and upcoming'], ['trace', 'Traceability'], ['training', 'Training matrix'], ['calibration', 'Calibration status'], ['suppliers', 'Supplier performance'], ['audits', 'Audit programme'], ['activity', 'Recent activity']];
  function reportTable(head, rows, id) { return rows.length ? '<div class="tbl-wrap"><table class="grid" id="' + id + '"><thead><tr>' + head.map(x => '<th>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' : '<p class="empty">No data.</p>'; }
  function viewReports(which, q) {
    let body = '';

  });
  function markDirty() {
    dirty = true; const b = $('#saveBtn'), x = $('#discardBtn'); if (b) b.disabled = false; if (x) x.disabled = false; const nt = $('#dirtyNote'); if (nt) nt.textContent = 'Unsaved changes';
    // Workflow buttons may become valid once edits are saved: enable them; clicking saves first, then re-checks.
    $$('button[data-act=go][disabled]').forEach(btn => { btn.disabled = false; btn.removeAttribute('aria-describedby'); });
    $$('.actions-bar .blocked').forEach(el => { el.textContent = 'Your edits will be saved first, then this step is checked.'; });
  }
  document.addEventListener('input', ev => {
    if (ev.target.closest('#recForm')) markDirty();
    if (ev.target.id === 'listSearch') { const n = ev.target.dataset.n; (prefs['list:' + n] = prefs['list:' + n] || {}).q = ev.target.value; savePrefs(); clearTimeout(window.__lt); window.__lt = setTimeout(() => { prefs.lastFocus = 'listSearch'; render(); }, 180); }
  });
  document.addEventListener('change', async ev => {
    const t = ev.target;
    if (t.closest('#recForm')) markDirty();
    if (t.id === 'statusFilter' || t.id === 'openOnly' || t.id === 'overdueOnly') {
      const n = t.dataset.n, lp = prefs['list:' + n] = prefs['list:' + n] || {};
      if (t.id === 'statusFilter') lp.status = t.value; if (t.id === 'openOnly') lp.open = t.checked; if (t.id === 'overdueOnly') lp.overdue = t.checked;
      savePrefs(); if (location.hash.includes('open=1') && t.id === 'openOnly') location.hash = '#/list/' + n; else render();
    }
    if (t.id === 'userSel') { prefs.user = t.value; savePrefs(); render(); }
    if (t.id === 'traceSel') location.hash = '#/reports/trace?id=' + encodeURIComponent(t.value);
    if (t.id === 'restoreFile' && t.files[0]) restoreFrom(t.files[0], false);
    if (t.id === 'setupRestore' && t.files[0]) restoreFrom(t.files[0], true);
  });
  document.addEventListener('submit', async ev => {
    const f = ev.target;
    if (f.id === 'recForm') { ev.preventDefault(); if (!me()) return toast('Select a user first.', true); saveForm(f); }
    else if (f.id === 'commentForm') { ev.preventDefault(); try { store.comment(f.dataset.n, f.dataset.id, me(), $('#cmt').value); render(); } catch (e) { fail(e); } }
    else if (f.id === 'attForm') {
      ev.preventDefault();
      const files = Array.from($('#attFile').files); if (!files.length) return toast('Choose at least one file.', true);
      for (const file of files) {
        try { const url = await readFile(file); store.addAttachment(f.dataset.n, f.dataset.id, { name: file.name, type: file.type, size: file.size, data: String(url).split(',')[1] || '', description: $('#attDesc').value }, me()); toast('Attached ' + file.name); } catch (e) { fail(e); }
      }
      render();
    } else if (f.id === 'companyForm') { ev.preventDefault(); store.setCompany($('#companyName').value, me()); scheduleSave(); render(); toast('Saved.'); }
    else if (f.id === 'setupForm') {
      ev.preventDefault();
      const org = $('#s_org').value.trim(), name = $('#s_name').value.trim(), email = $('#s_email').value.trim();
      if (!org || !name) { $('.form-err', f).innerHTML = '<div class="banner crit" style="margin-top:8px">Organization and your name are required.</div>'; return; }
      try { const s = Core.createStore(); s.setCompany(org, ''); const p = s.create('people', Object.assign({ name, canApprove: 'Yes', isAdmin: 'Yes', department: 'Quality' }, email ? { email } : {}), ''); attachStore(s); prefs.user = p.id; savePrefs(); await Storage.set(KEY, s.serialize()); location.hash = '#/list/people'; render(); toast('System created. Add colleagues next: approvals need a second person with approval authority.'); }
      catch (e) { $('.form-err', f).innerHTML = '<div class="banner crit" style="margin-top:8px">' + esc(e.message) + '</div>'; }
    }
  });
  // navigation guard for unsaved edits
  let lastHash = location.hash;
  window.addEventListener('hashchange', async () => {
    if (dirty) {
      const target = location.hash; history.replaceState(null, '', lastHash || '#/dashboard');
      const ok = await ask({ title: 'Discard unsaved changes?', body: '<p style="margin:0">You have edits on this record that have not been saved.</p>', ok: 'Discard and leave', danger: true });
      if (!ok) return; dirty = false; location.hash = target; return;
    }
    lastHash = location.hash; if (store) render(); $('#main').focus({ preventScroll: true }); $('#main').scrollTop = 0;
  });
  window.addEventListener('beforeunload', ev => { if (dirty) { ev.preventDefault(); ev.returnValue = ''; } });
  // global search, keyboard
  $('#globalSearch').addEventListener('keydown', ev => { if (ev.key === 'Enter') location.hash = '#/search?q=' + encodeURIComponent(ev.target.value); });
  document.addEventListener('keydown', ev => {
    if (ev.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$('#dlg').open) { ev.preventDefault(); const s = $('#listSearch') || $('#globalSearch'); s.focus(); }
    if (ev.key === 'Escape' && document.body.classList.contains('nav-open')) { document.body.classList.remove('nav-open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); $('#menuBtn').focus(); }
  });
  $('#menuBtn').addEventListener('click', () => { const o = document.body.classList.toggle('nav-open'); $('#menuBtn').setAttribute('aria-expanded', String(o)); if (o) { const l = $('#side a'); l && l.focus(); } });
  // theme
  function applyTheme() { const t = prefs.theme || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; $('#themeBtn').setAttribute('aria-label', 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' theme'); }
  $('#themeBtn').addEventListener('click', () => { prefs.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; savePrefs(); applyTheme(); });
  // tooltips for chart marks
  const tip = $('#tip');
  const showTip = (el, x, y) => { tip.textContent = el.dataset.tip; tip.style.display = 'block'; const w = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - w - 8, x + 12) + 'px'; tip.style.top = (y - 32) + 'px'; };
  document.addEventListener('mousemove', ev => { const el = ev.target.closest && ev.target.closest('[data-tip]'); if (el) showTip(el, ev.clientX, ev.clientY); else tip.style.display = 'none'; });
  document.addEventListener('focusin', ev => { const el = ev.target.closest && ev.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } else tip.style.display = 'none'; });

  /* ------------------------------------------------------------ boot */
  window.QMSApp = { get store() { return store; }, set store(s) { store = s; }, Storage, render, lastIntegrity: null };
  async function boot() {
    applyTheme();
    await Storage.init();
    let raw = null; try { raw = await Storage.get(KEY); } catch (e) { raw = null; }
    try { hasUndo = !!(await Storage.get('pre-restore')); } catch (e) { hasUndo = false; }
    if (raw) {
      try { attachStore(Core.createStore({ data: JSON.parse(raw) })); startupIntegrity = store.integrityCheck(); window.QMSApp.lastIntegrity = startupIntegrity; }
      catch (e) { $('#main').innerHTML = '<div class="banner crit">The stored database could not be read (' + esc(e.message) + '). Restore a backup below.</div>'; store = null; }
    }
    setSaveState(Storage.mode === 'memory' ? 'Not persisted' : 'Saved locally');
    if (!store) { viewSetup(); return; }
    if (!me()) { const first = store.list('people').find(p => p.status === 'Active' && p.data.isAdmin === 'Yes'); if (first && !prefs.user) { prefs.user = first.id; savePrefs(); } }
    render();
  }
  boot();
})();
</script>
</body>
</html>
