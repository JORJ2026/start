/* ---------- small helpers ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const fin = (v, d = 0) => Number.isFinite(v) ? v : d;
const hyp = Math.hypot;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hslc(h, s, l, a = 1) { return `hsla(${((h % 360) + 360) % 360},${s}%,${l}%,${a})`; }
function shuffle(a, rng = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

/* ---------- easing + tween manager + spring ---------- */
const Ease = {
  lin: t => t,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
  inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  outQuad: t => 1 - (1 - t) * (1 - t),
  outBounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }
};
class Tweens {
  constructor() { this.l = []; }
  /** to(obj,'key',target,seconds,ease,delay) -> {then(fn)} for chaining */
  to(o, k, v, d, ease = Ease.outBack, delay = 0) {
    const t = { o, k, a: o[k], b: v, d: Math.max(d, 1e-4), e: ease, t: -delay, cb: null, started: delay <= 0 };
    this.l.push(t);
    const api = { then: fn => { t.cb = fn; return api; } };
    return api;
  }
  update(dt) {
    for (let i = this.l.length - 1; i >= 0; i--) {
      const t = this.l[i]; if (!t) continue; t.t += dt; if (t.t < 0) continue;
      if (!t.started) { t.a = t.o[t.k]; t.started = true; }
      const p = Math.min(1, t.t / t.d); t.o[t.k] = t.a + (t.b - t.a) * t.e(p);
      if (p >= 1) { this.l.splice(i, 1); if (t.cb) t.cb(); }
    }
  }
  clear() { this.l.length = 0; }
}
class Spring {
  constructor(k = 180, d = 11) { this.x = 0; this.v = 0; this.k = k; this.d = d; }
  step(target, dt) { const a = this.k * (target - this.x) - this.d * this.v; this.v += a * dt; this.x += this.v * dt; if (!Number.isFinite(this.x)) { this.x = 0; this.v = 0; } return this.x; }
  kick(v) { this.v += v; }
}

/* ---------- central event bus ---------- */
class Bus {
  constructor() { this.m = {}; }
  on(e, f) { (this.m[e] || (this.m[e] = [])).push(f); return this; }

}

function mergeDeep(def, o) {
  if (o === null || typeof o !== 'object' || Array.isArray(def)) return (typeof o === typeof def || def === undefined) && o !== undefined ? o : def;
  const r = {};
  for (const k in def) {
    if (def[k] && typeof def[k] === 'object' && !Array.isArray(def[k])) r[k] = mergeDeep(def[k], o[k]);
    else if (Array.isArray(def[k])) r[k] = Array.isArray(o[k]) ? o[k] : def[k];
    else r[k] = (typeof o[k] === typeof def[k]) ? o[k] : def[k];
  }
  // keep unknown dictionary-style keys (e.g. ach ids, daily scores)
  for (const k in o) if (!(k in r)) r[k] = o[k];
  return r;
}

  tone(f, d, type = 'square', v = 0.25, slide = 0, delay = 0, dest = null) {

  /** all sfx share one "arcade blip" palette with slight random pitch variation */
  sfx(name, a = 1) {

      case 'shot': if (this.squeaky) { this.tone(1300 * p, 0.09, 'sine', 0.22, 1.9); this.tone(1900 * p, 0.06, 'sine', 0.12, 0.8, 0.07); } else { this.tone(520 * p * a, 0.09, 'square', 0.13, 0.35); this.noise(0.05, 0.08, 4000, 1500); } break;
      case 'hit': this.tone(180 * p, 0.12, 'sawtooth', 0.22, 0.4); this.noise(0.1, 0.18, 1800, 300); break;
      case 'wall': this.tone(900 * p, 0.05, 'triangle', 0.1, 0.6); this.noise(0.04, 0.07, 6000, 3000); break;
      case 'dash': this.noise(0.18, 0.16, 500, 3500); this.tone(300 * p, 0.14, 'sine', 0.12, 2.2); break;
      case 'pickup': this.tone(660 * p, 0.09, 'square', 0.17); this.tone(880 * p, 0.09, 'square', 0.17, 0, 0.07); this.tone(1320 * p, 0.16, 'square', 0.17, 0, 0.14); break;
      case 'spawn': this.tone(440 * p, 0.06, 'triangle', 0.1, 1.5); break;
      case 'start': this.tone(440, 0.1, 'square', 0.2); this.tone(660, 0.1, 'square', 0.2, 0, 0.1); this.tone(880, 0.22, 'square', 0.22, 0, 0.2); break;
      case 'ready': this.tone(330, 0.12, 'triangle', 0.2); break;
      case 'kill': this.tone(300 * p, 0.25, 'sawtooth', 0.22, 0.25); this.noise(0.3, 0.22, 2400, 200); this.tone(660, 0.1, 'square', 0.15, 0, 0.16); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.14, 'square', 0.2, 0, i * 0.1)); break;
      case 'lose': [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.25, 0, i * 0.14)); break;
      case 'click': this.tone(700 * p, 0.04, 'square', 0.12); break;
      case 'back': this.tone(420 * p, 0.06, 'square', 0.12); break;
      case 'move': this.tone(560 * p, 0.025, 'triangle', 0.07); break;
      case 'pop': this.noise(0.12, 0.2, 2500, 600); this.tone(1000 * p, 0.1, 'square', 0.12, 0.4); break;
      case 'duck': this.tone(1500 * p, 0.12, 'sine', 0.2, 1.7); this.tone(1100 * p, 0.08, 'sine', 0.15, 0.7, 0.1); break;
      case 'tele': this.tone(300, 0.3, 'sine', 0.2, 4); this.tone(1200, 0.2, 'triangle', 0.1, 0.3, 0.1); break;
      case 'pad': this.tone(220 * p, 0.2, 'sine', 0.25, 4); break;
      case 'warn': this.tone(300 + 400 * a, 0.08, 'square', 0.1); break;
      case 'zap': this.noise(0.25, 0.25, 5000, 400); this.tone(120, 0.2, 'sawtooth', 0.2, 0.5); break;
      case 'ding': this.tone(988, 0.1, 'sine', 0.2); this.tone(1319, 0.3, 'sine', 0.2, 0, 0.08); break;
      case 'boom': this.noise(0.4, 0.3, 1200, 100); this.tone(90, 0.35, 'sawtooth', 0.3, 0.3); break;
      case 'star': this.tone(1568 * p, 0.05, 'sine', 0.1); break;
      case 'emote': this.tone(500 * p, 0.08, 'triangle', 0.15, 1.5); this.tone(700 * p, 0.1, 'triangle', 0.15, 1.2, 0.08); break;

  },
  voice(pitch = 1) { this.tone((260 + Math.random() * 160) * pitch, 0.045, 'square', 0.06); },
  play(name) {
    this.want = name;
    if (!this.ready) return;
    if (this.track === name && this.tr && !TRACKS[name].once) return;
    this.track = name; this.tr = TRACKS[name]; this.step = 0; this.nextT = this.ctx.currentTime + 0.06; this.done = false;

  },
  stopMusic() { this.track = null; this.tr = null; this.want = null; },
  sched() {
    if (!this.ready || !this.tr) return;

      if (tr.hat[s % 16] === 'x') this.noise(0.03, 0.05, 9000, 7000, t, this.musG);
      if (tr.sn[s % 16] === 'x') { this.noise(0.12, 0.12, 2500, 1500, t, this.musG); this.tone(190, 0.08, 'triangle', 0.1, 0.5, t, this.musG); }

  }
};

/* =====================================================================
   4. PARTICLES, FLOATING TEXT, BULLET POOL, FIGHTER ENTITY
   ===================================================================== */
class Particles {
  constructor(n = 1200) {
    this.p = []; this.n = n; this.i = 0; this.count = 0;
    for (let k = 0; k < n; k++) this.p.push({ a: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 3, col: '#fff', g: 0, drag: 0, shape: 0, rot: 0, vr: 0, add: false });
  }
  emit(x, y, vx, vy, life, size, col, o = {}) {
    if (this.count >= Q.particles) return;
    for (let t = 0; t < this.n; t++) {
      const p = this.p[this.i]; this.i = (this.i + 1) % this.n;
      if (!p.a) {
        p.a = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = p.max = life; p.size = size; p.col = col;
        p.g = o.g || 0; p.drag = o.drag || 0; p.shape = o.shape || 0; p.rot = rnd(TAU); p.vr = o.vr || 0; p.add = !!o.add; this.count++; return;
      }
    }
  }
  burst(x, y, n, col, speed = 200, life = 0.4, size = 3, o = {}) {
    for (let i = 0; i < n; i++) { const a = rnd(TAU), s = speed * rnd(0.3, 1); this.emit(x, y, Math.cos(a) * s, Math.sin(a) * s, life * rnd(0.6, 1.2), size * rnd(0.6, 1.2), col, o); }
  }
  dir(x, y, ang, spread, n, col, speed, life, size, o = {}) {
    for (let i = 0; i < n; i++) { const a = ang + rnd(-spread, spread), s = speed * rnd(0.4, 1); this.emit(x, y, Math.cos(a) * s, Math.sin(a) * s, life * rnd(0.6, 1.1), size * rnd(0.6, 1.2), col, o); }
  }
  ring(x, y, col, size = 8, life = 0.35) { this.emit(x, y, 0, 0, life, size, col, { shape: 2, add: true }); }
  confetti(x, y, n, power = 360) {
    const cols = ['#ff5a6a', '#ffd23f', '#4cf29a', '#3fb6ff', '#ff7ac8', '#fff'];
    for (let i = 0; i < n; i++) { const a = rnd(TAU), s = power * rnd(0.2, 1); this.emit(x, y, Math.cos(a) * s, Math.sin(a) * s - 120, rnd(0.9, 1.7), rnd(3, 6), pick(cols), { shape: 1, g: 420, drag: 1.4, vr: rnd(-12, 12) }); }
  }
  update(dt) {
    let c = 0;
    for (let k = 0; k < this.n; k++) {
      const p = this.p[k]; if (!p.a) continue;
      p.life -= dt; if (p.life <= 0) { p.a = false; continue; }
      c++; const d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy = p.vy * d + p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.shape === 2) p.size += 150 * dt;
    }
    this.count = c;
  }
  draw(c, add) {
    for (let k = 0; k < this.n; k++) {
      const p = this.p[k]; if (!p.a || p.add !== add) continue;
      const al = clamp(p.life / p.max, 0, 1); c.globalAlpha = al; c.fillStyle = c.strokeStyle = p.col;
      if (p.shape === 0) { c.beginPath(); c.arc(p.x, p.y, p.size * (0.4 + al * 0.6), 0, TAU); c.fill(); }
      else if (p.shape === 1) { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66); c.restore(); }
      else if (p.shape === 2) { c.lineWidth = 3 * al + 1; c.beginPath(); c.arc(p.x, p.y, p.size, 0, TAU); c.stroke(); }
      else if (p.shape === 3) { c.lineWidth = Math.max(1.5, p.size * 0.6); c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); c.stroke(); }
      else if (p.shape === 4) { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.beginPath(); for (let i = 0; i < 5; i++) { const a = i / 5 * TAU - Math.PI / 2, a2 = a + TAU / 10; c.lineTo(Math.cos(a) * p.size, Math.sin(a) * p.size); c.lineTo(Math.cos(a2) * p.size * 0.45, Math.sin(a2) * p.size * 0.45); } c.closePath(); c.fill(); c.restore(); }
    }
    c.globalAlpha = 1;
  }
  clear() { for (const p of this.p) p.a = false; this.count = 0; }
}

class FloatTexts {
  constructor(n = 40) { this.l = []; for (let i = 0; i < n; i++) this.l.push({ a: false, x: 0, y: 0, vy: -40, life: 0, max: 1, s: '', col: '#fff', size: 20, pop: 0 }); this.i = 0; }
  add(x, y, s, col = '#fff', size = 20, life = 0.9, vy = -50) {
    const t = this.l[this.i]; this.i = (this.i + 1) % this.l.length;
    t.a = true; t.x = x; t.y = y; t.s = s; t.col = col; t.size = size; t.life = t.max = life; t.vy = vy; t.pop = 0;
  }
  update(dt) { for (const t of this.l) { if (!t.a) continue; t.life -= dt; if (t.life <= 0) { t.a = false; continue; } t.y += t.vy * dt; t.vy *= 0.97; t.pop = Math.min(1, t.pop + dt * 6); } }
  draw(c) {
    for (const t of this.l) {
      if (!t.a) continue; const al = clamp(t.life / t.max * 2, 0, 1), sc = Ease.outBack(t.pop);
      c.save(); c.globalAlpha = al; c.translate(t.x, t.y); c.scale(sc, sc); label(c, t.s, 0, 0, t.size, t.col, 'center'); c.restore();
    }
    c.globalAlpha = 1;
  }
}

/* bullets: pooled; swept collision happens in Match */
class Bullet { constructor() { this.a = false; this.x = this.y = this.px = this.py = this.vx = this.vy = 0; this.r = 5; this.dmg = 10; this.owner = null; this.team = 0; this.life = 0; this.bounce = 0; this.col = '#fff'; this.id = 0; } }
const BulletPool = { list: [], init() { this.list = []; for (let i = 0; i < 300; i++) this.list.push(new Bullet()); }, get() { for (const b of this.list) if (!b.a) return b; return null; }, clear() { for (const b of this.list) b.a = false; } };

/* ---------------------------------------------------------------------
   FIGHTER
   --------------------------------------------------------------------- */
let FIGHTER_ID = 1;
class Fighter {
  constructor(o) {
    this.id = FIGHTER_ID++; this.fd = o.fd; this.variant = o.variant | 0; this.team = o.team | 0; this.slot = o.slot | 0; this.human = !!o.human; this.dev = o.dev || null;
    this.name = o.name || o.fd.name; this.hat = o.hat || 'none'; this.trail = o.trail || 'none'; this.accent = o.accent || accentOf(o.fd, this.variant);
    this.scale = o.scale || 1; this.r = CFG.R * this.scale; this.headScale = o.headScale || 1;
    this.speedMul = o.speedMul || 1; this.rateMul = o.rateMul || 1; this.spreadAdd = o.spreadAdd || 0;
    this.maxHp = Math.round(o.fd.hp * (o.hpMul || 1)); this.brain = null; this.isDrone = !!o.drone; this.isBoss = !!o.boss; this.targetDummy = !!o.dummy;
    this.stats = { shots: 0, hits: 0, dmg: 0, dashes: 0, kills: 0, streak: 0, best: 0, taken: 0, wallHits: 0, deaths: 0 };
    this.sqS = new Spring(240, 12); this.antS = new Spring(120, 7); this.hatS = new Spring(150, 8); this.sqAng = 0;
    this.blinkT = rnd(1, 3); this.blink = 0; this.celebrate = 0; this.emote = 0; this.emoteT = 0; this.anim = 'idle'; this.t = rnd(10);
    this.prevFire = false; this.fireToggle = false; this.aimLast = 0; this.trailT = 0; this.respawnT = 0; this.idleT = 0;
    this.reset(0, 0, 0);
  }
  reset(x, y, aim) {
    this.x = this.px = x; this.y = this.py = y; this.vx = this.vy = 0; this.aim = aim; this.hp = this.maxHp; this.shield = this.fd.shield || 0; this.dead = false;
    this.fireCd = 0.2; this.dashCd = 0; this.dashT = 0; this.dashX = 1; this.dashY = 0; this.invuln = CFG.spawnProtect + CFG.introTime; this.hitFlash = 0; this.stun = 0;
    this.rapidT = 0; this.spreadT = 0; this.launchT = 0; this.lx = 0; this.ly = 0; this.teleCd = 0; this.padCd = 0; this.lastHitBy = null; this.lastHitT = -99;
    this.recoil = 0; this.spawnT = 0; this.deathT = 0; this.celebrate = 0; this.untouched = true; this.noShootT = 0; this.alpha = 1;
    this.sqS.x = -0.5; this.sqS.v = 20; // spawn-in pop
  }
  get dashMax() { return this.fd.dashCd; }
  get dashFrac() { return clamp(1 - this.dashCd / this.dashMax, 0, 1); }
  speed(m) { let s = this.fd.speed * this.speedMul; if (m && m.mods.double) s *= 1.45; if (m && m.mods.tiny) s *= 1.1; return s; }
  /** step movement & timers; inp = {mx,my,dash} */
  update(dt, inp, m) {
    this.px = this.x; this.py = this.y; this.t += dt;
    for (const k of ['fireCd', 'dashCd', 'invuln', 'hitFlash', 'stun', 'rapidT', 'spreadT', 'teleCd', 'padCd', 'celebrate', 'emoteT', 'recoil']) if (this[k] > 0) this[k] = Math.max(0, this[k] - dt);
    this.noShootT += dt;
    if (this.deathT > 0) return;
    let mx = inp.mx, my = inp.my;
    if (this.stun > 0) { mx *= 0.3; my *= 0.3; }
    const spd = this.speed(m) * (m.arena.onStrip(this) ? CFG.stripMul : 1), ice = m.mods.ice;
    if (this.launchT > 0) { this.launchT -= dt; this.vx = this.lx; this.vy = this.ly; }
    else if (this.dashT > 0) { this.dashT -= dt; this.vx = this.dashX * CFG.dashSpeed * (m.mods.double ? 1.2 : 1); this.vy = this.dashY * CFG.dashSpeed * (m.mods.double ? 1.2 : 1); if (Math.random() < 0.8) m.fx.emit(this.x, this.y, rnd(-30, 30), rnd(-30, 30), 0.28, this.r * 0.6, TEAM_COL[this.team], { add: true }); }
    else { const a = Math.min(1, (ice ? CFG.iceAccel : CFG.accel) * dt); this.vx += (mx * spd - this.vx) * a; this.vy += (my * spd - this.vy) * a; }
    if (inp.dash && this.dashCd <= 0 && this.dashT <= 0 && this.launchT <= 0 && this.stun <= 0) this.startDash(inp, m);
    const ox = this.x, oy = this.y;
    const hit = m.arena.moveCircle(this, this.vx * dt, this.vy * dt);
    if (hit && dt > 0) { this.vx = (this.x - ox) / dt; this.vy = (this.y - oy) / dt; if (this.dashT > 0 && hyp(this.vx, this.vy) < CFG.dashSpeed * 0.4) this.dashT = 0; if (this.launchT > 0 && hyp(this.vx, this.vy) < CFG.padLaunch * 0.4) this.launchT = 0; }
    if (!Number.isFinite(this.x) || !Number.isFinite(this.y)) { this.x = this.px || WW / 2; this.y = this.py || WH / 2; this.vx = this.vy = 0; }
    this.visUpdate(dt, m);
  }
  startDash(inp, m) {
    let dx = inp.mx, dy = inp.my; if (hyp(dx, dy) < 0.2) { dx = Math.cos(this.aim); dy = Math.sin(this.aim); }
    const l = hyp(dx, dy) || 1; this.dashX = dx / l; this.dashY = dy / l; this.dashT = CFG.dashTime; this.dashCd = this.dashMax * (m.mods.double ? 0.8 : 1);
    this.sqAng = Math.atan2(this.dashY, this.dashX); this.sqS.x = -0.35; this.sqS.v = 90; this.stats.dashes++;     // anticipation squash, then spring follow-through
    m.fx.ring(this.x, this.y, TEAM_COL[this.team], this.r, 0.25); m.fx.burst(this.x, this.y, 6, '#fff', 120, 0.25, 2.5, { add: true });

  }
  visUpdate(dt, m) {
    const sp = hyp(this.vx, this.vy);

  }
  get mood() {
    if (this.dead) return { e: 'spiral', m: 'wavy' };
    if (this.celebrate > 0) return { e: 'happy', m: 'smile' };
    if (this.stun > 0) return { e: 'spiral', m: 'wavy' };
    if (this.hitFlash > 0) return { e: 'wide', m: 'o' };
    if (this.emoteT > 0 && this.emote === 4) return { e: 'squint', m: 'smile' };
    if (this.emoteT > 0 && this.emote === 2) return { e: 'happy', m: 'o' };
    if (this.dashT > 0) return { e: 'squint', m: 'wavy' };
    if (this.recoil > 0.4) return { e: 'squint', m: 'gritted' };
    if (this.stats.streak >= 3) return { e: 'sparkly', m: 'smile' };
    if (this.blink > 0) return { e: 'blink', m: 'smile' };
    return { e: 'normal', m: 'smile' };
  }
}

/* =====================================================================
   5. ARENAS & COLLISION, PATHFINDING, AI
   ===================================================================== */
/** push circle {x,y,r} out of rect; returns true if it moved */
function pushOut(c, s) {
  const nx = clamp(c.x, s.x, s.x + s.w), ny = clamp(c.y, s.y, s.y + s.h), dx = c.x - nx, dy = c.y - ny, d2 = dx * dx + dy * dy;
  if (d2 >= c.r * c.r) return false;
  if (d2 > 1e-6) { const d = Math.sqrt(d2), p = c.r - d; c.x += dx / d * p; c.y += dy / d * p; }
  else {
    const l = c.x - s.x, r = s.x + s.w - c.x, t = c.y - s.y, b = s.y + s.h - c.y, m = Math.min(l, r, t, b);
    if (m === l) c.x = s.x - c.r; else if (m === r) c.x = s.x + s.w + c.r; else if (m === t) c.y = s.y - c.r; else c.y = s.y + s.h + c.r;
  }

      if (h) players.push({ human: true, dev: h.d, fid, variant: k === 0 ? Save.data.equip.variant : k, team, name: 'P' + (k + 1), hat: k === 0 ? Save.data.equip.hat : 'none', trail: k === 0 ? Save.data.equip.trail : 'none' });

  bus: new Bus(), tw: new Tweens(), fx: new Particles(1200), texts: new FloatTexts(48), scenes: {}, scene: null, name: '', bg: null, tr: { p: 0, busy: false }, toasts: [],
  fps: 60, debugOn: DEBUG, hs: 0, slow: { t: 0, f: 1 }, acc: 0, last: 0, crashed: false, lastSay: -99, adapt: 2, lowStreak: 0, frames: 0, ftAcc: 0, lastQ: -1,

      controls: new ControlsScene(), howto: new HowToScene(), credits: new CreditsScene(), lobby: new LobbyScene(), custom: new CustomScene(), cutscene: new CutsceneScene(), results: new ResultsScene(), match: new MatchScene() };
    this.applyQuality(true); this.resize(); window.addEventListener('resize', () => this.resize()); window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 150));

  },
  crash(err) { try { console.error(err); } catch (e) { } this.crashed = true; errBox.style.display = 'flex'; },
  resize() {
    const cw = Math.max(200, window.innerWidth || 1280), ch = Math.max(200, window.innerHeight || 720), dpr = Math.min(window.devicePixelRatio || 1, 2) * Q.res;
    canvas.width = Math.max(1, Math.floor(cw * dpr)); canvas.height = Math.max(1, Math.floor(ch * dpr)); canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';

    else { L.s = Math.min(cw / 1280, ch / 760); L.w = cw / L.s; L.h = ch / L.s; L.as = 1; L.ax = (L.w - WW) / 2; L.ay = (L.h - 760) / 2 + 40; }

  /* ----- scene manager with iris transition ----- */
  setScene(name, args) {
    if (this.scene && this.scene.exit) { try { this.scene.exit(); } catch (e) { console.error(e); } }
    this.name = name; this.scene = this.scenes[name]; this.fx.clear(); Input.touchMode = false; Input.clearTouches(); Input.capture = null;
    if (this.scene.enter) this.scene.enter(args); Sound.applyVol();

  go(name, args, instant) {

    if (instant || !this.scene) { swap(); return; }

  launch(id) {

      case 'tourney': return this.tourneyStart();
      case 'versus': return this.go('lobby');

      case 'koth': return this.go('match', { kind: 'koth', mode: 'koth', arena, pickups: true, limit: CFG.kothLimit, players: [this.me(), this.bot(1, d), this.bot(2, d)] });
      case 'target': return this.go('match', { kind: 'target', mode: 'target', arena, pickups: false, hazards: false, limit: 9999, players: [this.me()] });
      case 'training': return this.go('match', { kind: 'training', mode: 'training', arena: 'crossfire', pickups: false, hazards: false, limit: 9999, players: [this.me(), { human: false, fid: 'bulwark', team: 1, dummy: true, hat: 'cone', name: 'DUMMY', diff: 'easy' }] });
      case 'daily': {
        const dt = new Date(), key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'), seed = +key.replace(/-/g, ''), r = mulberry32(seed);
        const ar = ARENAS[Math.floor(r() * ARENAS.length)].id, mods = shuffle(MODIFIERS.map(m => m.id), r).slice(0, 2), per = Object.keys(PERSONAS)[Math.floor(r() * 3)], fid = FIGHTERS[Math.floor(r() * FIGHTERS.length)].id, df = r() < 0.5 ? 'normal' : 'hard';
        return this.go('match', { kind: 'rounds', mode: 'daily', dailyKey: key, seed, arena: ar, mods, hazards: r() < 0.5, limit: 5, players: [this.me(), { human: false, fid, team: 1, diff: df, persona: per, variant: 1, name: 'DAILY BOT' }] });
      }
    }
  },
  /* ----- tournament orchestration ----- */
  tourneyCfg(i) {
    const R = TOURNEY[i], bot = { human: false, fid: R.fighter, team: 1, diff: R.diff, persona: R.persona, name: R.rival, variant: 2, boss: !!R.boss, hat: R.boss ? 'crown' : 'none', accent: R.boss ? '#ffb300' : undefined };
    return { kind: 'rounds', mode: 'tourney', tourneyRound: i, arena: R.arena, limit: R.limit, hazards: R.hazards, boss: !!R.boss, bossLabel: R.boss ? 'BOSS DUEL - FIRST TO 3' : 'ROUND ' + (i + 1) + '/5: ' + R.name.toUpperCase() + ' - FIRST TO ' + R.limit, players: [this.me(), bot] };
  },
  cutscene(script, rival, bg, next) { this.go('cutscene', { script, rivalName: rival ? rival.rival : '', rivalFighter: rival ? rival.fighter : 'zip', rivalHat: rival && rival.boss ? 'crown' : 'none', bg, next: () => next() }, this.tr.busy); },
  tourneyStart() { Save.data.tourney = { active: true, round: 0, flawless: true, won: false }; Save.save(); this.cutscene(CUTSCENES.intro, null, 0, () => this.tourneyRound()); },
  tourneyContinue() { this.tourneyRound(); },
  tourneyRound() {
    const i = clamp(Save.data.tourney.round, 0, 4);
    if (i === 0 && !this._introDone) { this._introDone = true; }
    this.cutscene(CUTSCENES[i], TOURNEY[i], i, () => this.setScene('match', this.tourneyCfg(i)));
  },
  tourneyEnding() {
    const flawless = Save.data.tourney.flawless; Save.data.tourney.active = false; Save.data.tourney.won = true; Save.save(); this.unlock('champ');
    const credits = () => this.setScene('credits', { final: true });
    this.cutscene(CUTSCENES.win, TOURNEY[4], 4, () => { if (flawless) this.cutscene(CUTSCENES.flawless, TOURNEY[4], 2, credits); else credits(); });
  },

  /* ----- results ----- */
  endMatch(m) {
    const cfg = m.cfg, p = m.p1, S = Save.data, st = S.stats, ps = p ? p.stats : { shots: 0, hits: 0, dmg: 0, dashes: 0, best: 0, kills: 0, deaths: 0, wallHits: 0, taken: 0 };
    const oldStars = S.stars; let win = false, title = 'MATCH OVER', scoreLine = '', stars = 3; const rows = []; const unlocks = [];
    const acc = ps.shots ? Math.round(ps.hits / ps.shots * 100) : 0;
    if (m.kind === 'rounds') { win = m.winTeam === (p ? p.team : 0); const mine = m.scores[p ? p.team : 0]; const other = m.scores.filter((s, i) => i !== (p ? p.team : 0)); scoreLine = m.humans.length > 1 ? m.scores.slice(0, 4).filter((s, i) => m.fighters.some(f => f.team === i)).map((s, i) => TEAM_NAME[i] + ' ' + s).join('   ') : mine + '  -  ' + Math.max(...other); title = m.humans.length > 1 ? (TEAM_NAME[m.winTeam] + ' WINS!') : (win ? 'VICTORY!' : 'DEFEAT'); stars = 3 + ps.kills + (win ? 8 : 0) + m.stuff.stars; }
    else if (m.kind === 'koth') { win = m.winTeam === 0; title = win ? 'KING OF THE HILL!' : 'DETHRONED'; scoreLine = Math.floor(m.scores[0]) + ' s held'; stars = 3 + Math.floor(m.scores[0] / 5) + (win ? 6 : 0) + m.stuff.stars; }
    else if (m.kind === 'survival') { title = 'WAVE ' + m.waveN; scoreLine = 'Score ' + m.score; stars = 2 + m.waveN * 3 + m.survKills; const lb = S.scores.survival; lb.push({ s: m.score, w: m.waveN }); lb.sort((a, b) => b.s - a.s); lb.length = Math.min(lb.length, 5); if (lb[0].s === m.score) { rows.push(['NEW HIGH SCORE!', m.score]); } win = m.waveN >= 3; }
    else if (m.kind === 'target') { title = 'TIME!'; scoreLine = 'Score ' + m.score; stars = 3 + Math.floor(m.score / 40); const lb = S.scores.target; lb.push({ s: m.score }); lb.sort((a, b) => b.s - a.s); lb.length = Math.min(lb.length, 5); if (lb[0].s === m.score) rows.push(['NEW HIGH SCORE!', m.score]); win = m.score >= 150; }
    if (m.kind === 'target') { const sh = ps.shots; rows.push(['Targets hit', m.hitsT], ['Accuracy', sh ? Math.round(m.hitsT / sh * 100) + '%' : '-']); }
    else { rows.push(['Accuracy', acc + '%'], ['Damage dealt', Math.round(ps.dmg)], ['Dashes', ps.dashes], ['Longest streak', ps.best], ['Kills', ps.kills]); }
    rows.push(['Match time', fmtTime(m.time)]);
    if (m.kind === 'survival') rows.unshift(['Bots defeated', m.survKills], ['Best score', S.scores.survival[0].s]);
    if (m.kind === 'target') rows.unshift(['Best score', S.scores.target[0].s]);
    // daily
    if (cfg.mode === 'daily') { const prev = S.scores.daily[cfg.dailyKey]; const rec = { win, time: Math.round(m.time), kills: ps.kills }; if (!prev || (win && (!prev.win || rec.time < prev.time))) S.scores.daily[cfg.dailyKey] = rec; rows.push(['Daily best', win ? S.scores.daily[cfg.dailyKey].time + 's' : 'not yet']); const dk = Object.keys(S.scores.daily).sort().slice(-14); const nd = {}; dk.forEach(k => nd[k] = S.scores.daily[k]); S.scores.daily = nd; if (win) stars += 5; }
    // stats and achievements
    st.matches++; if (win) st.wins++; st.shots += ps.shots; st.hits += ps.hits; st.dashes += ps.dashes; st.kills += ps.kills; st.bestStreak = Math.max(st.bestStreak, ps.best); st.playSeconds += m.time; st.deaths += ps.deaths;
    if (win && m.fighters.some(f => !f.human && f.diffKey === 'hard') && m.kind === 'rounds') { st.hardWins++; this.unlock('hard'); }
    if (m.kind === 'rounds' && win && m.scores.filter((s, i) => i !== 0).every(s => s === 0) && m.humans.length === 1 && m.limit >= 5) this.unlock('flawless');
    if (ps.dashes >= 8) this.unlock('dodge'); if (ps.wallHits >= 25) this.unlock('wall');
    // award
    const award = ps.dashes >= 8 ? 'Dodge Roll Model' : ps.wallHits >= 15 ? 'Wall Hugger' : acc >= 60 && ps.shots > 12 ? 'Sharpshooter' : ps.taken > 250 && !win ? 'Professional Target' : ps.shots < 14 && win ? 'Minimalist' : ps.best >= 3 ? 'Streak Machine' : 'Participation Trophy (Gold Plated)';
    // tournament progress
    const buttons = []; let again = Object.assign({}, cfg, { rematch: true });
    if (cfg.mode === 'tourney') {
      const T = S.tourney; if (win) { T.round = cfg.tourneyRound + 1; if (m.scores[1] > 0) T.flawless = false; stars += 5; rows.unshift(['Round', (cfg.tourneyRound + 1) + '/5']); }
      Save.save();
      if (win && cfg.tourneyRound >= 4) buttons.push({ label: 'The Finale!', action: () => Game.go('__call', () => Game.tourneyEnding()) });
      else if (win) buttons.push({ label: 'Next Round', action: () => Game.tourneyRound() });
      else buttons.push({ label: 'Retry Round', action: () => Game.go('match', again) });
      buttons.push({ label: 'Menu', action: () => Game.go('title') });
    } else if (cfg.mode === 'training') { buttons.push({ label: 'Menu', action: () => Game.go('title') }); }
    else {
      buttons.push({ label: cfg.mode === 'survival' || cfg.mode === 'target' ? 'Try Again' : 'Rematch', action: () => Game.go('match', again) });
      if (cfg.mode !== 'daily') buttons.push({ label: 'Change Arena', action: () => Game.go('arenas', { ret: 'results', cfg, res: Game.lastResults }) });
      buttons.push({ label: 'Menu', action: () => Game.go('title') });
    }
    stars = Math.max(1, Math.round(stars)); S.stars += stars;
    [...HATS.map(h => [h, 'hats', 'Hat']), ...TRAILS.map(h => [h, 'trails', 'Trail']), ...Object.keys(SKINS).map(k => [Object.assign({ id: k }, SKINS[k]), 'skins', 'Skin'])].forEach(([it, key, nm]) => { if (it.cost > 0 && !S.unlocked[key].includes(it.id) && it.cost > oldStars && it.cost <= S.stars) unlocks.push('Wardrobe: you can now afford the ' + it.name + ' (' + nm + ')!'); });
    Save.save();
    const pts = (win ? 45 : 10) + clamp(acc, 0, 100) * 0.3 + clamp(ps.best, 0, 5) * 4 + clamp(ps.dashes, 0, 10) - clamp(ps.deaths, 0, 10) * 1.5, grade = pts >= 82 ? 'S' : pts >= 68 ? 'A' : pts >= 52 ? 'B' : pts >= 38 ? 'C' : 'D';
    const res = { title, win, cfg, scoreLine, rows, stars, award, unlocks, buttons, grade, replay: m.replayBuf.slice(-80) };
    this.lastResults = res; this.bus.emit('matchEnd', { m, win });
    if (cfg.mode !== 'training') this.go('results', res);
  },

  /* ----- narrator + achievements + director wiring through the event bus ----- */
  say(cat, n) {
    const sc = this.scene; if (!(sc instanceof MatchScene) || sc.attract || !sc.p1) return; const now = sc.time; if (now - this.lastSay < 3.4 && cat !== 'win' && cat !== 'boss') return;
    const list = NARRATOR[cat]; if (!list) return; const line = pick(list).replace('{n}', mangle(n || 'Someone')); this.lastSay = now;
    sc.sub = { text: line, t: 0, len: line.length / 38, n: 0, pitch: rnd(0.8, 1.2) }; Sound.duck(0.4, line.length / 38 + 0.2); this.bus.emit('narrate', { line });
  },
  wire() {
    const b = this.bus, G = this;
    b.on('matchStart', ({ m }) => { if (m.attract) return; G.lastSay = -99; m.scorePop = [0, 0, 0, 0]; setTimeout(() => G.say(m.cfg.boss ? 'boss' : m.cfg.rematch ? 'rematch' : 'start'), 600); });
    b.on('kill', ev => {
      const m = ev.m; if (!m || m.attract || m !== G.scene) return; const k = ev.killer, v = ev.victim;
      if (m.scorePop && k) { m.scorePop[k.team] = 1; G.tw.to(m.scorePop, k.team, 0, 0.6, Ease.outElastic); }
      if (!k || !k.human || v.isDrone) { if (v.human) G.say('lose'); return; }
      G.unlock('first'); if (k.stats.streak >= 3) G.unlock('streak3');
      let said = false; const my = m.scores[k.team], opp = Math.max(...m.scores.filter((s, i) => i !== k.team));
      if (m.kind === 'rounds' && m.humans.length === 1) {
        if (opp - (my - 1) >= 2 && my >= opp) { m.callout('COMEBACK!', '#ff9f43'); G.say('comeback'); said = true; }
        else if (k.stats.streak >= 4) { m.callout('UNSTOPPABLE!'); G.say('streak', k.name); said = true; }
        else if (k.stats.streak === 3) { m.callout('TRIPLE THREAT!'); G.say('streak', k.name); said = true; }
        else if (k.stats.streak === 2) { m.callout('DOUBLE TAP!'); said = true; }
        if (k.untouched && !said) { m.callout('UNTOUCHABLE!', '#5fd0ff'); G.say('flawless'); said = true; } else if (k.untouched) m.callout('UNTOUCHABLE!', '#5fd0ff');
        if (!said && my === m.limit - 1) { G.say('close'); said = true; }
        if (!said) { if (!m.stuff.firstDone) { m.stuff.firstDone = true; G.say('first'); } else G.say('kill', k.name); }
      } else G.say('kill', k.name);
    });
    b.on('matchEnd', ({ m, win }) => { if (m.attract) return; });
    b.on('idle', () => G.say('idle')); b.on('jellyPop', () => { if (Save.data.stats.pops >= 5) G.unlock('pop'); G.say('pop'); });
    b.on('teleport', () => { if (Math.random() < 0.25) G.say('tele'); });
    b.on('bossPhase', () => G.say('boss')); b.on('pacifist', () => G.unlock('pacifist'));
    b.on('secretButton', ({ f }) => { const sc = G.scene; G.unlock('dance'); if (sc && sc.mascot) { sc.mascot.dance = 6; sc.mascot.sign = 'GROOVE!'; sc.mascot.t = 4; } Sound.sfx('ding'); G.fx.confetti(f.x, f.y, 30, 300); });
    b.on('director', e => { if (G.debugOn && G.scene && G.scene.feed) G.scene.feed.push({ t: 0, text: 'director: ' + e.what, col: '#9fffbf' }); });
    b.on('matchEnd', ({ m, win }) => { if (m.attract) return; G.say(win ? 'win' : 'lose'); });
  },

  /* ----- main loop: fixed 60 Hz update, interpolated render, capped dt ----- */
  loop(ts) {
    requestAnimationFrame(t => this.loop(t));
    if (this.crashed) return;
    try {
      let dt = (ts - this.last) / 1000; this.last = ts; if (!Number.isFinite(dt) || dt <= 0) dt = 1 / 60; dt = Math.min(dt, CFG.maxDt);
      this.fps = lerp(this.fps, 1 / dt, 0.05); this.frames++; this.ftAcc += dt;
      if (this.ftAcc >= 1.5) { const avg = this.ftAcc / this.frames; this.frames = 0; this.ftAcc = 0; if (!document.hidden && this.scene && this.scene !== this.scenes.boot) { if (avg > 1 / 43) { if (++this.lowStreak >= 2 && this.adapt > 0) { this.adapt--; this.lowStreak = 0; this.applyQuality(); } } else this.lowStreak = 0; } }
      Input.begin();
      if (Input.pressed.has('KeyM') && !Input.capture) Sound.toggleMute();
      if (Input.pressed.has('F3')) this.debugOn = !this.debugOn;
      if (Input.konamiHit) this.toggleSqueak();
      if (this.tr.busy) { Input.nav = {}; Input.ptr.length = 0; }
      this.tw.update(dt); const sc = this.scene;
      if (sc.frame) sc.frame(dt);
      let tsc = 1; if (this.hs > 0) { this.hs -= dt; tsc = 0; } else if (this.slow.t > 0) { this.slow.t -= dt; tsc = this.slow.f; }
      this.acc += dt * tsc; let n = 0;
      while (this.acc >= TICK && n < 5) { if (sc.tick) sc.tick(TICK); this.fx.update(TICK); this.texts.update(TICK); this.acc -= TICK; n++; }
      if (n >= 5) this.acc = 0;
      for (const t of this.toasts) t.t += dt; while (this.toasts.length && this.toasts[0].t > 3.6) this.toasts.shift();
      this.render(this.acc / TICK);
      Input.end();
    } catch (e) { this.crash(e); }
  },
  render(al) {
    const c = ctx; c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = PAL.ui; c.fillRect(0, 0, canvas.width, canvas.height); c.setTransform(L.k, 0, 0, L.k, 0, 0);
    this.scene.render(c, al); canvas.style.cursor = (this.scene instanceof MatchScene && this.scene.cursorHidden) ? 'none' : '';
    // toasts
    this.toasts.forEach((t, i) => { const k = Ease.outBack(clamp(t.t / 0.35, 0, 1)), a = clamp((3.6 - t.t) / 0.4, 0, 1), w = Math.min(L.w - 20, 430), y = (this.scene instanceof MatchScene ? L.h - 70 - i * 56 : 12 + i * 54); c.save(); c.globalAlpha = a; c.translate(L.portrait ? L.w / 2 : L.w - w / 2 - 10, y + 24); c.scale(k, k); c.fillStyle = 'rgba(8,13,32,0.94)'; rr(c, -w / 2, -24, w, 48, 12); c.fill(); c.strokeStyle = t.col; c.lineWidth = 2.5; rr(c, -w / 2, -24, w, 48, 12); c.stroke(); label(c, t.title, 0, t.sub ? -8 : 0, 15, t.col); if (t.sub) label(c, t.sub, 0, 11, 11, '#cfe1ff'); c.restore(); });
    if (Save.data.settings.showFps && !this.debugOn) label(c, Math.round(this.fps) + ' FPS', 10, 14, 12, '#9fffbf', 'left');
    if (this.tr.p > 0.001) { const R = Math.hypot(L.w, L.h) * 0.55 * (1 - this.tr.p); if (R > 4 && this.tr.p < 0.999) { c.save(); c.strokeStyle = '#5fd0ff'; c.lineWidth = 5; c.shadowColor = '#5fd0ff'; c.shadowBlur = Q.glow ? 18 : 0; c.beginPath(); c.arc(L.w / 2, L.h / 2, R, 0, TAU); c.stroke(); c.restore(); } c.fillStyle = '#04060f'; c.beginPath(); c.rect(0, 0, L.w, L.h); c.moveTo(L.w / 2 + R, L.h / 2); c.arc(L.w / 2, L.h / 2, Math.max(0, R), 0, TAU, true); c.fill('evenodd'); }
    if (this.debugOn && !(this.scene instanceof MatchScene)) label(c, 'FPS ' + this.fps.toFixed(0) + ' scene ' + this.name + ' particles ' + this.fx.count, 10, 14, 12, '#9fffbf', 'left');
    if (Save.data.settings.mute) label(c, 'MUTED', L.w - 12, L.h - 30, 12, '#ff9f9f', 'right');
  }
};
Game.init();

})();
