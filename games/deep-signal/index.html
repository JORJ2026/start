<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#07151b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="description" content="A deep-sea exploration game about listening in the dark.">
  <title>Deep Signal</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="game.js"></script>
</head>
<body>
  <main id="game-shell" aria-label="Deep Signal game">
    <canvas id="world" aria-label="Submerged labyrinth game field"></canvas>
    <header id="hud" class="hud hidden" aria-live="polite">
      <div class="hud-left"><span class="depth-mark" id="depth-mark">DIVE 01</span><span class="objective" id="objective">Find the three signal cores</span></div>
      <div class="hud-right"><div class="air-block"><span class="micro-label">AIR</span><div class="air-track"><i id="air-fill"></i></div><strong id="air-number">100</strong></div><div class="core-count" id="core-count">◇ <b>0</b> / 3</div></div>
    </header>
    <div id="toast" class="toast" aria-live="polite"></div>
    <section id="screen" class="screen" aria-live="polite"></section>
    <div id="touch-controls" class="touch-controls hidden" aria-label="Touch controls">
      <div class="dpad" aria-label="Movement">
        <button data-key="ArrowUp" class="up" aria-label="Move up">▲</button>
        <button data-key="ArrowLeft" class="left" aria-label="Move left">◀</button>
        <button data-key="ArrowDown" class="down" aria-label="Move down">▼</button>
        <button data-key="ArrowRight" class="right" aria-label="Move right">▶</button>
      </div>
      <div class="action-pad"><button data-action="sonar" class="action sonar-action" aria-label="Send sonar pulse">PING<span>SPACE</span></button><button data-action="flare" class="action flare-action" aria-label="Deploy flare">FLARE<span>F</span></button></div>
    </div>
    <div id="desktop-hints" class="desktop-hints hidden"><span><kbd>WASD</kbd> move</span><span><kbd>SPACE</kbd> sonar</span><span><kbd>F</kbd> flare</span><span><kbd>ESC</kbd> pause</span></div>
  </main>
</body>
</html>
