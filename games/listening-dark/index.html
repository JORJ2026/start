<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#02040a">
<meta name="description" content="The Listening Dark: a stealth game played by sound. Call into the dark, read the echoes, and slip past what hears you.">
<title>The Listening Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
/* VOICE: hushed, literary, a little dread; short mature sentences.
   IDEA: a sonar print on black paper; the game is an instrument that draws with sound.
   PICTURE: point-cloud cave walls revealed by expanding wavefronts; the title itself is set in echo points.
   COLOUR and TYPE: void #02040a, bone echoes, one red for danger, gold moths, violet shards; EB Garamond throughout.
   LAYOUT: full-bleed canvas; menus are bare type set low-left, no cards, no boxes; prompts follow the device. */
:root { --bone: #dee9e4; --dim: rgba(222,233,228,.52); --faint: rgba(222,233,228,.14); --red: #ff5840; --gold: #ffcc70; --violet: #bea4ff; --void: #02040a; --ui: 1; color-scheme: dark; font-size: calc(18px * var(--ui)); }
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; height: 100%; background: var(--void); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
body { color: var(--bone); font: 1rem/1.5 "EB Garamond", Georgia, "Times New Roman", serif; }
body.nocursor, body.nocursor #cv { cursor: none; }
#cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
#sat { position: fixed; top: 0; height: env(safe-area-inset-top, 0px); width: 0; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; }
#ui { position: fixed; inset: 0; display: none; z-index: 5; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: max(env(safe-area-inset-top), 1.8rem) max(7vw, 1.4rem) max(env(safe-area-inset-bottom), 4.2rem); overflow-y: auto; touch-action: pan-y;
  background: linear-gradient(90deg, rgba(2,4,10,.93) 0%, rgba(2,4,10,.8) 48%, rgba(2,4,10,.4) 100%); animation: fade .35s ease both; }
.s-pause, .s-confirm, .over-game { -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); background: linear-gradient(90deg, rgba(2,4,10,.9) 0%, rgba(2,4,10,.72) 60%, rgba(2,4,10,.5) 100%); }
.s-title { justify-content: flex-end; padding-bottom: max(env(safe-area-inset-bottom), 4.6rem); background: linear-gradient(0deg, rgba(2,4,10,.82) 0%, rgba(2,4,10,.2) 55%, rgba(2,4,10,0) 100%); }
.t-wrap { max-width: 860px; }
#titleBox { width: min(86vw, 46rem); aspect-ratio: 2.9; margin: 0 0 .3rem; }
h2 { font-weight: 500; font-size: clamp(1.7rem, 4.6vw, 2.7rem); line-height: 1.05; margin: 0 0 .7rem; text-wrap: balance; max-width: 22em; }
.kicker { color: var(--gold); font-style: italic; margin: 0 0 .5rem; font-size: 1rem; }
.sub, .lead { font-style: italic; color: var(--dim); font-size: clamp(1rem, 2.2vw, 1.2rem); margin: 0 0 1.4rem; max-width: 34em; }
.warn { color: var(--red); font-style: italic; margin: -.6rem 0 1rem; }
.menu { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.mi { appearance: none; background: none; border: 0; color: var(--bone); font: inherit; font-size: clamp(1.1rem, 2.5vw, 1.4rem); padding: .38rem 0 .38rem 1.6rem; margin-left: -1.6rem; cursor: pointer; text-align: left; position: relative; min-height: 44px; line-height: 1.2; outline: none; transition: color .15s, transform .25s cubic-bezier(.2,.8,.2,1); }
.mi::before { content: ""; position: absolute; left: .2rem; top: 50%; width: .7rem; height: .7rem; margin-top: -.35rem; border-radius: 50%; border: 1.5px solid var(--bone); opacity: 0; transform: scale(.3); transition: opacity .2s, transform .35s cubic-bezier(.2,.8,.2,1); }
.mi::after { content: ""; position: absolute; left: .2rem; top: 50%; width: .7rem; height: .7rem; margin-top: -.35rem; border-radius: 50%; border: 1px solid var(--bone); opacity: 0; }
.mi:focus::before { opacity: .95; transform: scale(1); }
.mi:focus::after { animation: ping 1.6s ease-out infinite; }
.mi:focus { transform: translateX(.25rem); }
.mi .dim { color: var(--dim); font-style: italic; font-size: .72em; margin-left: .5em; }
.mi[disabled] { color: rgba(222,233,228,.3); cursor: default; transform: none; }
.mi[disabled]::before, .mi[disabled]::after { display: none; }
.mi.danger { color: #ff9c8c; }
.t-meta { position: absolute; right: max(7vw, 1.4rem); bottom: max(env(safe-area-inset-bottom), 1.1rem); text-align: right; font-size: .8rem; color: rgba(222,233,228,.4); font-style: italic; }
.t-meta p { margin: 0; } .hp { display: inline-flex; align-items: center; gap: .4rem; color: var(--dim); margin-bottom: .2rem !important; } .hp svg { width: 1.1rem; height: 1.1rem; }
.prompts { position: absolute; left: max(7vw, 1.4rem); bottom: max(env(safe-area-inset-bottom), 1.1rem); display: flex; flex-wrap: wrap; gap: .4rem 1.3rem; font-size: .85rem; color: var(--dim); font-style: italic; pointer-events: none; }
.prompts span { display: inline-flex; align-items: center; gap: .45rem; }
body[data-device=touch] .prompts { display: none; }
kbd.k { font: 600 .72rem/1 "EB Garamond", Georgia, serif; font-style: normal; color: var(--bone); border: 1.2px solid rgba(222,233,228,.6); border-radius: .3rem; padding: .22rem .42rem .18rem; min-width: 1.5rem; text-align: center; display: inline-block; }
kbd.k.round { border-radius: 50%; width: 1.5rem; height: 1.5rem; padding: .36rem 0 0; }
kbd.k-xbox.round { border-color: #7fd18b; color: #a6e8b0; }
kbd.k-ps.round { border-color: #8fb4ff; color: #b8cfff; }
/* settings */
.tabs { display: flex; flex-wrap: wrap; gap: .2rem 1.4rem; margin: 0 0 1rem; border-bottom: 1px solid var(--faint); }
.tab { appearance: none; background: none; border: 0; color: var(--dim); font: inherit; font-size: 1.15rem; padding: .4rem 0 .55rem; cursor: pointer; position: relative; min-height: 44px; }
.tab.on { color: var(--bone); } .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--bone); }
.set { display: flex; flex-direction: column; max-width: 40rem; margin-bottom: .8rem; }
.mi.row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; width: calc(100% + 1.6rem); font-size: 1.08rem; padding-top: .35rem; padding-bottom: .35rem; }
.mi.row:focus { transform: none; background: linear-gradient(90deg, rgba(222,233,228,.07), rgba(222,233,228,0)); }
.lbl { display: flex; flex-direction: column; }
.rnote { font-size: .72rem; font-style: italic; color: var(--dim); line-height: 1.25; max-width: 24em; }
.ctl { display: flex; align-items: center; gap: .7rem; flex: 0 0 auto; }
.ctl output { color: var(--dim); font-style: italic; min-width: 3.2rem; text-align: right; font-variant-numeric: tabular-nums; }
.track { position: relative; width: clamp(7rem, 22vw, 12rem); height: 1.6rem; cursor: pointer; touch-action: none; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(222,233,228,.3); }
.fill { position: absolute; left: 0; top: 50%; height: 2px; margin-top: -.5px; background: var(--bone); }
.knob { position: absolute; top: 50%; width: .8rem; height: .8rem; margin: -.4rem 0 0 -.4rem; border-radius: 50%; background: var(--void); border: 1.5px solid var(--bone); }
.row:focus .knob { box-shadow: 0 0 0 .3rem rgba(222,233,228,.15); }
.sw { width: 2.2rem; height: 1.15rem; border-radius: 1rem; border: 1.4px solid rgba(222,233,228,.5); position: relative; transition: background .2s; }
.sw i { position: absolute; top: .14rem; left: .16rem; width: .72rem; height: .72rem; border-radius: 50%; background: rgba(222,233,228,.55); transition: transform .2s cubic-bezier(.2,.8,.2,1), background .2s; }
.sw.on { background: rgba(222,233,228,.16); border-color: var(--bone); } .sw.on i { transform: translateX(1.03rem); background: var(--bone); }
.arr { font-style: normal; color: var(--dim); font-size: 1.3rem; padding: 0 .3rem; cursor: pointer; }
.row:focus .arr { color: var(--bone); }
.row[data-type=choice] output { min-width: 8.5rem; text-align: center; }
.note { color: var(--dim); font-style: italic; font-size: .88rem; margin: .3rem 0 1rem; max-width: 36em; }
.stats { color: var(--gold); font-size: .95rem; margin: 0 0 1rem; font-variant-numeric: tabular-nums; }
/* how to play */
.howgrid, .jgrid, .pgrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 1rem 3rem; align-items: start; max-width: 1180px; margin-bottom: 1rem; }
.ctl { border-collapse: collapse; }
table.ctl { margin: .2rem 0 .6rem; font-size: .95rem; display: table; }
table.ctl th { text-align: left; font-weight: 500; font-style: italic; color: var(--dim); padding: .2rem 1.1rem .45rem 0; }
table.ctl td { padding: .32rem 1.1rem .32rem 0; border-top: 1px solid var(--faint); vertical-align: top; }
table.ctl td:first-child { color: var(--gold); white-space: nowrap; }
table.ctl .cur { color: var(--bone); } table.ctl th.cur { color: var(--bone); border-bottom: 2px solid var(--bone); }
table.ctl td:not(.cur):not(:first-child) { color: rgba(222,233,228,.55); }
.guide { list-style: none; padding: 0; margin: 0; display: grid; gap: .55rem; }
.guide li { display: grid; grid-template-columns: 2.1rem 1fr; gap: .7rem; align-items: start; font-size: .92rem; color: var(--dim); }
.guide strong { display: block; color: var(--bone); font-weight: 500; font-size: 1rem; }
.ic svg { width: 2.1rem; height: 2.1rem; display: block; }
/* journal */
.verses { margin: 0; padding-left: 1.2rem; display: grid; gap: .5rem; }
.verses li { color: rgba(222,233,228,.35); font-style: italic; } .verses li.got { color: #ffe4f0; font-size: 1.08rem; }
.achs { list-style: none; padding: 0; margin: 0; columns: 2 14rem; column-gap: 1.8rem; }
.achs li { break-inside: avoid; padding: .3rem 0; color: rgba(222,233,228,.35); }
.achs li strong { display: block; font-weight: 500; font-size: 1.02rem; }
.achs li span { font-style: italic; font-size: .82rem; }
.achs li.got { color: var(--bone); } .achs li.got strong { color: var(--gold); }
.cred { max-width: 36em; margin: 0 0 1.2rem; } .cred dt { color: var(--gold); font-style: italic; font-size: .9rem; margin-top: .8rem; } .cred dd { margin: .1rem 0 0; }
/* pause */
.status { border-left: 1px solid var(--faint); padding-left: 2rem; }
.status dl { display: grid; grid-template-columns: auto 1fr; gap: .45rem 1.3rem; margin: 2.6rem 0 0; font-size: .98rem; }
.status dt { color: var(--dim); font-style: italic; } .status dd { margin: 0; }
/* roost */
.boons { gap: .6rem; margin-bottom: .9rem; }
.boon { display: grid; grid-template-columns: 2rem 1fr; grid-template-rows: auto auto; column-gap: .5rem; padding-top: .55rem; padding-bottom: .55rem; }
.boon .k { grid-row: 1 / 3; color: var(--violet); font-style: italic; font-size: .8em; padding-top: .15rem; }
.boon strong { font-weight: 500; } .boon .dim { margin-left: 0; font-size: .7em; }
.intro p, .s-ending .stats { font-size: clamp(1.15rem, 2.8vw, 1.6rem); font-style: italic; max-width: 30em; margin: 0 0 1rem; opacity: 0; animation: rise 1.4s ease forwards; animation-delay: var(--d); }
.s-ending .stats { font-size: .95rem; font-style: normal; }
.intro .go { opacity: 0; animation: rise 1s ease forwards; animation-delay: var(--d); }
.s-intro, .s-ending { background: rgba(2,4,10,.9); }
.nofade { animation: none; }
/* touch */
#touch { position: fixed; inset: 0; display: none; z-index: 3; pointer-events: none; }
#stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border: 1.5px solid rgba(222,233,228,.35); border-radius: 50%; opacity: 0; transition: opacity .15s; }
#knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(222,233,228,.25); }
#tCall, #tDash { pointer-events: auto; position: fixed; border-radius: 50%; border: 1.5px solid rgba(222,233,228,.5); background: rgba(2,4,10,.4); color: var(--bone); font: italic 500 18px "EB Garamond", Georgia, serif; touch-action: none; }
#tCall { right: max(env(safe-area-inset-right), 22px); bottom: max(env(safe-area-inset-bottom), 26px); width: 104px; height: 104px; font-size: 21px; }
#tCall.on { background: rgba(222,233,228,.2); border-color: var(--bone); }
#tDash { right: calc(max(env(safe-area-inset-right), 22px) + 116px); bottom: max(env(safe-area-inset-bottom), 30px); width: 70px; height: 70px; }
#pauseBtn { display: none; position: fixed; z-index: 4; top: calc(max(env(safe-area-inset-top), 14px) + 40px); right: max(env(safe-area-inset-right), 18px); width: 44px; height: 44px; background: none; border: 0; color: rgba(222,233,228,.55); font: 600 17px Georgia, serif; cursor: pointer; letter-spacing: 1px; }
#pauseBtn:focus-visible { outline: 1px solid var(--bone); }
#toast { position: fixed; z-index: 8; right: max(env(safe-area-inset-right), 1.4rem); top: max(env(safe-area-inset-top), 1.2rem); padding: .6rem 1rem; border-left: 2px solid var(--bone); background: rgba(2,4,10,.82); transform: translateX(calc(100% + 3rem)); visibility: hidden; transition: transform .45s cubic-bezier(.2,.8,.2,1), visibility 0s .45s; pointer-events: none; }
#toast.on { transform: none; visibility: visible; transition: transform .45s cubic-bezier(.2,.8,.2,1); } #toast strong { display: block; font-weight: 500; } #toast span { font-style: italic; color: var(--dim); font-size: .85rem; }
#err { display: none; position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 9; max-width: min(90vw, 640px); padding: 12px 18px; background: #1a0605; border: 1px solid var(--red); color: #ffd6cf; font-size: 16px; }
/* load screen */
#boot { position: fixed; inset: 0; z-index: 10; background: var(--void); display: grid; place-items: center; transition: opacity .8s ease, filter .8s ease; cursor: default; }
#boot.out { opacity: 0; filter: blur(6px); }
.b-inner { width: min(86vw, 26rem); text-align: center; }
.mark { width: 7.5rem; height: 7.5rem; display: block; margin: 0 auto 1rem; overflow: visible; }
.mark .w { fill: none; stroke: var(--bone); stroke-width: 1; transform-origin: 60px 60px; animation: wave 2.4s ease-out infinite; opacity: 0; }
.mark .w2 { animation-delay: .8s; } .mark .w3 { animation-delay: 1.6s; }
.mark .bat { fill: var(--bone); }
.b-title { font-size: 1.6rem; margin: 0 0 1.2rem; letter-spacing: .01em; }
.b-bar { height: 1px; background: var(--faint); margin: 0 auto .7rem; width: 70%; overflow: hidden; }
.b-bar i { display: block; height: 100%; background: var(--bone); transform: scaleX(0); transform-origin: left; transition: transform .35s ease; }
#bootMsg { color: var(--dim); font-style: italic; margin: 0 0 1.2rem; font-size: .95rem; }
.b-go { font-size: 1.25rem; margin: 0 0 1.4rem; animation: breathe 2.2s ease-in-out infinite; display: flex; align-items: center; justify-content: center; gap: .5rem; }
.b-go[hidden] { display: none; }
#boot.ready { cursor: pointer; }
.b-tip { color: rgba(222,233,228,.42); font-style: italic; font-size: .88rem; margin: 0; min-height: 2.6em; }
@keyframes wave { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.8); opacity: 0; } }
@keyframes ping { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
@keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (max-width: 760px) {
  .howgrid, .jgrid, .pgrid { grid-template-columns: minmax(0, 1fr); gap: 1.2rem; }
  .status { border-left: 0; padding-left: 0; border-top: 1px solid var(--faint); padding-top: 1rem; } .status dl { margin-top: 0; }
}
@media (max-width: 600px) {
  .screen { background: rgba(2,4,10,.88); padding-left: 2rem; padding-right: 1.3rem; }
  .s-title { justify-content: center; background: linear-gradient(0deg, rgba(2,4,10,.94) 0%, rgba(2,4,10,.55) 70%, rgba(2,4,10,.1) 100%); }
  .mi { font-size: 1.1rem; }
  .mi.row { display: grid; grid-template-columns: minmax(0, 1fr); gap: .15rem; }
  .mi.row .ctl { width: 100%; justify-content: flex-end; } .mi.row .track { flex: 1; width: auto; }
  .row[data-type=choice] .ctl { justify-content: space-between; }
  table.ctl, table.ctl tbody, table.ctl tr, table.ctl td { display: block; } table.ctl tr:first-child { display: none; }
  table.ctl tr { padding: .4rem 0; border-top: 1px solid var(--faint); } table.ctl td { border: 0; padding: 1px 0; font-size: .9rem; }
  table.ctl td:nth-child(2)::before { content: "Keys · "; color: var(--dim); } table.ctl td:nth-child(3)::before { content: "Pad · "; color: var(--dim); } table.ctl td:nth-child(4)::before { content: "Touch · "; color: var(--dim); }
  .t-meta { left: 1.3rem; right: auto; text-align: left; }
}
@media (prefers-reduced-motion: reduce) { .screen, .intro p, .intro .go, .s-ending .stats { animation-duration: .01s; } .mi { transition: none; } .mi:focus::after, .mark .w { animation: none; } }

.talk { max-width: 40rem; margin: 0 0 1rem; display: grid; gap: .45rem; }
.talk p { margin: 0; font-style: italic; opacity: 0; animation: rise 1s ease forwards; animation-delay: var(--d); }
.talk b { font-style: normal; font-weight: 600; font-size: .78rem; display: block; letter-spacing: .02em; }
.chtitle { font-size: clamp(2.2rem, 6vw, 3.6rem); opacity: 0; animation: rise 1.2s ease forwards; animation-delay: var(--d); }
.s-chapter { background: rgba(2,4,10,.9); }
.s-chapter .kicker, .s-intro .kicker { opacity: 0; animation: rise 1s ease forwards; animation-delay: var(--d, 0s); }
.s-chapter .note { opacity: 0; animation: rise 1s ease forwards; animation-delay: var(--d); color: #ffc4aa; }
.chlist .num { display: inline-block; min-width: 2.6rem; color: var(--gold); font-style: italic; }
.kinlist { list-style: none; padding: 0; margin: 0; display: grid; gap: .3rem; color: rgba(222,233,228,.4); font-style: italic; }
.kinlist li.got { color: #ffc4aa; font-style: normal; }
.status .dim { color: var(--dim); font-style: italic; }

</style>
</head>
<body data-device="kb">
<canvas id="cv" aria-label="The cave"></canvas>
<div id="sat"></div>
<div id="ui" role="dialog" aria-live="polite"></div>
<div id="touch" aria-hidden="true">
  <div id="stick"><div id="knob"></div></div>
  <button id="tDash" type="button">Dart</button>
  <button id="tCall" type="button">Call</button>
</div>
<button id="pauseBtn" type="button" aria-label="Pause">II</button>
<div id="toast" role="status"></div>
<div id="err" role="alert"></div>
<div id="boot">
  <div class="b-inner">
    <svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="w w1" cx="60" cy="60" r="20"/><circle class="w w2" cx="60" cy="60" r="20"/><circle class="w w3" cx="60" cy="60" r="20"/>
      <path class="bat" d="M60 63c-3-6-9-8-17-6 4-4 10-6 15-4l2-4 2 4c5-2 11 0 15 4-8-2-14 0-17 6z"/>
    </svg>
    <p class="b-title">The Listening Dark</p>
    <div class="b-bar"><i id="bootFill"></i></div>
    <p id="bootMsg">Waking the cave</p>
    <p id="bootPrompt" class="b-go" hidden></p>
    <p class="b-tip" id="bootTip"></p>
  </div>
</div>
<noscript><p style="color:#dee9e4;font:20px Georgia;padding:40px">The Listening Dark needs JavaScript to run.</p></noscript>
<script>
(() => {
'use strict';
// ===== core.js =====
// ---------- core: constants, rng, data tables, persistence ----------
const T = 16, TAU = Math.PI * 2, STEP = 1 / 60;
const ECHO_SPEED = 26 * T;          // px per second
const FINAL_DEPTH = 8;
const VERSION = '1.2.0';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
class RNG {
  constructor(seed) { this.r = mulberry32(seed >>> 0); }
  next() { return this.r(); }
  range(a, b) { return a + (b - a) * this.r(); }
  int(a, b) { return a + Math.floor(this.r() * (b - a + 1)); }
  pick(a) { return a[Math.floor(this.r() * a.length)]; }
}
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

const int = (v, d = 0) => Number.isFinite(+v) ? Math.floor(+v) : d;
// Every run that comes out of storage is checked and repaired, so a bad save can never crash a level.
function validRun(r) {
  if (!r || typeof r !== 'object' || !MODES.includes(r.mode) || !DIFFS[r.diff]) return null;
  const out = {
    v: 2, mode: r.mode, diff: r.diff, seed: int(r.seed) >>> 0, replay: !!r.replay,
    depth: clamp(int(r.depth, 1), 1, r.mode === 'endless' ? 999 : FINAL_DEPTH),
    maxHearts: clamp(int(r.maxHearts, DIFFS[r.diff].hearts), 1, 9), hearts: 1,
    boons: {}, moths: Math.max(0, int(r.moths)), mothMeter: clamp(int(r.mothMeter), 0, 12),
    songs: [...new Set((Array.isArray(r.songs) ? r.songs : []).map(x => int(x, -1)).filter(x => x >= 0 && x < 4))],
    kin: [...new Set((Array.isArray(r.kin) ? r.kin : []).map(x => int(x, -1)).filter(x => x >= 0 && x < 6))],
    sang: !!r.sang, date: typeof r.date === 'string' ? r.date.slice(0, 10) : todayStr(),
    stats: { pings: Math.max(0, int(r.stats && r.stats.pings)), time: Math.max(0, +(r.stats && r.stats.time) || 0), stuns: Math.max(0, int(r.stats && r.stats.stuns)), hurt: Math.max(0, int(r.stats && r.stats.hurt)) }
  };
  out.hearts = clamp(int(r.hearts, out.maxHearts), 1, out.maxHearts);
  if (r.boons && typeof r.boons === 'object') for (const b of BOONS) { const n = int(r.boons[b.id]); if (n > 0 && b.id !== 'mending') out.boons[b.id] = Math.min(n, b.max); }
  return out;
}

  defaults() {
    return {

        hints: true, captions: true, exitHint: true,
        vibration: true, deadzone: 0.18, prompts: 'auto', touch: 'auto'
      },
      meta: { lifetimeMoths: 0, bestDepth: 0, endings: {}, ach: {}, endlessBest: 0, runs: 0, dailyBest: {}, verses: {} },
      story: { chapters: 1, found: { kin: {}, verses: {} }, endings: {} },
      runs: { story: null, descent: null, daily: null, endless: null, replay: null }, last: null
    };
  },
  parse(str) { try { const d = JSON.parse(str); return d && typeof d === 'object' && !Array.isArray(d) ? d : null; } catch (e) { return null; } },
  load() {
    let d = null, raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); d = raw ? this.parse(raw) : null;
      if (raw && !d) { const b = localStorage.getItem(BAK_KEY); d = b ? this.parse(b) : null; this.recovered = !!d; }
    } catch (e) { this.persistent = false; d = null; }
    this.data = this.normalize(d);
  },
  normalize(d) {
    const def = this.defaults();
    if (!d) return def;
    const S = def.settings, ins = d.settings && typeof d.settings === 'object' ? d.settings : {};
    for (const k in S) if (k in ins && typeof ins[k] === typeof S[k]) S[k] = ins[k];
    for (const k of ['master', 'music', 'sfx', 'amb', 'uiVol']) S[k] = clamp(+S[k] || 0, 0, 1);
    S.deadzone = clamp(+S.deadzone || 0.18, 0.05, 0.4);
    if (![0.9, 1, 1.15, 1.3].includes(S.uiScale)) S.uiScale = 1;
    if (!PALETTES[S.palette]) S.palette = 'bone';
    for (const [k, o] of [['quality', ['high', 'low']], ['prompts', ['auto', 'xbox', 'ps', 'keyboard']], ['touch', ['auto', 'on', 'off']]]) if (!o.includes(S[k])) S[k] = o[0];
    const M = def.meta, inm = d.meta && typeof d.meta === 'object' ? d.meta : {};
    for (const k of ['lifetimeMoths', 'bestDepth', 'endlessBest', 'runs']) M[k] = Math.max(0, int(inm[k]));
    for (const k of ['endings', 'ach', 'dailyBest', 'verses']) if (inm[k] && typeof inm[k] === 'object' && !Array.isArray(inm[k])) M[k] = inm[k];
    const st = d.story && typeof d.story === 'object' ? d.story : {};
    def.story.chapters = clamp(int(st.chapters, 1), 1, FINAL_DEPTH);
    if (st.found) for (const k of ['kin', 'verses']) if (st.found[k] && typeof st.found[k] === 'object') def.story.found[k] = st.found[k];
    if (st.endings && typeof st.endings === 'object') def.story.endings = st.endings;
    // version 1 kept a single run; move it into its mode's slot
    if (d.run) { const r = validRun(d.run); if (r) { def.runs[r.mode] = r; def.last = r.mode; } }
    if (d.runs && typeof d.runs === 'object') for (const k of Object.keys(def.runs)) def.runs[k] = validRun(d.runs[k]);
    if (def.runs.replay) def.runs.replay.replay = true;
    def.last = typeof d.last === 'string' && def.runs[d.last] ? d.last : (def.last && def.runs[def.last] ? def.last : null);
    return def;
  },
  save() {
    try {
      const prev = localStorage.getItem(SAVE_KEY);
      if (prev && this.parse(prev)) localStorage.setItem(BAK_KEY, prev);
      localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); return true;
    } catch (e) { this.persistent = false; return false; }
  }
};

  'But the cave is not silent any more. In the deep places, something old hums along when the colony sings.',
  'And every night, before the others wake, Quill flies to the mouth of the cave and calls into the dark, just to hear it answer.'
];
function versesKnown(r) {
  if (!r) return 0;
  if (r.mode !== 'story') return r.songs.length;
  const s = new Set(r.songs); for (const k in Store.data.story.found.verses) s.add(+k);
  return s.size;
}

// ===== audio.js =====
// ---------- audio: synthesis, spatial voices, stone reverb, ambience, scheduled generative score ----------
const AE = {
  ctx: null, ok: false, buses: {}, listener: { x: 0, y: 0 }, hum: null, chg: null, pre: null,
  // heavy buffers are computed during the load screen, before any audio context exists
  prepare() {
    const sr = 48000, len = Math.floor(sr * 3.8);
    const verb = [new Float32Array(len), new Float32Array(len)];
    for (let ch = 0; ch < 2; ch++) {
      const d = verb[ch]; let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        const early = (t < 0.12 && ((i * (ch ? 7 : 5)) % 2203) < 4) ? 0.9 : 0;
        lp += ((Math.random() * 2 - 1) - lp) * (0.55 - t * 0.4); // the tail darkens as it decays, like stone
        d[i] = (lp * 1.4 + early) * Math.pow(1 - t, 2.6);
      }
    }
    const noise = new Float32Array(sr * 2); for (let i = 0; i < noise.length; i++) noise[i] = Math.random() * 2 - 1;
    const brown = new Float32Array(sr * 6); let b = 0;
    for (let i = 0; i < brown.length; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; brown[i] = b * 3.5; }
    this.pre = { sr, verb, noise, brown };
  },
  // buffers must match the device's sample rate (a ConvolverNode rejects anything else), so resample
  buf(chs) {
    const c = this.ctx, sr = this.pre.sr, cr = c.sampleRate, k = sr / cr;
    const len = Math.max(1, Math.round(chs[0].length / k)), b = c.createBuffer(chs.length, len, cr);
    chs.forEach((d, ch) => {
      const o = b.getChannelData(ch);
      if (cr === sr) o.set(d); else for (let i = 0; i < len; i++) { const x = i * k, j = x | 0, f = x - j; o[i] = d[j] + ((d[j + 1] || 0) - d[j]) * f; }
    });
    return b;
  },
  init() {
    if (this.ctx) { if (this.ctx.state !== 'running' && this.ctx.state !== 'closed') this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      if (!this.pre) this.prepare();
      const c = this.ctx = new AC({ latencyHint: 'interactive' });
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.2;
      comp.connect(c.destination);
      this.muf = c.createBiquadFilter(); this.muf.type = 'lowpass'; this.muf.frequency.value = 20000; this.muf.Q.value = 0.6;
      // mono folds at the master; this stage spreads it back to both speakers explicitly
      this.muf.channelCount = 2; this.muf.channelCountMode = 'explicit'; this.muf.channelInterpretation = 'speakers'; this.muf.connect(comp);
      this.master = c.createGain(); this.master.channelCountMode = 'explicit'; this.master.channelInterpretation = 'speakers'; this.master.connect(this.muf);
      this.verb = c.createConvolver(); this.verb.buffer = this.buf(this.pre.verb);
      this.verbOut = c.createGain(); this.verbOut.gain.value = 0.55; this.verb.connect(this.verbOut); this.verbOut.connect(this.master);
      for (const k of ['sfx', 'music', 'amb', 'ui']) {
        const dry = c.createGain(), wet = c.createGain();
        dry.connect(this.master); wet.connect(this.verb);
        this.buses[k] = { dry, wet };
      }
      this.noiseBuf = this.buf([this.pre.noise]); this.brownBuf = this.buf([this.pre.brown]);
      this.ok = true; this.applyVolumes();
      if (c.state === 'suspended') c.resume().catch(() => {});
      Music.start(); this.ambStart();
    } catch (e) { this.ok = false; console.warn('Audio unavailable:', e); }
  },
  applyVolumes() {
    if (!this.ok) return;
    const s = Store.data.settings, t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(s.muted ? 0 : s.master, t, 0.03);
    this.master.channelCount = s.mono ? 1 : 2;
    for (const [k, v] of [['sfx', s.sfx], ['music', s.music * 0.62], ['amb', s.amb * 0.8], ['ui', s.uiVol * 0.85]]) {
      this.buses[k].dry.gain.setTargetAtTime(v, t, 0.03); this.buses[k].wet.gain.setTargetAtTime(v, t, 0.03);
    }
  },
  suspend(on) { if (!this.ok) return; (on ? this.ctx.suspend() : this.ctx.resume()).catch(() => {}); },
  muffle(on) {
    if (!this.ok) return;
    const t = this.ctx.currentTime;
    this.muf.frequency.cancelScheduledValues(t);
    this.muf.frequency.setTargetAtTime(on ? 650 : 20000, t, on ? 0.07 : 0.2);
    Music.duck(on);
  },
  spatial(x, y, range) {
    const dx = x - this.listener.x, dy = y - this.listener.y, d = hyp(dx, dy) / T;
    const mono = Store.data.settings.mono;
    return { g: Math.pow(clamp(1 - d / range, 0, 1), 1.6), pan: mono ? 0 : clamp(dx / (T * 12), -1, 1) * 0.85, lp: clamp(16000 / (1 + d * 0.35), 700, 16000), d };
  },
  chain(o) {
    const c = this.ctx; let vol = o.vol == null ? 1 : o.vol, pan = o.pan || 0, lp = 0;
    if (o.x != null) { const s = this.spatial(o.x, o.y, o.range || 30); if (s.g <= 0.002) return null; vol *= s.g; pan = s.pan; lp = s.lp; }
    const g = c.createGain(); g.gain.value = vol; let tail = g;
    if (lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; tail.connect(f); tail = f; }
    if (pan && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = pan; tail.connect(p); tail = p; }
    if (o.dest) { tail.connect(o.dest); return g; } // music voices go through the score's own fader
    const bus = this.buses[o.bus || 'sfx'];
    tail.connect(bus.dry);
    const w = c.createGain(); w.gain.value = o.wet == null ? 0.3 : o.wet; tail.connect(w); w.connect(bus.wet);
    return g;
  },
  env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, a + 0.01));
  },
  tone(f, dur, o = {}) {
    if (!this.ok) return;
    const c = this.ctx, t = (o.at || c.currentTime) + (o.delay || 0), head = this.chain(o);
    if (!head) return;
    const osc = c.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.slide || dur));
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vibRate || 5.5; lg.gain.value = f * o.vib; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.1); }
    const env = c.createGain(); this.env(env, t, o.attack || 0.005, o.peak || 0.3, dur);
    let src = osc;
    if (o.lp) { const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; osc.connect(fl); src = fl; }
    src.connect(env); env.connect(head);
    osc.start(t); osc.stop(t + dur + 0.05);
    osc.onended = () => { try { head.disconnect(); } catch (e) {} };
  },
  // two-operator FM: a bright, animal-sounding voice
  fm(f, ratio, index, dur, o = {}) {
    if (!this.ok) return;
    const c = this.ctx, t = (o.at || c.currentTime) + (o.delay || 0), head = this.chain(o);
    if (!head) return;
    const car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain();
    car.frequency.setValueAtTime(f, t); mod.frequency.setValueAtTime(f * ratio, t);
    mg.gain.setValueAtTime(f * index, t);
    if (o.to) { car.frequency.exponentialRampToValueAtTime(o.to, t + dur); mod.frequency.exponentialRampToValueAtTime(o.to * ratio, t + dur); mg.gain.exponentialRampToValueAtTime(Math.max(1, o.to * index * 0.3), t + dur); }
    mod.connect(mg); mg.connect(car.frequency);
    const env = c.createGain(); this.env(env, t, o.attack || 0.004, o.peak || 0.2, dur);
    car.connect(env); env.connect(head);
    car.start(t); mod.start(t); car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
    car.onended = () => { try { head.disconnect(); } catch (e) {} };
  },
  noise(dur, o = {}) {
    if (!this.ok) return;
    const c = this.ctx, t = (o.at || c.currentTime) + (o.delay || 0), head = this.chain(o);
    if (!head) return;
    const src = c.createBufferSource(); src.buffer = o.brown ? this.brownBuf : this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass';
    f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + dur);
    f.Q.value = o.q || 1;
    const env = c.createGain(); this.env(env, t, o.attack || 0.003, o.peak || 0.3, dur);
    src.connect(f); f.connect(env); env.connect(head);
    src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
    src.onended = () => { try { head.disconnect(); } catch (e) {} };
  },

  // ---- the bat ----
  chirp() {
    this.fm(3300, 1.5, 0.6, 0.075, { to: 1700, peak: 0.13, wet: 0.55 });
    this.noise(0.03, { f: 6000, q: 2, peak: 0.04, wet: 0.4 });
  },
  call(c) {
    const b = 1900 - c * 1000, d = 0.2 + c * 0.38;
    this.fm(b, 1.5, 0.8 + c, d, { to: b * 0.5, peak: 0.15 + c * 0.08, wet: 0.9 });
    this.tone(b * 0.5, d * 1.2, { to: b * 0.3, peak: 0.07 + c * 0.05, wet: 1, type: 'triangle' });
    this.noise(0.12 + c * 0.1, { f: 3000, fto: 1200, q: 0.8, peak: 0.05 + c * 0.04, wet: 0.7 });
  },
  chargeStart() {
    if (!this.ok || this.chg) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), am = c.createOscillator(), ag = c.createGain();
    o.type = 'triangle'; o.frequency.value = 260; g.gain.value = 0;
    am.frequency.value = 9; ag.gain.value = 0; am.connect(ag); ag.connect(g.gain);
    o.connect(g); g.connect(this.buses.sfx.dry); o.start(); am.start();
    this.chg = { o, g, am, ag };
  },
  chargeUpdate(v) {
    if (!this.chg) return;
    const t = this.ctx.currentTime;
    this.chg.o.frequency.setTargetAtTime(260 + v * 520, t, 0.05);
    this.chg.g.gain.setTargetAtTime(0.012 + v * 0.035, t, 0.05);
    this.chg.ag.gain.setTargetAtTime(v >= 1 ? 0.02 : 0, t, 0.05);
  },
  chargeStop() {
    if (!this.chg) return;
    const h = this.chg, t = this.ctx.currentTime; this.chg = null;
    h.g.gain.cancelScheduledValues(t); h.g.gain.setTargetAtTime(0, t, 0.02); h.o.stop(t + 0.15); h.am.stop(t + 0.15);
  },
  // echo returns land when the wavefront reaches the wall, from that wall's direction
  echoTick(x, y, delay, vol) { this.tone(2300 + Math.random() * 500, 0.05, { x, y, range: 34, delay, peak: 0.06 * vol, wet: 0.8, to: 1500 }); },
  flap(v) { this.noise(0.07, { f: 520, fto: 260, q: 0.9, peak: 0.02 + v * 0.05, wet: 0.15 }); },
  dash() { this.noise(0.24, { f: 600, fto: 3400, q: 0.9, peak: 0.22, wet: 0.3 }); this.noise(0.16, { f: 2400, fto: 700, q: 1.5, peak: 0.08, wet: 0.2, delay: 0.08 }); },
  hurt() { this.noise(0.4, { f: 800, fto: 140, q: 1, peak: 0.5, wet: 0.35 }); this.tone(95, 0.45, { to: 38, peak: 0.42, type: 'square', lp: 420 }); this.tone(1500, 0.3, { to: 700, peak: 0.06, type: 'sawtooth', lp: 2500 }); },
  heal() { [0, 7, 12, 16].forEach((s, i) => this.tone(659 * Math.pow(2, s / 12), 0.8, { peak: 0.07, delay: i * 0.07, wet: 0.9, type: 'triangle' })); },
  death() { this.tone(220, 2.8, { to: 50, peak: 0.25, type: 'triangle', wet: 1.2 }); this.noise(1.8, { f: 500, fto: 70, q: 1, peak: 0.3, wet: 1 }); this.fm(800, 1.41, 2, 1.2, { to: 120, peak: 0.07, wet: 1.2, delay: 0.2 }); },
  descend() { this.noise(1.1, { f: 2400, fto: 160, q: 1.2, peak: 0.2, wet: 0.8, attack: 0.15 }); this.tone(220, 1.2, { to: 55, peak: 0.16, wet: 1, attack: 0.1, type: 'triangle' }); },
  // ---- the cave ----
  moth(n) {
    const sc = [0, 2, 4, 7, 9], f = 784 * Math.pow(2, (sc[n % 5] + 12 * Math.floor(n / 5)) / 12);

  shard(k) { const base = 440 * Math.pow(2, [0, 3, 5, 7, 10, 12][k % 6] / 12); [0, 4, 7, 12].forEach((s, i) => this.tone(base * Math.pow(2, s / 12), 1.6, { peak: 0.08, wet: 1, delay: i * 0.055, type: 'triangle' })); },
  shardPing(x, y, v = 1) { this.tone(1046.5, 1, { x, y, range: 34, peak: 0.06 * v, wet: 1.1, type: 'triangle' }); this.tone(1568, 0.6, { x, y, range: 34, peak: 0.02 * v, wet: 1.1 }); },
  gateOpen() { this.tone(73.4, 3, { peak: 0.3, attack: 0.7, wet: 0.9, type: 'triangle' }); this.tone(110, 3, { peak: 0.2, attack: 0.9, wet: 0.9 }); this.tone(146.8, 2.6, { peak: 0.12, attack: 1.1, wet: 1.1 }); Music.motifNow(3); },
  bell(x, y) { [1, 2.76, 5.4, 8.93].forEach((m, i) => this.tone(392 * m, 2.4 / (1 + i * 0.6), { x, y, range: 44, peak: 0.12 / (1 + i), wet: 1.1, vib: 0.003 })); },
  drip(x, y) { const f = 1100 + Math.random() * 900; this.tone(f, 0.09, { x, y, range: 24, to: f * 0.45, peak: 0.09, wet: 1.1 }); this.noise(0.02, { x, y, range: 24, f: 5000, q: 3, peak: 0.03, wet: 0.8, delay: 0.005 }); },
  rumble(x, y) { this.noise(3.5, { x, y, range: 90, brown: true, ft: 'lowpass', f: 140, q: 0.7, peak: 0.5, attack: 1.2, wet: 0.6 }); },
  song() { Music.motifNow(4); },
  kinChirp(x, y) { this.fm(2500, 1.5, 0.5, 0.11, { x, y, range: 30, to: 1800, peak: 0.09, wet: 0.8 }); this.fm(2900, 1.5, 0.5, 0.09, { x, y, range: 30, to: 2100, peak: 0.07, wet: 0.8, delay: 0.16 }); },
  kinFound() { [0, 5, 9, 12].forEach((s, i) => this.tone(587 * Math.pow(2, s / 12), 1.1, { peak: 0.07, delay: i * 0.09, wet: 1, type: 'triangle' })); this.fm(2600, 1.5, 0.6, 0.3, { to: 3400, peak: 0.06, wet: 1, delay: 0.3 }); },
  storySting() { this.tone(146.8, 3, { peak: 0.12, attack: 0.8, wet: 1.2, type: 'triangle', bus: 'ui' }); this.tone(220, 3, { peak: 0.06, attack: 1, wet: 1.3, bus: 'ui' }); },
  chorus() { Music.motifNow(8, true); [0, 4, 7, 11, 14, 19].forEach((s, i) => this.tone(196 * Math.pow(2, s / 12), 6, { peak: 0.05, attack: 1, delay: i * 0.4, wet: 1.5, type: 'triangle', dest: Music.out })); },
  // ---- the hunters ----
  click(x, y) { for (let i = 0; i < 3; i++) this.noise(0.022, { x, y, range: 28, f: 3300 + i * 200, q: 8, peak: 0.42, delay: i * 0.075, wet: 0.45 }); },
  growl(x, y) { this.tone(72, 0.75, { x, y, range: 26, type: 'sawtooth', to: 46, peak: 0.2, wet: 0.4, lp: 440, vib: 0.04, vibRate: 11 }); this.noise(0.6, { x, y, range: 26, f: 620, fto: 380, q: 4, peak: 0.16 }); },
  breath(x, y) { this.noise(1.2, { x, y, range: 12, f: 520, fto: 260, q: 1.2, peak: 0.32, attack: 0.45, wet: 0.25 }); },
  lunge(x, y) { this.noise(0.3, { x, y, range: 22, f: 1200, fto: 200, q: 3, peak: 0.42 }); this.tone(115, 0.32, { x, y, range: 22, type: 'sawtooth', to: 55, peak: 0.16, lp: 650 }); },
  stun(x, y) { this.noise(0.32, { x, y, range: 30, f: 2400, fto: 400, q: 4, peak: 0.25 }); this.tone(700, 0.4, { x, y, range: 30, to: 200, peak: 0.06, type: 'square', lp: 1500 }); },
  mutePulse(x, y) { this.tone(41, 2, { x, y, range: 70, peak: 0.45, wet: 0.7, attack: 0.35 }); this.tone(43.6, 2, { x, y, range: 70, peak: 0.22, wet: 0.7, attack: 0.35 }); this.noise(1.6, { x, y, range: 70, brown: true, ft: 'lowpass', f: 200, peak: 0.2, attack: 0.6 }); },

  uiBack() { this.tone(880, 0.1, { peak: 0.05, bus: 'ui', wet: 0.4, type: 'triangle' }); this.tone(587, 0.16, { peak: 0.05, bus: 'ui', wet: 0.4, delay: 0.05, type: 'triangle' }); },
  uiToggle(on) { const a = on ? 740 : 1109, b = on ? 1109 : 740; this.tone(a, 0.06, { peak: 0.05, bus: 'ui', wet: 0.2 }); this.tone(b, 0.1, { peak: 0.05, bus: 'ui', wet: 0.2, delay: 0.05 }); },
  uiSlide(v) { this.tone(360 + v * 900, 0.045, { peak: 0.05, bus: 'ui', wet: 0.2, type: 'triangle' }); },

  uiError() { this.tone(130, 0.18, { peak: 0.12, type: 'square', lp: 420, bus: 'ui', wet: 0.2 }); },
  uiStart() { this.noise(1.4, { f: 300, fto: 2600, q: 0.8, peak: 0.12, attack: 0.5, bus: 'ui', wet: 1 }); this.fm(1400, 1.5, 0.7, 0.5, { to: 700, peak: 0.12, wet: 1.2, delay: 0.55, bus: 'ui' }); },
  pauseIn() { this.noise(0.3, { f: 2400, fto: 400, q: 1, peak: 0.07, bus: 'ui', wet: 0.4 }); },
  pauseOut() { this.noise(0.3, { f: 400, fto: 2400, q: 1, peak: 0.07, bus: 'ui', wet: 0.4 }); },
  achieve() { [0, 4, 7, 12, 16].forEach((s, i) => this.tone(880 * Math.pow(2, s / 12), 0.6, { peak: 0.045, delay: i * 0.06, bus: 'ui', wet: 0.8, type: 'triangle' })); },

  // looping spatial hum from the way down: navigate by ear
  humStart() {
    if (!this.ok || this.hum) return;
    const c = this.ctx, g = c.createGain(); g.gain.value = 0;
    const p = c.createStereoPanner ? c.createStereoPanner() : null;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
    const o1 = c.createOscillator(), o2 = c.createOscillator(), o3 = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain();
    o1.type = 'triangle'; o1.frequency.value = 110; o2.frequency.value = 165.4; o3.frequency.value = 220.6; o3.type = 'sine';
    lfo.frequency.value = 0.35; lg.gain.value = 0.35; lfo.connect(lg);
    const am = c.createGain(); am.gain.value = 0.65; lg.connect(am.gain);
    o1.connect(f); o2.connect(f); o3.connect(f); f.connect(am); am.connect(g);
    let tail = g; if (p) { g.connect(p); tail = p; }
    tail.connect(this.buses.sfx.dry);
    const w = c.createGain(); w.gain.value = 0.6; tail.connect(w); w.connect(this.buses.sfx.wet);
    for (const o of [o1, o2, o3, lfo]) o.start();
    this.hum = { g, p, f, o: [o1, o2, o3, lfo] };
  },
  humUpdate(x, y, open) {
    if (!this.hum) return;
    const s = this.spatial(x, y, open ? 80 : 26), t = this.ctx.currentTime;
    this.hum.g.gain.setTargetAtTime(s.g * (open ? 0.2 : 0.05), t, 0.1);
    if (this.hum.p) this.hum.p.pan.setTargetAtTime(s.pan, t, 0.1);
    this.hum.f.frequency.setTargetAtTime(open ? s.lp : 380, t, 0.2);
  },
  humStop() {
    if (!this.hum) return;
    const h = this.hum; this.hum = null;
    const t = this.ctx.currentTime;
    h.g.gain.setTargetAtTime(0, t, 0.1);
    for (const o of h.o) o.stop(t + 0.6);
  },
  // the room tone of a flooded cave: slow brown-noise water and a high, thin air
  ambStart() {
    if (!this.ok || this.amb) return;
    const c = this.ctx, bus = this.buses.amb;
    const src = c.createBufferSource(); src.buffer = this.brownBuf; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 340;
    const g = c.createGain(); g.gain.value = 0.35;

// Scheduled generative score: pads on a slow minor progression, falling bell notes, the colony's motif,

const Music = {
  on: false, mode: 'silent', base: 50, root: 50, tension: 0, verses: 0, bpm: 54, step: 0, next: 0, cfg: null, motifQ: 0, ducked: false,
  PROG: [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]],
  PROG_MAJ: [[0, 4, 7], [5, 9, 12], [-3, 0, 4], [7, 11, 14]],
  MOTIF: [[7, 2], [10, 1], [12, 1], [10, 2], [7, 2], [5, 1], [3, 1], [5, 4]],
  MODES: {
    silent: { out: 0 },
    title: { out: 1, drone: 0.09, pad: 0.9, bell: 0.3, motif: 8, bright: 1.2 },
    game: { out: 0.85, drone: 0.12, pad: 0.42, bell: 0.1, motif: 16 },
    final: { out: 0.85, drone: 0.16, pad: 0.36, bell: 0.06, motif: 16, cluster: 0.05, rootShift: -1 },
    chorus: { out: 1, drone: 0.08, pad: 0.8, bell: 0.35, motif: 4, major: true, bright: 1.5 },
    over: { out: 0.7, drone: 0.1, pad: 0.5, bell: 0.05 },
    interlude: { out: 0.85, drone: 0.08, pad: 0.75, bell: 0.16, motif: 8 },
    ending_return: { out: 0.9, drone: 0.08, pad: 0.8, bell: 0.2, motif: 8 },
    ending_chorus: { out: 1, drone: 0.06, pad: 0.9, bell: 0.4, motif: 4, major: true, bright: 1.6 }

    const w = c.createGain(); w.gain.value = 0.85; this.out.connect(w); w.connect(bus.wet);
    this.dF = c.createBiquadFilter(); this.dF.type = 'lowpass'; this.dF.frequency.value = 320; this.dF.Q.value = 1.5;
    this.dG = c.createGain(); this.dG.gain.value = 0; this.dF.connect(this.dG); this.dG.connect(this.out);
    this.dr = [];

  retune(tc = 1.2) {

  },
  tick(t, s) {

  bellNote(n, t, v) {

  motif(t, n, harm) {

  }
};

// ---------- world: cave generation, placement, physics, pathfinding, echo field ----------
function genCave(seed, depth) {
  const W = Math.min(150, 60 + depth * 8), H = Math.min(104, 42 + depth * 5);
  for (let attempt = 0; attempt < 16; attempt++) {
    const rng = new RNG(seed + attempt * 7919);
    let g = new Uint8Array(W * H), b = new Uint8Array(W * H);
    const fill = 0.455 + Math.min(depth, 12) * 0.002;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      g[y * W + x] = (x < 2 || y < 2 || x >= W - 2 || y >= H - 2) ? 1 : (rng.next() < fill ? 1 : 0);
    for (let it = 0; it < 5; it++) {
      b.set(g);
      for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
        let n = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) n += g[(y + dy) * W + x + dx];
        const i = y * W + x;
        b[i] = n >= 5 ? 1 : (n <= 3 ? 0 : g[i]);
      }
      [g, b] = [b, g];
    }
    // keep the largest connected open region
    const lab = new Int32Array(W * H).fill(-1), q = new Int32Array(W * H);
    let best = -1, bestN = 0, rid = 0;
    for (let i = 0; i < W * H; i++) {
      if (g[i] || lab[i] >= 0) continue;
      let h = 0, tl = 0; q[tl++] = i; lab[i] = rid; let n = 0;
      while (h < tl) {
        const c = q[h++]; n++;
        const cx = c % W, cy = (c / W) | 0;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = cx + dx, ny = cy + dy, ni = ny * W + nx;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H || g[ni] || lab[ni] >= 0) continue;
          lab[ni] = rid; q[tl++] = ni;
        }
      }
      if (n > bestN) { bestN = n; best = rid; }
      rid++;
    }
    for (let i = 0; i < W * H; i++) if (!g[i] && lab[i] !== best) g[i] = 1;
    if (bestN > W * H * 0.3) return { W, H, g, rng };
  }
  throw new Error('Cave generation failed');
}

const solidAt = (L, cx, cy) => cx < 0 || cy < 0 || cx >= L.W || cy >= L.H || L.g[cy * L.W + cx] === 1;
function wallCount8(L, i) {
  const x = i % L.W, y = (i / L.W) | 0; let n = 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if ((dx || dy) && solidAt(L, x + dx, y + dy)) n++;
  return n;
}

  const x = i % L.W, y = (i / L.W) | 0;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (solidAt(L, x + dx, y + dy)) return false;
  return true;
}

  const N = L.W * L.H, d = new Int32Array(N).fill(-1), q = new Int32Array(N);
  let h = 0, t = 0; q[t++] = start; d[start] = 0;
  while (h < t) {
    const c = q[h++], cx = c % L.W, cy = (c / L.W) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (solidAt(L, nx, ny)) continue;
      const ni = ny * L.W + nx; if (d[ni] >= 0) continue;
      d[ni] = d[c] + 1; q[t++] = ni;

const cellX = (L, i) => (i % L.W + 0.5) * T, cellY = (L, i) => (((i / L.W) | 0) + 0.5) * T;

// spaced sampling: pick n cells from candidates, each far from those already taken
function spaced(L, rng, cands, n, minCells, avoid) {
  const out = [], taken = avoid ? avoid.slice() : [];
  const md2 = minCells * minCells * T * T;
  for (let k = 0; k < n && cands.length; k++) {
    let bestI = -1, bestD = -1;
    for (let s = 0; s < 70; s++) {
      const c = cands[Math.floor(rng.next() * cands.length)], x = cellX(L, c), y = cellY(L, c);
      let dm = Infinity;
      for (const [tx, ty] of taken) { const dd = (tx - x) ** 2 + (ty - y) ** 2; if (dd < dm) dm = dd; }
      if (dm > bestD) { bestD = dm; bestI = c; }

    if (bestI < 0 || (bestD < md2 && taken.length)) { if (bestD < md2 * 0.25) break; }
    out.push(bestI); taken.push([cellX(L, bestI), cellY(L, bestI)]);

function buildLevel(cfg) {
  const cave = genCave(cfg.seed, cfg.size);
  const L = { W: cave.W, H: cave.H, g: cave.g, time: 0, cfg };
  const rng = cave.rng, N = L.W * L.H;
  const open = []; for (let i = 0; i < N; i++) if (!L.g[i]) open.push(i);
  // start: roomy cell near the left
  let sc = open.filter(i => openAround(L, i, 1) && (i % L.W) < L.W * 0.3);
  if (!sc.length) sc = open.filter(i => openAround(L, i, 1));
  if (!sc.length) sc = open;
  const start = rng.pick(sc);
  const dist = bfs(L, start);
  let maxD = 0; for (const i of open) if (dist[i] > maxD) maxD = dist[i];
  const reach = open.filter(i => dist[i] >= 0);
  // gate: among the farthest roomy cells
  let gc = reach.filter(i => openAround(L, i, 1) && dist[i] > maxD * 0.85);
  if (!gc.length) gc = reach.filter(i => dist[i] > maxD * 0.8);
  const gate = rng.pick(gc);
  L.dist = dist; L.maxD = maxD;
  L.start = { x: cellX(L, start), y: cellY(L, start) };
  L.gate = { x: cellX(L, gate), y: cellY(L, gate), open: false, seenAt: -99, seenUntil: -99 };
  const avoid = [[L.start.x, L.start.y], [L.gate.x, L.gate.y]];
  // shards
  let shC = reach.filter(i => dist[i] > Math.min(14, maxD * 0.25));
  const sh = spaced(L, rng, shC, cfg.shards, 10, avoid);
  L.shards = sh.map(i => ({ x: cellX(L, i), y: cellY(L, i), got: false, seenAt: -99, seenUntil: -99, hum: rng.range(0, 3) }));
  for (const s of L.shards) avoid.push([s.x, s.y]);
  // lost song: tucked into a nook
  L.song = null;
  if (cfg.song != null) {
    let c = reach.filter(i => wallCount8(L, i) >= 5 && dist[i] > maxD * 0.35);
    if (!c.length) c = reach.filter(i => dist[i] > maxD * 0.35);
    const s = spaced(L, rng, c, 1, 6, avoid)[0];
    if (s != null) { L.song = { x: cellX(L, s), y: cellY(L, s), idx: cfg.song, got: false, seenAt: -99, seenUntil: -99 }; avoid.push([L.song.x, L.song.y]); }
  }
  // a lost member of the colony, hiding in a far nook (story only)
  L.kin = null;
  if (cfg.kin != null) {
    let c = reach.filter(i => wallCount8(L, i) >= 4 && dist[i] > maxD * 0.3 && openAround(L, i, 0));
    if (!c.length) c = reach.filter(i => dist[i] > maxD * 0.3);
    const k = spaced(L, rng, c, 1, 8, avoid)[0];
    if (k != null) { L.kin = { x: cellX(L, k), y: cellY(L, k), idx: cfg.kin, got: false, heard: false, chirpT: 4, seenAt: -99, seenUntil: -99, ph: rng.range(0, TAU) }; avoid.push([L.kin.x, L.kin.y]); }
  }
  // bellflowers grow against walls
  const bc = reach.filter(i => { const w = wallCount8(L, i); return w >= 3 && w <= 5 && dist[i] > 8; });
  L.bells = spaced(L, rng, bc, cfg.bells, 12, avoid).map(i => ({ x: cellX(L, i), y: cellY(L, i), cd: 0, lit: -99, seenAt: -99, seenUntil: -99 }));
  // moths
  const mc = reach.filter(i => dist[i] > 5);
  L.moths = spaced(L, rng, mc, cfg.moths, 4, [[L.start.x, L.start.y]]).map(i => {
    const x = cellX(L, i), y = cellY(L, i);
    return { x, y, hx: x, hy: y, ph: rng.range(0, TAU), flee: 0, fx: 0, fy: 0, got: false };
  });
  // water drips: tiny environmental echoes
  const dc = reach.filter(i => wallCount8(L, i) >= 2);
  L.drips = spaced(L, rng, dc, 7 + Math.min(cfg.depth || 1, 10), 9, []).map(i => ({ x: cellX(L, i), y: cellY(L, i), t: rng.range(0.5, 8) }));
  // hunters
  L.enemies = [];
  let stc = reach.filter(i => openAround(L, i, 1) && dist[i] > 30);
  if (stc.length < cfg.stalkers * 3) stc = reach.filter(i => dist[i] > 20);
  for (const i of spaced(L, rng, stc, cfg.stalkers, 12, [[L.start.x, L.start.y]]))
    L.enemies.push(makeEnemy('stalker', cellX(L, i), cellY(L, i), rng));
  const luc = reach.filter(i => wallCount8(L, i) >= 4 && dist[i] > 16);
  const lAvoid = [[L.start.x, L.start.y], ...L.enemies.map(e => [e.x, e.y])];
  for (const i of spaced(L, rng, luc, cfg.lurkers, 10, lAvoid))
    L.enemies.push(makeEnemy('lurker', cellX(L, i), cellY(L, i), rng));
  L.mute = null;
  if (cfg.final) {
    const mc2 = reach.filter(i => dist[i] > maxD * 0.55 && dist[i] < maxD * 0.8 && openAround(L, i, 1));
    const i = mc2.length ? rng.pick(mc2) : gate;
    L.mute = makeEnemy('mute', cellX(L, i), cellY(L, i), rng);
    L.enemies.push(L.mute);
  }

  L.mem = new Float32Array(N).fill(-1);

  const solidS = new Uint8Array(sw * shh);
  for (let y = 0; y < shh; y++) for (let x = 0; x < sw; x++) solidS[y * sw + x] = field(L, x * S + S / 2, y * S + S / 2) > 0.5 ? 1 : 0;
  for (let y = 1; y < shh - 1; y++) for (let x = 1; x < sw - 1; x++) {
    const i = y * sw + x; if (!solidS[i]) continue;
    if (solidS[i - 1] && solidS[i + 1] && solidS[i - sw] && solidS[i + sw]) continue;
    const h = hashStr(x + ',' + y), px = x * S + S / 2 + ((h & 15) / 15 - 0.5) * 2.4, py = y * S + S / 2 + (((h >> 4) & 15) / 15 - 0.5) * 2.4;
    const ci = Math.floor(py / T) * L.W + Math.floor(px / T);

  L.path = makePather(L);
  L.rings = []; L.events = []; L.cues = []; L.noises = [];
  L.shardsGot = 0; L.shardsNeeded = L.shards.length;
  L.stats = { pings: 0, hurt: 0, time: 0 };
  return L;
}

function makeEnemy(type, x, y, rng) {
  const base = { type, x, y, vx: 0, vy: 0, hx: x, hy: y, stun: 0, seenAt: -99, seenUntil: -99, gx: x, gy: y, seed: rng.next(), path: null, pi: 0 };
