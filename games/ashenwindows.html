const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/* mulberry32: small seeded PRNG used for levels, events, replays, and Daily Winter */
class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  f() { let t = (this.s += 0x6D2B79F5); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  r(a, b) { return a + (b - a) * this.f(); }
  i(a, b) { return a + Math.floor(this.f() * (b - a + 1)); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length) % arr.length]; }
  chance(p) { return this.f() < p; }
  w(obj) { let tot = 0; for (const k in obj) tot += obj[k]; let x = this.f() * tot; for (const k in obj) { x -= obj[k]; if (x <= 0) return k; } return Object.keys(obj)[0]; }
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function hsl(c, sat, dl, a) {
  return 'hsla(' + c[0] + ',' + clamp(c[1] * (sat == null ? 1 : sat), 0, 100).toFixed(1) + '%,' + clamp(c[2] + (dl || 0), 0, 100).toFixed(1) + '%,' + (a == null ? 1 : a) + ')';
}

function deepMerge(base, over) {
  if (!over || typeof over !== 'object') return base;

}

const Ease = {

  inOutQuad: t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),

  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
  bounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; }
};
const Tw = {
  list: [],
  /* Tw.add(obj, 'prop', to, seconds, ease, callback).then(...) chains another tween after it. */
  add(o, p, to, dur, ease, cb) {
    const t = this._mk(o, p, to, dur, ease, cb); t.from = num(o[p]); this.list.push(t); return t;
  },
  _mk(o, p, to, dur, ease, cb) {
    const self = this;
    return { o, p, from: 0, to, dur: Math.max(0.001, dur), t: 0, ease: ease || Ease.inOutQuad, cb, next: null,
      then(o2, p2, to2, d2, e2, cb2) { this.next = self._mk(o2, p2, to2, d2, e2, cb2); return this.next; } };
  },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const t = this.list[i]; t.t += dt; const k = clamp(t.t / t.dur, 0, 1);
      t.o[t.p] = t.from + (t.to - t.from) * t.ease(k);
      if (k >= 1) { this.list.splice(i, 1); if (t.cb) t.cb(); if (t.next) { t.next.from = num(t.next.o[t.next.p]); this.list.push(t.next); } }
    }
  },
  kill(o) { this.list = this.list.filter(t => t.o !== o); }
};
/* Damped spring for floppy parts: scarves, hair, coat hems, laundry, lamp shades, UI wobble. */
class Spring {
  constructor(x, k, d) { this.x = x || 0; this.v = 0; this.t = x || 0; this.k = k || 120; this.d = d || 12; }
  step(dt) { const a = -this.k * (this.x - this.t) - this.d * this.v; this.v += a * dt; this.x += this.v * dt; if (!Number.isFinite(this.x)) { this.x = this.t; this.v = 0; } return this.x; }

}

/* --- Scavenging sites are generated from the location table with a seeded RNG --- */
function buildSite(id, seed, o) {
  o = o || {}; const loc = LOCS[id], r = new RNG(seed), diff = o.diff || DIFF.normal;
  const nF = o.floors || loc.floors, w = o.w || loc.w, gy = CFG.site.groundY, fh = CFG.site.floorH;
  const L = mkLevel({ id, name: loc.n, w, site: true, dark: o.dark != null ? o.dark : loc.dark, bg: loc.bg, loc, seed });
  for (let i = 0; i < nF; i++) {
    let x0 = i === nF - 1 ? 0 : 170 + r.i(0, 70), x1 = w;
    if (loc.partial && i < nF - 1) x1 = Math.round(w * (0.52 + 0.22 * i));
    if (id === 'metro' && i === 0) x1 = Math.round(w * 0.5);
    L.floors.push({ y: gy - (nF - 1 - i) * fh, x0, x1, surf: (loc.bg === 'tunnel' || loc.bg === 'open') ? 'stone' : 'wood' });
  }
  const Gf = nF - 1, used = L.floors.map(() => []);
  const free = (x, f, gap) => used[f].every(u => Math.abs(u - x) >= (gap || 50));
  const put = (f, a, b, gap) => {
    const fl = L.floors[f]; a = Math.max(a, fl.x0 + 34); b = Math.min(b, fl.x1 - 34); if (b <= a) return null;
    for (let k = 0; k < 40; k++) { const x = Math.round(r.r(a, b)); if (free(x, f, gap)) { used[f].push(x); return x; } }
    return null;
  };
  L.objs.push({ type: 'exit', x: 46, f: Gf }); used[Gf].push(46); L.spawn = { x: 84, f: Gf };
  // connectors between floors, alternating stairs and ladders
  for (let i = 0; i < nF - 1; i++) {
    const upF = L.floors[i], lo = L.floors[i + 1], a = Math.max(upF.x0, lo.x0) + 70, b = Math.min(upF.x1, lo.x1) - 90, n = Math.max(2, Math.round((b - a) / 760));
    for (let k = 0; k < n; k++) {
      const cx = Math.round(a + (b - a) * (k + 0.5) / n + r.r(-50, 50)), stairs = (k + i) % 2 === 0;
      const lad = stairs ? { xa: clamp(cx + (k % 2 ? -80 : 80), upF.x0 + 12, upF.x1 - 12), xb: cx, fa: i, fb: i + 1, stairs: true } : { xa: cx, xb: cx, fa: i, fb: i + 1 };
      L.ladders.push(lad); used[i].push(lad.xa); used[i + 1].push(lad.xb); if (stairs) used[i + 1].push((lad.xa + lad.xb) / 2);
    }
  }
  // sniper corridors on the ground floor of open sites
  const nSn = o.snipers != null ? o.snipers : (loc.snipers || 0);
  for (let k = 0; k < nSn; k++) {
    const cx = Math.round(w * (0.3 + 0.55 * (k + 0.5) / nSn)), half = 120;
    L.snipers.push({ x0: cx - half, x1: cx + half, f: Gf, period: 6.2 + k * 0.7, safe: clamp(2.7 * diff.warn, 2.2, 4.2), t: r.r(0, 5), rx: cx });
    L.objs.push({ type: 'hide', kind: 'pillar', x: cx, f: Gf }); used[Gf].push(cx);
  }
  const inSniper = x => L.snipers.some(z => x > z.x0 - 30 && x < z.x1 + 30);
  // doors
  for (let f = 0; f < nF; f++) {
    const fl = L.floors[f];
    for (let x = fl.x0 + 400 + r.i(0, 120); x < fl.x1 - 220; x += 470 + r.i(0, 240)) {
      if (!free(x, f, 44) || (f === Gf && inSniper(x)) || o.noDoors) continue;
      used[f].push(x); L.blockers.push({ type: 'door', x, f, open: false, locked: r.chance(f < Gf ? 0.16 + loc.danger * 0.05 : 0.05 * loc.danger) });
    }
  }
  // containers with loot; the first is always useful, far ones are richer
  const kinds = ['cabinet', 'crate', 'locker', 'shelf', 'drawers'], conts = [];
  const nCont = o.cont != null ? o.cont : loc.cont;
  for (let k = 0; k < nCont; k++) {
    const f = r.i(0, nF - 1), x = put(f, 230, w - 40); if (x == null) continue;
    const far = x / w; let n = 1 + (r.chance(0.5) ? 1 : 0) + (far > 0.6 && r.chance(0.6) ? 1 : 0);
    if (diff.scarcity > 1 && r.chance(diff.scarcity - 1)) n++; if (diff.scarcity < 1 && n > 1 && r.chance(1 - diff.scarcity)) n--;
    if (o.scarce && n > 1 && r.chance(o.scarce)) n--;
    const items = []; for (let j = 0; j < n; j++) items.push(r.w(loc.loot));
    const c = { type: 'cont', kind: r.pick(kinds), x, f, items, rich: far > 0.6 }; conts.push(c); L.objs.push(c);
  }
  conts.sort((a, b) => a.x - b.x);
  if (conts[0]) conts[0].items.unshift(loc.guarantee);
  if (o.rare && conts.length) conts[conts.length - 1].items.push(o.rare);
  if (o.luck && conts.length > 2) conts[conts.length - 2].items.push(r.w(loc.loot));
  L.conts = conts;
  // hide spots
  for (let f = 0; f < nF; f++) {
    const fl = L.floors[f];
    for (let x = fl.x0 + 190; x < fl.x1 - 100; x += 320 + r.i(0, 110)) { const hx = put(f, x - 60, x + 60, 46); if (hx != null) L.objs.push({ type: 'hide', kind: r.pick(['wardrobe', 'rubble', 'stairs']), x: hx, f }); }
  }
  // squeaky boards and loose bricks
  for (let k = 0; k < 3 + loc.danger; k++) { const f = r.i(0, nF - 1), x = put(f, 260, w - 60, 40); if (x != null) L.objs.push({ type: 'squeak', x, f }); }
  for (let k = 0; k < 2; k++) { const f = r.i(0, nF - 1), x = put(f, 200, w - 60, 40); if (x != null) L.objs.push({ type: 'brick', x, f }); }
  // lamps: lit zones raise exposure
  if (!o.blackout) for (let f = 0; f < nF; f++) { const fl = L.floors[f]; for (let x = fl.x0 + 300 + r.i(0, 200); x < fl.x1 - 100; x += 620 + r.i(0, 260)) L.lights.push({ x, f, r: 120, flick: r.chance(0.5), bulb: true }); }
  // flood water
  if (loc.water) { for (let x = 420; x < w - 300; x += 640 + r.i(0, 200)) L.water.push({ x0: x, x1: x + 260 + r.i(0, 180), f: Gf }); }
  // gaps only a child fits through, guarding a bonus cabinet
  for (let k = 0; k < (loc.gaps || 0); k++) {
    const f = k % Math.max(1, nF - 1), fl = L.floors[f], gx = fl.x1 - 150 - k * 40;
    if (!free(gx, f, 40)) continue;
    L.blockers.push({ type: 'gap', x: gx, f, open: false }); used[f].push(gx);
    L.objs.push({ type: 'cont', kind: 'locker', x: gx + 70, f, items: [r.w(loc.loot), r.w(loc.loot), loc.guarantee], rich: true });
  }
  // inhabitants
  if (!o.noNpc) {
    const list = o.npcs || loc.npcs, cnt = Math.max(1, Math.round(list.length * diff.patrols + (o.extraNpc || 0)));
    for (let i = 0; i < cnt; i++) {
      const type = list[i % list.length], f = (type === 'dog' || type === 'civ') ? Gf : r.i(0, nF - 1), fl = L.floors[f];
      const x = clamp(r.r(w * 0.32, w * 0.92), fl.x0 + 120, fl.x1 - 120), span = r.i(130, 250);
      L.npcSpec.push({ type, x, f, p0: Math.max(fl.x0 + 30, x - span), p1: Math.min(fl.x1 - 30, x + span) });
    }
  }
  // mode and set-piece extras
  if (o.shutter) {
    const sx = Math.round(w * 0.56); L.blockers = L.blockers.filter(b => !(b.f === Gf && Math.abs(b.x - sx) < 200));
    L.blockers.push({ type: 'shutter', x: sx, f: Gf, open: false, prog: 0 });
    L.objs.push({ type: 'cont', kind: 'cabinet', x: sx + 90, f: Gf, items: ['meds', 'meds', 'antibio', 'bandage'], rich: true, story: true });
    L.npcSpec.push({ type: 'patrol', x: sx + 420, f: Gf, p0: sx - 330, p1: sx + 460 });
    const lad = L.ladders[0]; if (lad) L.npcSpec.push({ type: 'civ', x: lad.xa + 60, f: lad.fa, p0: lad.xa + 60, p1: lad.xa + 60, mode: 'wounded' });
  }
  if (o.collapse) { L.collapse = { x: w + 40, active: false, warn: 0, speed: 92, done: false }; const far = conts[conts.length - 1]; if (far) { far.trigger = 'collapse'; far.items.push('parts', 'fuel'); } }
  if (o.signal) L.objs.push({ type: 'signal', x: w - 90, f: Gf });
  if (o.goal) L.objs.push({ type: 'goal', x: w - 80, f: o.goalGround ? Gf : 0 });
  if (o.tuner) L.objs.push({ type: 'tuner', x: w - 90, f: Gf });
  for (let k = 0; k < (o.crates || 0); k++) { const f = r.i(0, nF - 1), x = put(f, w * 0.35, w - 60, 44); if (x != null) L.objs.push({ type: 'crate', x, f }); }
  for (let k = 0; k < (o.mail || 0); k++) { let f = r.i(0, nF - 1), x = put(f, 260 + k * (w - 400) / Math.max(1, o.mail), w - 60, 60); if (x == null) { f = Gf; x = put(f, 200, w - 60, 40); } if (x != null) L.objs.push({ type: 'mailbox', x, f, idx: k }); }
  for (let k = 0; k < (o.keeps || 0); k++) { const f = r.i(0, nF - 1), x = put(f, w * 0.25, w - 60, 44); if (x != null) L.objs.push({ type: 'keep', x, f, idx: (o.keepBase || 0) + k }); }
  if (o.cat) L.npcSpec.push({ type: 'cat', x: 300, f: Gf, p0: 240, p1: 420 });
  return L;
}

/* A short handcrafted street for the tutorial night. */

/* The bell tower for Signal Run: five short floors, gusts on the ladders. */
function buildTower(seed, diff) {
  const r = new RNG(seed), L = mkLevel({ id: 'church', name: 'Bell Tower', w: 1100, site: true, dark: 0.84, bg: 'nave', loc: LOCS.church });
  for (let i = 0; i < 5; i++) L.floors.push({ y: 40 + i * 100, x0: i === 4 ? 0 : 180, x1: i === 4 ? 1100 : 940, surf: 'wood' });
  for (let i = 0; i < 4; i++) {
    const left = i % 2 === 0;
    L.ladders.push({ xa: left ? 260 : 860, xb: left ? 260 : 860, fa: i, fb: i + 1 }, { xa: left ? 760 : 380, xb: left ? 680 : 460, fa: i, fb: i + 1, stairs: true, loose: i === 2 });
    L.objs.push({ type: 'hide', kind: 'rubble', x: 560, f: i + 1 }, { type: 'squeak', x: 470 + r.i(-40, 40), f: i });
  }
  L.objs.push({ type: 'exit', x: 46, f: 4 }, { type: 'goal', x: 560, f: 0, bell: true });
  L.gust = { t: 3, period: 9, warn: 2 * diff.warn, dur: 1.2, phase: 'calm' };
  L.npcSpec.push({ type: 'patrol', x: 600, f: 2, p0: 320, p1: 820 }); if (diff.patrols > 1) L.npcSpec.push({ type: 'patrol', x: 500, f: 3, p0: 300, p1: 800 });
  L.spawn = { x: 84, f: 4 }; L.conts = [];

}

/* ==========================================================================
   The World: one level plus everyone and everything in it.
   ========================================================================== */
class World {
  constructor(L, run, o) {
    this.L = L; this.run = run; this.o = o || {}; this.surv = []; this.npcs = []; this.proj = [];
    for (let i = 0; i < 10; i++) this.proj.push({ a: false });
    this.t = 0; this.night = !!this.o.night; this.diff = DIFF[run.diff] || DIFF.normal;
    this.noiseLvl = 0; this.cam = { x: L.home ? 480 : W / 2, y: L.home ? CFG.home.camY : 270, zoom: L.home ? CFG.home.zoom : 1, shake: 0, punch: 0 };
    this.slowT = 0; this.hitStop = 0; this.pack = { items: {}, cap: CFG.pack }; this.noTools = !!this.o.noTools;
    this.rec = []; this.recT = 0; this.replay = null; this.replayScore = 0; this.spotted = 0; this.closeCalls = 0; this.distractions = 0;
    this.rng = new RNG((run.seed ^ hashStr(L.id + ':' + run.day)) >>> 0);
    this.acts = {}; this.over = null; this.scene = null; this.ccCool = 0; this.heartCool = 0;
    for (const sp of L.npcSpec) this.spawnNPC(sp.type, sp.x, sp.f, sp);
  }
  spawnNPC(type, x, f, o) { const n = new NPC(type, x, f, o || {}); this.npcs.push(n); return n; }
  floorY(f) { return this.L.floors[clamp(f, 0, this.L.floors.length - 1)].y; }
  entY(e) { if (e.cl) { const l = e.cl.lad; return lerp(this.floorY(l.fb), this.floorY(l.fa), clamp(e.cl.t, 0, 1)); } return this.floorY(e.f); }
  entF(e) { if (e.cl) return e.cl.t > 0.5 ? e.cl.lad.fa : e.cl.lad.fb; return e.f; }
  sx(x) { return (x - this.cam.x) * this.cam.zoom + W / 2; }
  sy(y) { return (y - this.cam.y) * this.cam.zoom + H / 2; }
  place(s, x, f) { s.x = x; s.f = f; s.cl = null; s.vx = 0; }
  /* A closed blocker stops movement from x0 to x1 (survivors stop 8px short of it). */
  blockerBetween(f, x0, x1, e) {
    const bl = this.L.blockers;
    for (let i = 0; i < bl.length; i++) {
      const b = bl[i]; if (b.f !== f || b.open) continue;
      if (b.type === 'gap' && e && e.id === 'toby') continue;
      if ((x0 < b.x && x1 > b.x - 8) || (x0 >= b.x && x1 < b.x + 8)) return b;
    }
    return null;
  }
  /* Line of sight / projectile test: is there a closed blocker strictly between two points? */
  wallBetween(f, x0, x1) {
    const bl = this.L.blockers;
    for (let i = 0; i < bl.length; i++) { const b = bl[i]; if (b.f === f && !b.open && (x0 < b.x) !== (x1 < b.x)) return b; }
    return null;
  }
  ladderNear(e) { for (const l of this.L.ladders) { if (l.broken) continue; if ((l.fb === e.f && Math.abs(e.x - l.xb) < 16) || (l.fa === e.f && Math.abs(e.x - l.xa) < 16)) return l; } return null; }
  /* Shared movement for survivors and NPCs: walk on a floor, stop at blockers, climb connectors. */
  move(e, mx, my, dt, spd) {
    if (e.cl) {
      const l = e.cl.lad; let d = e.cl.auto != null ? e.cl.auto : (my < -0.3 ? 1 : my > 0.3 ? -1 : 0);
      if (!d && l.stairs && Math.abs(mx) > 0.2) d = sgn(mx) * sgn(l.xa - l.xb);
      if (e.gustHold) d = 0;
      e.cl.t += d * CFG.climb * (l.stairs ? 1.2 : 1) * (spd / CFG.walk) * 0.62 * dt;
      e.x = lerp(l.xb, l.xa, clamp(e.cl.t, 0, 1)); e.vx = d * 24; e.climbing = d !== 0;
      if (l.stairs && d) e.face = sgn((l.xa - l.xb) * d) || e.face;
      if (e.cl.t >= 1) { e.f = l.fa; e.x = l.xa; e.cl = null; e.vx = 0; if (l.loose && !l.broken && e instanceof Survivor) { l.broken = true; Snd.sfx('creak'); Snd.sfx('thud'); Floaters.add('The stair gives way behind you.', e.x, this.floorY(e.f) - 60, {}); } }

        if (!upw && l.fa === e.f && Math.abs(e.x - l.xa) < 16) { e.cl = { lad: l, t: 0.999 }; e.x = l.xa; return; }
      }

    while (q.length) { const f = q.shift(); for (const l of this.L.ladders) { if (l.broken) continue; const o = l.fa === f ? l.fb : l.fb === f ? l.fa : -1; if (o >= 0 && dist[o] > dist[f] + 1) { dist[o] = dist[f] + 1; q.push(o); } } }
    let best = null, bd = 1e9;

      if (l.broken) continue; const o = l.fa === f0 ? l.fb : l.fb === f0 ? l.fa : -1; if (o < 0 || dist[o] !== dist[f0] - 1) continue;
      const d = Math.abs((l.fa === f0 ? l.xa : l.xb) - x); if (d < bd) { bd = d; best = l; }
    }

  }
  /* Steer an entity toward (tx, tf). Returns 'arrived' | 'moving' | 'blocked'. */
  nav(e, tx, tf, dt, spd) {
    if (e.cl) { this.move(e, 0, 0, dt, spd); return 'moving'; }
    if (e.f === tf) {
      const dx = tx - e.x; if (Math.abs(dx) < 6) { e.vx = 0; return 'arrived'; }
      this.move(e, sgn(dx), 0, dt, spd);
      if (e.blockedBy) { const b = e.blockedBy; if (b.type === 'door' && !b.locked && !b.home) { b.open = true; Snd.sfx('door'); return 'moving'; } return 'blocked'; }
      return 'moving';
    }
    const lad = this.pathLadder(e.f, tf, e.x); if (!lad) return 'blocked';
    const upw = lad.fb === e.f, lx = upw ? lad.xb : lad.xa;
    if (Math.abs(lx - e.x) < 5) { e.x = lx; e.cl = { lad, t: upw ? 0.001 : 0.999, auto: upw ? 1 : -1 }; return 'moving'; }
    this.move(e, sgn(lx - e.x), 0, dt, spd);
    if (e.blockedBy) { const b = e.blockedBy; if (b.type === 'door' && !b.locked && !b.home) { b.open = true; Snd.sfx('door'); return 'moving'; } return 'blocked'; }
    return 'moving';
  }
  lit(x, f) { for (const l of this.L.lights) if (l.on !== false && l.f === f && Math.abs(x - l.x) < l.r * 0.8) return true; return false; }
  /* How visible a survivor is right now (the light meter). */
  expo(s) {
    let e = this.night ? CFG.expo.dark : 1.0;
    if (s.light) e += CFG.expo.torch; if (this.night && this.lit(s.x, this.entF(s))) e += CFG.expo.lit; if (s.lantern) e += 0.45;
    if (s.crouch) e *= CFG.expo.crouch; if (s.sprint) e *= CFG.expo.run;
    e *= (1.2 - s.st.stl * 0.07); if (this.run.mods.fog) e *= 0.75;
    return e;
  }
  noise(x, f, r, src) {
    if (this.run.mods.noisy) r *= 1.4;
    if (r > this.noiseLvl) this.noiseLvl = r;
    for (const n of this.npcs) n.hear(this, x, f, r, src);
    if (r >= 100) { Parts.emit('ripple', x, this.floorY(f) - 8, 1, { size: r * 0.35, life: 0.6 }); Bus.emit('noiseMade', { x, f, r, src }); }
  }
  packCount() { let n = 0; for (const k in this.pack.items) n += this.pack.items[k]; return n; }
  /* Give an item to whoever should hold it: the backpack on a sortie, the shelf at home. */
  give(item, n, s) {
    n = n || 1;
    if (this.L.home) { Run.add(this.run, item, n); Bus.emit('itemPickup', { item, n, s }); return n; }
    const room = this.pack.cap - this.packCount(), k = Math.max(0, Math.min(n, room));
    if (k > 0) { this.pack.items[item] = (this.pack.items[item] || 0) + k; Bus.emit('itemPickup', { item, n: k, s }); }
    return k;
  }

    this.aw = 0; this.peak = 0; this.t = 0; this.ph = 0; this.cl = null; this.jz = 0; this.wait = o.late ? 9999 : 0; this.late = !!o.late; if (this.late) this.st = 'idle';

  sees(w, s) {

    if (w.entF(s) !== this.f) return 0;
    const dx = s.x - this.x, d = Math.abs(dx);

    const range = this.T.vis * w.diff.vision * w.expo(s) * (w.run.mods.sleepers ? 1.1 : 1);

        else rep.lines.push('WARNING: ' + s.name + ' is fading. Food, warmth, medicine: today.');
      }
      if (!s.gone && !s.away && s.morale <= 4) {
        s.low++;
        if (s.low >= 2) { if (run.gentle || r.chance(0.6)) { s.away = run.day + 3; rep.lines.push(s.name + ' left before light, with a note: "I need to walk. I will come back."'); } else { s.gone = true; run.lossCount++; run.stats.lost++; rep.lines.push(s.name + ' left before light. The note only says "Sorry."'); } s.low = 0; rep.left.push(s); this.tag(run, 'leave'); Bus.emit('survivorLeaves', { s }); }
        else rep.lines.push('WARNING: ' + s.name + ' has gone very quiet. Company, a tune, a warm meal.');
      } else s.low = 0;
    }
    for (const s of run.surv) if (s.away && run.day + 1 >= s.away && !s.gone) {
      s.away = 0; s.hunger = 55; s.health = Math.max(s.health, 50); s.morale = Math.max(s.morale, 46); s.sick = false; s.fatigue = 50; s.cold = 60; this.add(run, 'can', 1);

    }

    if (run.up.coop) run.coopT++; if (run.up.garden) run.gardenT++;

    if (run.plantWater > 0 && am >= 48) run.plant = Math.min(1.2, run.plant + 0.17); else if (am < 28) run.plant = Math.max(0, run.plant - 0.06);

    rep.embers = CFG.embers.day + (sortie ? CFG.embers.night : 0) + Math.min(8, run.stats.kind) + (sortie && !sortie.spotted ? 3 : 0);
    run.embers += rep.embers; Save.data.embers += rep.embers; Save.data.stats.days++; if (sortie) Save.data.stats.nights++;

    if (!this.present(run).length && !run.surv.some(s => s.away && !s.gone)) run.ended = 'collapse';
    else if (run.ceasefire && run.day > run.ceasefire) run.ended = 'win';
    rep.phase = this.phase(run);
    return rep;
  }
};

/* The narrator: picks one diary line per dawn from the day's context tags. */
const Narrator = {
  pick(run, r, sortie) {
    const order = ['loss', 'leave', 'fire', 'theft', 'raid', 'hard', 'kind', 'ret', 'sick', 'hungry', 'cold', 'soup'];
    let tag = null; for (const t of order) if (run.tags.indexOf(t) >= 0) { tag = t; break; }
    if (!tag) {
      if (run.day === 1) tag = 'first'; else if (run.flags.rumorToday) { tag = 'rumor'; run.flags.rumorToday = false; }
      else if (Run.phase(run) === 3 && r.chance(0.5)) tag = 'thaw'; else if (run.weather === 'snow' && r.chance(0.4)) tag = 'snow';
      else if (run.cat && r.chance(0.2)) tag = 'cat'; else if (Run.present(run).some(s => s.id === 'toby') && r.chance(0.2)) tag = 'toby';
      else if ((!sortie || !sortie.spotted) && r.chance(0.45)) tag = 'quiet'; else tag = 'generic';
    }
    const pool = DIARY[tag] || DIARY.generic; run.flags.diaryN = (run.flags.diaryN || 0) + 1;
    return pool[(r.i(0, 50) + run.flags.diaryN) % pool.length];
  }
};

/* ==========================================================================
   SECTION 12: THE DIRECTOR - pacing, weather, visitors, hazards, rubber-banding
   ========================================================================== */
const Director = {
  /* 0 = calm and well, 1 = the group is in real trouble */
  tension(run) {
    const p = Run.present(run); if (!p.length) return 1;
    const am = Run.avgMorale(run), food = Run.food(run) / p.length, healthy = p.filter(s => s.health > 50 && !s.sick).length / p.length;
    return clamp(0.45 * (1 - am / 100) + 0.3 * (food < 1 ? 1 : food < 2 ? 0.5 : 0) + 0.25 * (1 - healthy), 0, 1);
  },
  struggling(run) { return this.tension(run) > 0.52 || Run.food(run) < Run.present(run).length; },
  planDay(run) {
    const r = new RNG(run.seed + run.day * 7919), ph = Run.phase(run), D = DIFF[run.diff] || DIFF.normal, strug = this.struggling(run);
    const calm = num(run.threats) >= 3 ? 0.5 : 1; run.threats = 0;          // tension tracking: after a rough day, ease off
    const freq = D.events * run.opt.eventFreq * calm;
    const wt = [{ clear: 4, rain: 3, fog: 2, snow: 1 }, { snow: 5, clear: 2, fog: 2, coldsnap: 2 }, { snow: 3, clear: 2, rain: 2, fog: 3, coldsnap: 1 }, { rain: 4, clear: 4, fog: 2 }][ph];
    const ww = Object.assign({}, wt); if (run.mods.snow) ww.snow = (ww.snow || 0) + 5; if (strug && ww.coldsnap) ww.coldsnap = 0.3;
    run.weather = run.day === 1 ? 'clear' : r.w(ww);
    run.temp = Math.round([4, -6, -3, 5][ph] + ({ snow: -4, coldsnap: -9, clear: 1, rain: -1, fog: -1 }[run.weather] || 0) + (run.mods.snow ? -3 : 0) + r.r(-2, 2));
    if (run.weather === 'coldsnap') Bus.emit('hazardWarning', { type: 'coldsnap', text: 'Cold snap. Fuel and blankets today, or shivering tonight.' });
    const ev = [];
    const due = run.callbacks.filter(c => c.day <= run.day);
    if (due.length) { ev.push({ t: 0.2, type: 'visitor', id: due[0].id }); run.callbacks.splice(run.callbacks.indexOf(due[0]), 1); }
    else if (run.day === 2 || r.chance(clamp((0.5 + (run.mods.friends ? 0.3 : 0)) * freq, 0, 0.95))) ev.push({ t: r.r(0.14, 0.42), type: 'visitor', id: this.pickVisitor(run, r, strug) });
    if (run.day >= 3 && r.chance([0.14, 0.3, 0.44, 0.3][ph] * freq * (strug ? 0.5 : 1))) {
      const hw = { tremor: 3, fire: 2, gas: 2, stair: 2 }; if (run.weather === 'rain' || run.weather === 'snow') hw.flood = 3; if (run.fire) hw.fire = 0; if (run.gas) hw.gas = 0;
      ev.push({ t: r.r(0.5, 0.82), type: 'hazard', id: r.w(hw) });
    }
    const rp = ([0.08, 0.25, 0.5, 0.3][ph] * run.opt.raidFreq * D.events * calm * (strug ? 0.6 : 1)) + (run.barrelLit ? 0.12 : 0);
    run.raidTonight = (run.day >= 4 && run.day - run.lastRaid > 1 && r.chance(rp)) ? { str: 2 + ph * 1.5 + r.r(0, 3) } : null;
    run.lucky = strug && r.chance(0.6);                                  // quiet help for a struggling group
    if (run.mode === 'story' && !run.flags.rumor && run.day >= 14) ev.push({ t: 0.6, type: 'rumor' });
    run.events = ev.sort((a, b) => a.t - b.t);
    Bus.emit('weatherChange', { weather: run.weather, temp: run.temp }); Bus.emit('dayStart', { day: run.day, phase: ph });
  },
  pickVisitor(run, r, strug) {
    if (strug && r.chance(0.45)) return 'donation';
    const w = { beggar: 3, trader: 4, neighbor: 3, child: 2, thief: 2, musician: 2, medic: 1.5, soldier: 1.5 };
    if (run.mods.friends) { w.donation = 3; w.medic = 3; }
    if (run.day >= 4) w.thug = 2 + Run.phase(run);
    if (!run.cat && run.day >= 3) w.catArrives = 2.5;
    if (run.day === 2) return 'beggar';                                   // the first hard choice arrives early
    for (const k in w) if (run.flags['v_' + k] && k !== 'trader' && k !== 'neighbor') w[k] *= 0.25;
    const id = r.w(w); run.flags['v_' + id] = true; return id;
  }
};

function visitorDialog(run, id, active) {

/* ==========================================================================
   SECTION 13: UI TOOLKIT - paper panels, icons, menus, dialogs, toasts
   Everything is drawn on the canvas in the shared charcoal-and-paper style.
   ========================================================================== */
const UI = {
  /* Torn-paper panel with a stitched inner border. Edges are jittered from a stable hash. */
  paper(ctx, x, y, w, h, o) {
    o = o || {}; const r = new RNG(hashStr(Math.round(w) + ':' + Math.round(h) + ':' + (o.seed || 1))), j = o.jit == null ? 3 : o.jit;
    ctx.save();
    if (o.rot) { ctx.translate(x + w / 2, y + h / 2); ctx.rotate(o.rot); ctx.translate(-x - w / 2, -y - h / 2); }
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(x + 4, y + 5, w, h);
    ctx.beginPath();
    const step = 26; let first = true;
    const pt = (px, py) => { if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py); };
    for (let i = 0; i <= w; i += step) pt(x + Math.min(i, w), y + r.r(-j, j) * 0.6);
    for (let i = step; i <= h; i += step) pt(x + w + r.r(-j, j) * 0.5, y + Math.min(i, h));
    for (let i = w; i >= 0; i -= step) pt(x + Math.max(i, 0), y + h + r.r(-j, j) * 0.6);
    for (let i = h - step; i >= 0; i -= step) pt(x + r.r(-j, j) * 0.5, y + Math.max(i, 0));

const SPLASH_HUES = [[4, 72, 52], [176, 62, 44], [24, 92, 56], [268, 42, 66]];      // red scarf, teal windbreaker, orange hat, lavender sweater
const SPLASH_LEN = 3.6;
class SplashScene {
  enter() { this.t = 0; this.done = false; this.motes = []; for (let i = 0; i < 46; i++) this.motes.push({ x: Math.random() * W, y: Math.random() * H, v: 4 + Math.random() * 10, r: 0.6 + Math.random() * 1.6, p: Math.random() * TAU }); }
  update(dt) {
    this.t += dt;
    for (const m of this.motes) { m.y -= m.v * dt; m.x += Math.sin(this.t * 0.6 + m.p) * 4 * dt; if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; } }
    if (!this.done && (this.t > SPLASH_LEN || (this.t > 0.35 && (Input.menu.any || Input.ptr.click)))) { this.done = true; if (this.t <= SPLASH_LEN) Snd.sfx('chime'); Game.go('Boot', {}, 'flicker'); }
  }
  render(ctx) {
    const t = this.t, cx = W / 2, cy = H / 2 - 22;
    ctx.fillStyle = G.ink; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, 420); g.addColorStop(0, grey(48)); g.addColorStop(1, grey(8)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const letters = ['J', 'O', 'R', 'J'], step = 104, x0 = cx - step * 1.5;
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    letters.forEach((L, i) => {
      const lt = clamp((t - 0.25 - i * 0.28) / 0.5, 0, 1), k = Ease.outBack(lt), x = x0 + i * step, y = cy + (1 - k) * 26;
      if (lt <= 0) return;
      const hue = SPLASH_HUES[i], glow = clamp((t - 0.6 - i * 0.28) / 0.6, 0, 1) * clamp((SPLASH_LEN - t) / 0.7, 0, 1);
      ctx.globalAlpha = lt;
      if (glow > 0) { const rg = ctx.createRadialGradient(x, y, 0, x, y, 78); rg.addColorStop(0, 'hsla(' + hue[0] + ',' + hue[1] + '%,' + hue[2] + '%,' + (0.42 * glow) + ')'); rg.addColorStop(1, 'hsla(' + hue[0] + ',' + hue[1] + '%,' + hue[2] + '%,0)'); ctx.fillStyle = rg; ctx.fillRect(x - 80, y - 80, 160, 160); }
      ctx.save(); ctx.translate(x, y); ctx.rotate((i % 2 ? 0.035 : -0.03) * (1 - glow * 0.5)); ctx.scale(0.8 + k * 0.2, 0.8 + k * 0.2);
      ctx.font = '900 128px Georgia, "Times New Roman", serif';
      ctx.lineWidth = 7; ctx.strokeStyle = grey(10); ctx.strokeText(L, 3, 4);                        // charcoal shadow
      ctx.fillStyle = grey(228); ctx.fillText(L, 0, 0);
      if (glow > 0) { ctx.globalAlpha = lt * glow * 0.85; ctx.fillStyle = 'hsl(' + hue[0] + ',' + hue[1] + '%,' + hue[2] + '%)'; ctx.fillText(L, 0, 0); ctx.globalAlpha = lt; }
      ctx.lineWidth = 1.2; ctx.strokeStyle = grey(60, 0.6); ctx.strokeText(L, 0, 0);
      ctx.restore();
    });
    ctx.restore(); ctx.globalAlpha = 1;
    const a2 = clamp((t - 1.55) / 0.6, 0, 1);
    if (a2 > 0) {
      ctx.globalAlpha = a2; ctx.fillStyle = grey(140); ctx.fillRect(cx - 150 * a2, cy + 82, 300 * a2, 1.5);
      txt(ctx, 'p r e s e n t s', cx, cy + 104, 13, G.bone, 'center', { outline: false });

/* Apply an item to a survivor. src is the stock (run.stock or a pack's items). Returns a line, or null if it did nothing. */
function useItem(run, s, id, src, w) {
  const U = ITEM_USE[id]; if (!U || !s) return null;
  if (U.keep) { const k = 'use_' + id; if (run.daily[k]) return null; run.daily[k] = true; } else { if (!(src[id] > 0)) return null; src[id]--; }
  const targets = U.group && w ? w.surv.filter(p => p.present && !p.down && p.f === s.f && Math.abs(p.x - s.x) < 260) : [s];
  if (targets.indexOf(s) < 0) targets.push(s);
  for (const p of targets) {
    if (U.hunger) p.hunger = clamp(p.hunger + U.hunger, 0, 100); if (U.fatigue) p.fatigue = clamp(p.fatigue + U.fatigue, 0, 100);
    if (U.cold) p.cold = clamp(p.cold + U.cold, 0, 100); if (U.health) p.health = clamp(p.health + U.health, 0, 100);
    const m = (U.toby && p.id === 'toby' ? U.toby : U.morale) || 0; if (m) p.addMorale(m, p !== s);
    if (U.cure === 'wound' || U.cure === 'both') p.wound = false; if (U.cure === 'sick' || U.cure === 'both') p.sick = false;
    if (U.clean) p.badWater = false; if (U.flare) p.flare = 0.8;
    if (w && m > 3) Parts.emit('ripple', p.x, w.entY(p) - 24, 1, { col: p.hueC() });
  }
  if (s.act) s.act(U.anim || 'use', 1.0); Snd.sfx(U.sfx || 'pickup');
  Bus.emit('itemUsed', { item: id, s });
  return (targets.length > 1 ? s.name + ' and ' + (targets.length - 1) + ' more' : s.name) + ': ' + U.d;
}
/* Journal entry: hand something to someone. Two small menus, one press each. */
function supplyOverlay(scene) {
  const run = scene.run, w = scene.w;
  const items = [];
  for (const id in ITEM_USE) {
    const U = ITEM_USE[id];
    items.push({ label: () => ITEMS[id].n + (U.keep ? '' : ' x' + Run.count(run, id)), hidden: () => Run.count(run, id) <= 0, right: () => (U.keep && run.daily['use_' + id] ? 'tomorrow' : U.group ? 'everyone' : 'give'), sub: U.d,
      dis: () => (U.keep && run.daily['use_' + id] ? 'Once a day.' : false),
      act: () => {
        const who = Run.present(run).map(p => ({ label: p.name + '  ' + (p.statuses().join(', ') || 'well'), sub: 'Hunger ' + Math.round(p.hunger) + '  Cold ' + Math.round(p.cold) + '  Health ' + Math.round(p.health) + '  Morale ' + Math.round(p.morale),
          act: () => { const line = useItem(run, p, id, run.stock, w); Game.pop(); if (line) note(line, 4); } }));
        if (U.group) { const s = scene.activeS ? scene.activeS(0) : Run.present(run)[0]; const line = useItem(run, s, id, run.stock, w); if (line) note(line, 4); return; }
        Game.push(menuOverlay({ title: 'Give ' + ITEMS[id].n + ' to', key: '', x: 60, y: 90, w: 420, maxRows: 7, items: who, onBack: () => Game.pop(), backLabel: 'Back' }));
      } });
  }
  items.push({ type: 'text', label: 'Nothing on the shelves to hand out.', hidden: () => Object.keys(ITEM_USE).some(id => Run.count(run, id) > 0) });
  return menuOverlay({ title: 'Hand out supplies', key: 'supply', x: 30, y: 60, w: 400, maxRows: 11, items, onBack: () => Game.pop(), backLabel: 'Close', extra: ctx => stockPanel(ctx, run, 450, 60) });
}

/* A beat is due when its owner is home, rested from the last beat, and the day is right. */
function threadDue(run) {
  if (!run.threads) run.threads = {}; if (!run.threadDay) run.threadDay = {};
  if (run.mode !== 'story' && run.mode !== 'endless' && run.mode !== 'custom' && run.mode !== 'quick' && run.mode !== 'daily') return null;
  const c = Run.present(run).filter(s => THREADS[s.id] && num(run.threads[s.id]) < 3 && run.day >= 2 + num(run.threads[s.id]) * 3 && run.day - num(run.threadDay[s.id], -9) >= 3);
  if (!c.length) return null; c.sort((a, b) => num(run.threads[a.id]) - num(run.threads[b.id]) || (run.day + a.id.length) % 3 - (run.day + b.id.length) % 3); return c[0].id;
}
function momentDialog(run, id, onDone) {
  const s = run.surv.find(q => q.id === id), n = num(run.threads[id]), B = THREADS[id][n]; if (!s || !B) return null;
  const text = typeof B.text === 'function' ? B.text(run) : B.text;
  return dialogOverlay({ id: 'th_' + id, who: 'none', surv: s, title: s.name + ': ' + B.title, text, opts: B.opts.map(o => ({ l: o.l, need: o.need, can: o.can ? () => o.can(run) : null,
    fn: () => { const r = o.fn(run, s); run.threads[id] = n + 1; run.threadDay[id] = run.day; if (o.ep) run.flags['ep_' + id] = o.ep; Run.log(run, s.name + ': ' + B.title + '. ' + r); Bus.emit('threadBeat', { id, n: n + 1, ep: o.ep }); return r; } })) }, run, onDone);
}

(function () {
  const dawn0 = Run.dawn;
  Run.dawn = function (run, sortie) {
    const rep = dawn0.call(this, run, sortie);
    try {
      if (run.up.greenhouse && run.up.garden && (run.gardenT || 0) < 3) run.gardenT++;
      if (run.up.clothesline) { run.lineT = num(run.lineT) + (run.weather === 'rain' ? 0 : 1); if (run.lineT >= 3) { run.lineT = 0; Run.add(run, 'cloth', 1); rep.lines.push('Rags off the line, dry and usable: +1 cloth.'); } }
      if (Run.count(run, 'soap') > 0 && run.day % 3 === 0) Run.add(run, 'soap', -1);
      if (run.flags.dynamo && run.day % 3 === 0) { Run.add(run, 'battery', 1); rep.lines.push('Somebody pedalled the dynamo all evening: +1 battery.'); }
      if (Run.count(run, 'blanket') > 0 && run.temp < 0 && Run.once(run, 'blanketline')) rep.lines.push('Blankets on every bed. Nobody woke up shivering.');
    } catch (e) { if (DEBUG) console.warn(e); }
    return rep;
  };
  const plan0 = Director.planDay;
  Director.planDay = function (run) {
    plan0.call(this, run);
    const id = threadDue(run), r = new RNG(run.seed + run.day * 101);
    if (id && r.chance(run.mode === 'story' ? 0.75 : 0.55)) { run.events.push({ t: r.r(0.28, 0.66), type: 'moment', id }); run.events.sort((a, b) => a.t - b.t); }
  };
  const pick0 = Director.pickVisitor;
  Director.pickVisitor = function (run, r, strug) {
    const fresh = ['clockmaker', 'choir', 'baker', 'twins'].filter(k => !run.flags['v_' + k]);
    if (run.day > 2 && fresh.length && r.chance(0.3)) { const id = r.pick(fresh); run.flags['v_' + id] = true; return id; }
    return pick0.call(this, run, r, strug);
  };
})();

NIGHT_RULES.snow = { coop: 2, quit: true, ai: 'still', label: 'BLIZZARD', dark: 0.7, opts: { drafts: true },

    sc.objective = 'Blizzard. Bring everyone to the heater, keep it fed, board the windows, share the blankets. Switch with ' + Input.glyph('sw') + '.';

  },
  clock(sc) { return clamp(sc.t / sc.st.len, 0, 1); },
  update(sc, dt) {
    const st = sc.st, w = sc.w, run = sc.run, D = w.diff;
    st.heat = Math.max(0, st.heat - dt * 1.9 * D.dmg); run.heaterOn = st.heat > 0;
    if (st.heat <= 0 && st.lit) { st.lit = false; Game.banner('The heater has gone out. Feed it!', 'warn', 4); Snd.sfx('tick'); } else if (st.heat > 0) st.lit = true;
    if (st.heat < 18 && st.heat > 0 && Run.once(run, 'lowheat' + Math.floor(sc.t / 30))) Game.banner('The heater is burning low.', 'warn', 3);
    // gusts are telegraphed: a rising tone and rattling boards, then cold for anyone far from the heater
    st.gustT -= dt;
    if (st.gust) { st.gust.t -= dt; if (st.gust.t <= 0) { Snd.sfx('gust', { d: 2 }); for (const s of w.surv) { const near = s.f === 3 && Math.abs(s.x - 680) < 170 && st.heat > 0; if (!near) { s.cold = clamp(s.cold - (s.blanket ? 6 : 13) * D.dmg, 0, 100); s.act('shiver', 1); } } w.shake(3); st.gust = null; st.gustT = 20 + Math.random() * 12; } }
    else if (st.gustT <= 0) { st.gust = { t: 4 * D.warn }; Snd.sfx('rise', { d: 2.5 }); Game.banner('The wind is rising. Get close to the heater!', 'warn', 4); Bus.emit('hazardWarning', { type: 'gust' }); for (const o of w.L.objs) if (o.type === 'window' && !o.boarded) o.rattle = true; }
    if (!st.gust) for (const o of w.L.objs) if (o.type === 'window') o.rattle = false;
    // warmth: the heater, each other, blankets; drafts from unboarded windows
    let coldest = null;
    for (const s of w.surv) {
      let d = -1.0 * D.dmg;
      if (st.heat > 0 && s.f === 3) d += 1.6 * clamp(1 - Math.abs(s.x - 680) / 300, 0, 1) * (0.5 + st.heat / 200);
      const huddle = w.surv.filter(p => p !== s && p.f === s.f && Math.abs(p.x - s.x) < 90).length; d += Math.min(3, huddle) * 0.28;
      if (s.blanket) d += 0.55;

    if (st.freeze >= 12) { sc.finish({ win: false, lines: [coldest.name + ' got too cold. You wrap them up and wait for the morning together.', 'The night lasted ' + Math.round(sc.t) + 's of ' + Math.round(st.len) + 's.'], score: Math.round(sc.t * 2) }); return; }
    if (sc.t >= st.len) { const avg = w.surv.reduce((a, s) => a + s.cold, 0) / w.surv.length;
      sc.finish({ win: true, lines: ['Dawn, and the snow has stopped. Everyone is here, and warm enough.', 'Average warmth: ' + Math.round(avg) + '%', 'Wood left: ' + Run.count(run, 'wood') + '   Blankets shared: ' + w.surv.filter(s => s.blanket).length], score: 500 + Math.round(avg * 6) + Run.count(run, 'wood') * 40, ach: 'snowbound' }); }
  },
  hud(ctx, sc) { const st = sc.st; hudBox(ctx, ['Heater: ' + (st.heat > 0 ? Math.round(st.heat) + '%' : 'OUT'), 'Wood ' + Run.count(sc.run, 'wood') + '  Fuel ' + Run.count(sc.run, 'fuel') + '  Blankets ' + Run.count(sc.run, 'blanket'), st.coldest ? 'Coldest: ' + st.coldest.name + ' (' + Math.round(st.coldest.cold) + '%)' : '', st.gust ? 'Wind rising!' : 'Dawn in ' + Math.max(0, Math.ceil(st.len - sc.t)) + 's']); }

/* --- 1. Afterwards --- */

  }

/* --- 2. What should we do? Ordered by urgency; every line names a concrete action. --- */
function adviceFor(run) {
  const out = [], P = Run.present(run), has = k => Run.count(run, k) > 0, add = (pri, t) => out.push({ pri, t });
  for (const s of P) {
    if (s.sick) add(10, has('antibio') || has('meds') || has('syrup') ? s.name + ' has a fever. Give medicine: Journal > Hand out supplies.' : s.name + ' has a fever and there is no medicine. Herb broth at the stove helps; the pharmacy and hospital have the real thing.');
    if (s.wound) add(9, has('bandage') ? s.name + ' is wounded. A bandage closes it: Hand out supplies, or the first-aid shelf.' : has('cloth') ? s.name + ' is wounded. Cut bandages from cloth at the workbench.' : s.name + ' is wounded and there is nothing to dress it with. Find cloth or bandages tonight.');
    if (s.hunger < 30) add(8, s.name + ' is hungry. Let them eat at the pantry, or hand them something.');
    if (s.cold < 30) add(8, s.name + ' is cold. ' + (run.up.heater ? (run.heaterOn ? 'Coffee or tea warms; a blanket keeps it.' : 'Light the heater in the kitchen.') : 'Build a heater at the workbench, or sew a quilt.'));
    if (s.fatigue < 22) add(6, s.name + ' is exhausted. Set their job to Rest, and do not send them out tonight.');
    if (s.morale < 28) add(7, s.name + ' is losing heart. ' + (has('choc') ? 'A square of chocolate would help. ' : '') + (run.up.piano ? 'Play the piano. ' : '') + (run.musicbox ? 'Wind the music box. ' : '') + 'Company and a hot meal help too.');
    if (s.guilt > 30) add(4, s.name + ' feels guilty. ' + (run.up.bookshelf ? 'Reading aloud eases it.' : 'Granny\'s company eases it, and kind choices do too.'));
  }
  const food = Run.food(run); if (food < P.length * 2) add(7, 'Food is low (' + food + ' for ' + P.length + '). The market and the collapsed block have tins and vegetables.' + (has('flour') ? ' You have flour: bake bread.' : ''));
  if (Run.count(run, 'water') < 3) add(6, has('dirty') ? 'Clean water is short. Boil rain water at the stove' + (run.up.filter ? ' or use the filter in the cellar.' : '.') : 'Water is short. A rain catcher on the roof fills the cellar barrel.');

  try { const el = document.getElementById('err'); el.style.display = 'flex'; document.getElementById('errmsg').textContent = DEBUG && e ? String(e && e.stack || e) : ''; el.addEventListener('pointerdown', () => location.reload()); } catch (x) { /* nothing more to do */ }
  if (DEBUG && e) console.error(e);
}
function boot() {

  Save.load(); Parts.init(); Floaters.init(); Input.init(canvas); Render.init(canvas); wire();

  window.addEventListener('orientationchange', () => setTimeout(() => Render.resize(), 200));
  window.addEventListener('blur', () => Game.onBlur());

  window.onerror = (msg, src, line, col, err) => { crash(err || msg); return false; };

  if (DEBUG) window.__ashen = { Game, Save, Input, Flow, Run, Render, Bus, Snd, Parts, adviceOverlay, bondsOverlay, adviceFor, MODES, Director, THREADS, momentDialog, useItem, supplyOverlay, craftOverlay, RECIPES, UPGRADES };
  const STEP = 1 / CFG.stepHz; let last = 0, acc = 0, fpsAcc = 0, fpsN = 0;
  function frame(now) {
    if (Game.crashed) return;
    requestAnimationFrame(frame);
    try {
      if (!last) last = now;
      let dt = (now - last) / 1000; last = now;
      if (!Number.isFinite(dt) || dt < 0) dt = 0;
      if (dt > CFG.maxDelta) dt = CFG.maxDelta;                 // cap delta after a stall or a hidden tab
      fpsAcc += dt; fpsN++;
      if (fpsAcc >= 0.5) {
        Game.fps = fpsN / fpsAcc; Game.ms = fpsAcc / fpsN * 1000; fpsAcc = 0; fpsN = 0;
        // adaptive quality: step down if we stay under 45 FPS
        if (Game.fps < 45) { Game.lowT += 0.5; if (Game.lowT >= 3 && (!Render.cheap || Render.resScale > 0.62 || Parts.quality > 0.4)) { Game.lowT = 0; if (!Render.cheap) Render.cheap = true; else { Render.resScale = Math.max(0.6, Render.resScale - 0.15); Parts.quality = Math.max(0.35, Parts.quality - 0.25); Render.resize(); } } } else Game.lowT = Math.max(0, Game.lowT - 0.25);

  }

}

})();
