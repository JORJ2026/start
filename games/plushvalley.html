}

/* ---------- event bus ---------- */
class EventBus {
  constructor() { this.h = {}; }
  on(ev, fn) { (this.h[ev] || (this.h[ev] = [])).push(fn); return () => { this.h[ev] = (this.h[ev] || []).filter(f => f !== fn); }; }
  emit(ev, data) {
    const list = this.h[ev]; if (!list) return;
    for (const fn of list.slice()) { try { fn(data || {}); } catch (e) { console.warn('[event ' + ev + ']', e); } }
  }
}

/* ---------- Cave critters (non-violent: they bump, you shoo, they poof) ---------- */

/* ---------- Crow (telegraphed raid) ---------- */
class Crow extends Actor {
  constructor(mapId, x, y, target) { super(x, y, mapId); this.target = target; this.state = 'fly'; this.peck = 0; this.h = 80; this.leaveDir = rand(-1, 1); }

/* ---------- ground pickups (bounce + magnet) ---------- */

  constructor(mapId, x, y, id, qty = 1, quality = 0) { super(x, y, mapId); this.id = id; this.qty = qty; this.quality = quality; this.vlift = rand(120, 180); this.lift = 1; this.vx = rand(-40, 40); this.vy = rand(-30, 30); this.age = 0; }

    this.frameTimes.push(dt); if (this.frameTimes.length > 60) this.frameTimes.shift(); const avg = this.frameTimes.reduce((a, b) => a + b, 0) / this.frameTimes.length; this.fps = avg > 0 ? 1 / avg : 60;
    const q = this.settings.quality; if (q !== 'auto') { if (this.quality !== q) this.setQuality(q); return; }
    if (this.fps < 45 && this.frameTimes.length >= 60) { this.lowT += dt; if (this.lowT > 3) { this.lowT = 0; this.setQuality(this.quality === 'high' ? 'medium' : 'low'); } } else this.lowT = Math.max(0, this.lowT - dt * 0.5);
  }
  setQuality(q) { if (this.quality === q) return; this.quality = q; this.fx.cap = TUNING.particleBudget[q] || 380; this.renderScale = q === 'high' ? 1 : q === 'medium' ? 0.85 : 0.7; this.resize(); }
  drawDebug(c) { const W = this.world; const lines = ['FPS ' + Math.round(this.fps) + ' · quality ' + this.quality, 'scene ' + this.sceneName + (this.scene.name ? ' (' + this.scene.name + ')' : ''), 'particles ' + this.fx.count, W ? 'entities ' + (W.entities.length + W.villagers.length + W.animals.length) + ' · map ' + W.curMap : '', W ? 'time ' + fmtTime(W.time) + ' · ' + W.weather + (W.wacky ? '/' + W.wacky : '') : '', W && W.players[0] ? 'player ' + W.players[0].anim + ' @' + W.players[0].tx + ',' + W.players[0].ty : '', W ? 'villagers: ' + W.villagers.slice(0, 4).map(v => v.id + ':' + v.state).join(' ') : '', 'input ' + this.input.last + (this.input.touchMode ? ' (touch)' : '')];
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(VIEW_W - 330, VIEW_H - 150, 320, 140); lines.forEach((l, i) => drawText(c, l, VIEW_W - 320, VIEW_H - 136 + i * 16, { size: 11, col: '#9f9', outline: null, noScale: true })); }
  /* ----- profile & saves ----- */
  saveProfile() { Store.set(SAVE_KEY + '_profile', this.profile); }
  achieve(id) { if (!ACHIEVEMENTS[id] || this.profile.achievements[id]) return; this.profile.achievements[id] = Date.now(); this.profile.stitches += 1; this.ui.toast('Sticker get: "' + ACHIEVEMENTS[id].name + '"! (+1 ✦)', 'buttontreasure', PAL.gold); this.audio.sfx('unlock'); this.bus.emit('achievementUnlocked', { id }); this.saveProfile(); }
  addScore(board, e) { if (!e) return; const L = this.profile.leaderboards[board] = this.profile.leaderboards[board] || []; L.push(e); L.sort((a, b) => b.score - a.score); L.length = Math.min(L.length, 5); }
  anySave() { for (let i = 0; i < 3; i++) if (Store.get(SAVE_KEY + '_slot' + i)) return true; return false; }
  saveSlotAuto() { const W = this.world; if (!W || W.mode === 'playground' || W.mode === 'daily') return; try { Store.set(SAVE_KEY + '_slot' + this.slot, W.serialize()); this.profile.lastSlot = this.slot; this.saveProfile(); } catch (e) { console.warn('save failed', e); } }
  pickSlot() { for (let i = 0; i < 3; i++) if (!Store.get(SAVE_KEY + '_slot' + i)) return i; return ((this.profile.lastSlot || 0) + 1) % 3; }
  continueLatest() { const s = this.profile.lastSlot; if (s !== undefined && Store.get(SAVE_KEY + '_slot' + s)) this.loadSlot(s); else for (let i = 0; i < 3; i++) if (Store.get(SAVE_KEY + '_slot' + i)) { this.loadSlot(i); return; } }
  loadSlot(i) {
    const d = Store.get(SAVE_KEY + '_slot' + i); if (!d) return; let W; try { W = World.load(d); } catch (e) { console.warn(e); this.ui.toast('That save is too fluffy to read. Starting fresh is safe!'); return; }
    if (this.world) this.world.destroy(); this.world = W; this.slot = i; this.input.slots = W.players.length > 1 ? W.players.map((p, k) => k === 0 ? ['kb', 'touch'] : ['pad' + (k - 1)]) : [['all']];
    this.setScene('boot', { msg: 'Fluffing the pillows...', next: () => { W.startDay(); this.setScene('world'); } });
  }
  /* ----- flows ----- */
  newWorld(cfg) { if (this.world) this.world.destroy(); this.mods = cfg.modifiers || {}; cfg.seed = cfg.seed || ((Date.now() * 7) >>> 0); const W = this.world = new World(cfg); this.slot = this.pickSlot(); W.rollWeather(); W.genRequests(); W.planDay(); W.placeAnimals(); W.narrate('morning', true); this.bus.emit('dayStart', { day: 1 }); W.players.forEach(p => { p.sel = 0; p.dir = 0; }); return W; }
  enterWorld(tutorial) { this.setScene('world'); if (tutorial && !this.profile.tutorialDone) this.scenes.world.startTutorial(); this.saveSlotAuto(); }
  quickStart() { const c = pick(CHARACTERS.slice(0, 8)); this.input.slots = [['all']]; this.newWorld({ mode: 'quick', pace: 'relaxed', players: [{ char: c.id, color: R.int(0, 1), name: pick(NAME_POOL), hat: this.profile.equipped.hat }], farmName: 'Patchwork Farm', pet: 'petcat' }); this.setScene('boot', { next: () => this.enterWorld(true) }); }
  startMode(id) {
    this.input.slots = [['all']];
    switch (id) {
      case 'quick': return this.quickStart(); case 'story': case 'free': case 'speed': return this.setScene('charcreate', { mode: id });
      case 'coop': return this.setScene('charcreate', { mode: 'coop' }); case 'custom': return this.setScene('custom');
      case 'frenzy': case 'cookoff': case 'fishing': case 'daily': case 'playground': return this.setScene('charcreate', { mode: id, quick: true });
      case 'hotpotato': case 'foodfight': return this.setScene('join', { title: MODES.find(m => m.id === id).name, min: 1, max: 4, onStart: ps => this.playMinigame(id, { players: ps, bots: Math.max(0, (id === 'hotpotato' ? 4 : 3) - ps.length), board: id, standalone: true }) });
    }
  }
  afterCreate(arg, pc, ex) {
    const base = { players: [pc], farmName: ex.farmName, pet: ex.pet, pace: ex.pace };
    switch (arg.mode) {
      case 'browse': this.profile.favChar = pc.char; this.saveProfile(); this.ui.toast(CHAR_BY_ID[pc.char].name + ' is your favorite! (used in quick modes)'); return this.setScene('title');
      case 'story': { const go = (players) => { this.newWorld(Object.assign({}, base, { mode: 'story', story: true, players })); this.playCutscenes(['intro', 'ch1_intro'], () => this.enterWorld(false)); };
        if (ex.players > 1) return this.setScene('join', { title: 'Story Co-op', first: Object.assign({}, pc, { slot: 0 }), firstDev: this.firstDev(), min: 2, max: 2, onStart: ps => go(ps) }); return go([pc]); }
      case 'free': this.newWorld(Object.assign({}, base, { mode: 'free' })); return this.setScene('boot', { next: () => this.enterWorld(true) });
      case 'coop': return this.setScene('join', { title: 'Co-op Farm', first: Object.assign({}, pc, { slot: 0 }), firstDev: this.firstDev(), min: 2, max: 4, onStart: ps => { this.newWorld(Object.assign({}, base, { mode: 'coop', players: ps })); this.setScene('boot', { next: () => this.enterWorld(false) }); } });
      case 'custom': { const c = arg.custom; this.newWorld(Object.assign({}, base, { mode: 'custom', money: c.money, seasonLen: c.seasonLen, weatherFreq: c.weather, animals: c.animals, eventFreq: c.events, pace: c.pace, unlockAll: c.unlockAll, modifiers: Object.assign({}, c.mods) })); return this.setScene('boot', { next: () => this.enterWorld(false) }); }
      case 'speed': this.newWorld(Object.assign({}, base, { mode: 'speed', money: 600, objective: { target: 2500, days: 7, title: 'Speed Farm', board: 'speed' } })); return this.setScene('boot', { next: () => this.enterWorld(false) });
      case 'daily': { const d = new Date(), key = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(), r = new RNG(key); const ks = Object.keys(MODIFIERS).filter(k => k !== 'mirror'); const mods = {}; for (let i = 0; i < 3; i++) mods[r.pick(ks)] = true;
        this.newWorld(Object.assign({}, base, { mode: 'daily', seed: key, pace: 'busy', money: 800, modifiers: mods, objective: { target: 999999, days: 2, title: 'Daily Farm ' + key, board: 'daily' } })); this.world.toast('Today\'s modifiers: ' + Object.keys(mods).map(k => MODIFIERS[k].name).join(' + '), 'popper', PAL.pink); return this.setScene('boot', { next: () => this.enterWorld(false) }); }
      case 'playground': this.newWorld(Object.assign({}, base, { mode: 'playground', unlockAll: true, animals: 3 })); this.world.toast('Playground! Spawn Menu is in Options (Esc).', 'popper'); return this.setScene('boot', { next: () => this.enterWorld(false) });
      case 'frenzy': return this.runFrenzy(pc);
      case 'cookoff': return this.playMinigame('cookoff', { players: [pc], board: 'cookoff', standalone: true, duration: 100 });
      case 'fishing': return this.playMinigame('fishing', { players: [pc], board: 'fishing', standalone: true, duration: 120 });
    }
  }
  runFrenzy(pc) {
    const seq = ['seedswap', 'splash', 'harvest', 'lantern', 'cookoff']; let i = 0, total = 0;
    const next = () => { if (i >= seq.length) { this.setScene('results', { title: 'Festival Frenzy Complete!', text: 'Total score across 5 events: ' + total, scores: [{ name: pc.name, score: total, char: pc.char, color: pc.color }], rank: total >= 120 ? 1 : total >= 60 ? 2 : 3, board: 'frenzy', stitches: 3, retry: () => this.runFrenzy(pc) }); return; }
      const id = seq[i++]; this.playMinigame(id, { players: [pc], bots: id === 'cookoff' ? 0 : 2, duration: 30, frenzy: true, title: 'Frenzy ' + i + '/5: ' + ({ seedswap: 'Seed Swap', splash: 'Splash Day', harvest: 'Harvest Sprint', lantern: 'Lantern Race', cookoff: 'Cook-Off' })[id], onDone: r => { total += Math.round((r.scores.find(s => s.name === pc.name) || { score: 0 }).score); next(); } }); };
    next();
  }
  playMinigame(id, o) {
    const W = o.world; const players = o.players || (W ? W.players.map((p, k) => ({ char: p.charId, color: p.colorIdx, name: p.name, hat: p.hat, slot: k })) : [{ char: 'bear', name: 'You', slot: 0 }]);
    const festival = !!o.festival; const cfg = { players, bots: o.bots !== undefined ? o.bots : (festival ? 3 - Math.min(2, players.length - 1) : 0), title: o.title, story: o.story, duration: o.duration, mods: W ? W.dayMods : this.mods, ice: false };
    const launch = (gid, extra = {}) => this.setScene('minigame', { game: gid, cfg: Object.assign({}, cfg, extra), onResult: r => {
      if (id === 'golem' && gid === 'fishing') { launch('golem', { title: 'Phase 2: The Frozen Waffle Golem' }); return; }
      if (o.board) r.board = o.board; if (o.standalone) r.retry = () => this.playMinigame(id, o);
      if (o.story && r.rank === 3) r.retry = () => this.playMinigame(id, o);
      if (o.onDone || W) r.onDone = res => { if (o.onDone) o.onDone(res); if (this.sceneName === 'results' || this.sceneName === 'minigame') { if (W) this.setScene('world'); } };
      if (o.frenzy) { r.retry = null; } this.setScene('results', r); } });
    if (id === 'golem') { launch('fishing', { title: 'Phase 1: Ice Fishing Contest', ice: true, duration: 75 }); return; }
    launch(id);
  }
  firstDev() { return this.input.last === 'pad' && this.input.lastPad !== undefined ? 'pad' + this.input.lastPad : this.input.last === 'touch' ? 'touch' : 'kb'; }
  playCutscenes(ids, done) { this.setScene('cutscene', { ids, done }); }
  gotoResults(res) { this.setScene('results', res); }
}

/* ---------- co-op hot-join: a new pad pressing A in Co-op Farm joins as the next player ---------- */
WorldScene.prototype.enterOrig = WorldScene.prototype.enter;
WorldScene.prototype.enter = function (arg) {
  this.enterOrig(arg); this.padUnsub.push(game.bus.on('padPress', d => {
    const W = game.world; if (!W || W.mode !== 'coop' || W.players.length >= 4 || !d.dev.pressed.ok) return; const id = 'pad' + d.index; if (game.input.slots.some(s => s.includes(id))) return;
    const slot = W.players.length; const c = CHARACTERS[slot % 8]; const p0 = W.players[0]; const p = new Player(slot, c.id, slot % 4, 'P' + (slot + 1), p0.map, p0.x + 20, p0.y); p.fluff = p.maxFluff; W.players.push(p); game.input.slots[slot] = [id];
    if (game.input.slots[0].includes('all')) game.input.slots[0] = ['kb', 'touch']; game.ui.toast('P' + (slot + 1) + ' joined the farm! Welcome, ' + c.short + '!', null, PAD_COLORS[slot]); game.audio.sfx('fanfare');
  }));
};

/* ---------- boot ---------- */
const game = new Game();
try { game.init(); } catch (e) { showCrash(e && e.stack || e); }

})();
</script>
