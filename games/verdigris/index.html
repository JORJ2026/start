<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>VERDIGRIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

</style></head><body><div id="w"><canvas id="c"></canvas><div id="ov"></div></div>
<script>
const W=36,H=22,T=24,C=document.getElementById('c'),X=C.getContext('2d'),OV=document.getElementById('ov');C.width=W*T;C.height=H*T;
const NAMES=['Ashfall Row','Kettle Basin','Greywater Docks'];
const SP=[null,{n:'Moss',c:'#6f9a4a',tol:.62,wet:0,ab:.004},{n:'Reed',c:'#b4c05a',tol:.5,wet:1,ab:.012},{n:'Water-lily',c:'#d6e3b0',tol:.3,wet:1,ab:.022}];
const DF=[{n:'Apprentice',em:.6,g:1},{n:'Engineer',em:1,g:2},{n:'Chief Engineer',em:1.5,g:3}];
const LORE=['Pressure gauge, 1871: a keeper recorded the last heron here.','Soil core: the clay remembers a river.','A guild ledger, tallying smoke as profit.','Pressed fern in a brass locket.','Engineer\'s sketch of a reed filter bed.','Survey stone: "Water stood here."','Lichen sample, still alive under soot.'];
const I=(x,y)=>y*W+x,wall=v=>v==1||v==4,walk=v=>!wall(v)&&v!=3;
let G=null,mode='menu',diff=1,vol={m:.5,s:.7,mute:false},keys={},last=0,acc=0,msg=[],asv=0,AC=null,mg=null;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(ci,seed,dg){const r=rng(seed+ci*977),t=Array(W*H).fill(0);
 for(const by of[1,6,13,18])for(let bx=2;bx<34;bx+=6){const park=r()<.35;
  for(let y=0;y<4;y++)for(let x=0;x<4;x++)t[I(bx+x,by+y)]=park?2:((x%3==0||y%3==0)?1:2);
  if(!park)t[I(bx+1+(r()*2|0),by+3)]=0}
 for(let x=0;x<W;x++)t[I(x,11)]=(x%9==4)?0:3;t[I(34,0)]=6;
 const stacks=[];while(stacks.length<3){const x=1+r()*34|0,y=1+r()*20|0,i=I(x,y);if(t[i]!=1)continue;
  const nb=[[0,1],[0,-1],[1,0],[-1,0]].map(d=>[x+d[0],y+d[1]]).find(p=>p[0]>=0&&p[1]>=0&&p[0]<W&&p[1]<H&&t[I(p[0],p[1])]==0);
  if(!nb)continue;t[i]=4;stacks.push({x,y,nb,on:true,perm:false})}
 const free=()=>{for(;;){const x=r()*W|0,y=r()*H|0;if(walk(t[I(x,y)])&&t[I(x,y)]!=6&&(x>4||y>3))return[x,y]}};
 const tox=t.map(v=>walk(v)||v==3?Math.min(1,[.45,.6,.75][ci]*(.7+.6*r())):0);
 const items=LORE.map((l,k)=>{const p=free();return{x:p[0],y:p[1],txt:l,got:false}});
 const guards=[];for(let k=0;k<dg;k++){const p=free();guards.push({x:p[0],y:p[1],path:[],st:'patrol',lost:0,rt:0,rep:0})}
 return{ci,t,tox,sp:Array(W*H).fill(0),life:Array(W*H).fill(0),seen:Array(W*H).fill(0),stacks,items,guards,moths:[],done:false}}
const cur=()=>G.cities[G.ci];
function say(s){msg.push({s,t:6});if(msg.length>4)msg.shift()}
function los(c,ax,ay,bx,by){const n=Math.ceil(Math.hypot(bx-ax,by-ay)*2);for(let k=1;k<n;k++){const x=Math.round(ax+(bx-ax)*k/n),y=Math.round(ay+(by-ay)*k/n);if(wall(c.t[I(x,y)]))return false}return true}
function astar(c,sx,sy,gx,gy){const s0=I(sx,sy),goal=I(gx,gy),open=[s0],g={[s0]:0},f={[s0]:0},from={},cl={},h=i=>Math.abs(i%W-gx)+Math.abs((i/W|0)-gy);
 while(open.length){let b=0;for(let k=1;k<open.length;k++)if(f[open[k]]<f[open[b]])b=k;const u=open.splice(b,1)[0];
  if(u==goal){const p=[];let n=u;while(n!=s0){p.unshift([n%W,n/W|0]);n=from[n]}return p}cl[u]=1;const cx=u%W,cy=u/W|0;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=I(nx,ny);if(!walk(c.t[n])||cl[n])continue;
   const ng=g[u]+1;if(g[n]===undefined||ng<g[n]){g[n]=ng;from[n]=u;f[n]=ng+h(n);if(!open.includes(n))open.push(n)}}}return[]}
function okp(c,x,y){for(const[a,b]of[[-.3,-.3],[.3,-.3],[-.3,.3],[.3,.3]]){const tx=Math.floor(x+a+.5),ty=Math.floor(y+b+.5);if(tx<0||ty<0||tx>=W||ty>=H||!walk(c.t[I(tx,ty)]))return false}return true}
function wet(c,x,y){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<W&&b<H&&c.t[I(a,b)]==3)return true}return false}
function restoration(c){let s=0,n=0;c.t.forEach((v,i)=>{if(v==2){n++;s+=c.life[i]}});return n?s/n:0}
function sim(c){const em=DF[G.diff].em,N=c.tox;
 for(const s of c.stacks)if(s.on)for(const d of[[0,1],[0,-1],[1,0],[-1,0]]){const i=I(s.x+d[0],s.y+d[1]);if(s.x+d[0]>=0&&s.y+d[1]>=0&&s.x+d[0]<W&&s.y+d[1]<H&&!wall(c.t[i]))N[i]=Math.min(1,N[i]+.05*em)}
 const nt=N.slice();for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=I(x,y);if(wall(c.t[i]))continue;let a=0,k=0;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=I(nx,ny);if(!wall(c.t[j])){a+=N[j];k++}}
  if(k)nt[i]=Math.max(0,N[i]+.22*(a/k-N[i])-.0015)}
 for(let i=0;i<N.length;i++)N[i]=nt[i];
 let tot=0;
 for(let i=0;i<c.t.length;i++){if(c.t[i]!=2||!c.sp[i])continue;const s=SP[c.sp[i]],x=i%W,y=i/W|0;tot+=c.life[i];
  if(N[i]>s.tol)c.life[i]-=.03;else if(s.wet&&!wet(c,x,y))c.life[i]-=.01;else c.life[i]=Math.min(1,c.life[i]+.012);
  N[i]=Math.max(0,N[i]-s.ab*c.life[i]);
  if(c.life[i]<=0){c.sp[i]=0;c.life[i]=0}
  if(c.life[i]>.8&&Math.random()<.02){const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.random()*4|0],j=I(x+d[0],y+d[1]);if(c.t[j]==2&&!c.sp[j]&&N[j]<s.tol){c.sp[j]=c.sp[i];c.life[j]=.05}}}
 const want=Math.min(6,Math.floor(tot/6));while(c.moths.length<want){const p=c.sp.findIndex((v,i)=>v&&c.life[i]>.5);if(p<0)break;c.moths.push({x:p%W,y:p/W|0,tx:null,ty:0,carry:0})}
 const R=restoration(c);if(!c.done&&R>=.5){c.done=true;say(NAMES[c.ci]+' is breathing again.'+(c.ci<2?' Take the rail station (T) to the next city.':''));sfx(520,.8,'triangle');if(G.cities.every(k=>k.done)){G.won=true;mode='win';win();sfx(392,1.2,'triangle');sfx(523,1.6,'sine')}}}
function mothUpdate(c,m,dt){if(m.tx==null){if(!m.carry){const ls=[];c.sp.forEach((v,i)=>{if(v&&c.life[i]>.5)ls.push(i)});if(!ls.length)return;const p=ls[Math.random()*ls.length|0];m.tx=p%W;m.ty=p/W|0;m.mode=0}
  else{const es=[];c.t.forEach((v,i)=>{if(v==2&&!c.sp[i]&&c.tox[i]<.45)es.push(i)});if(!es.length){m.carry=0;return}const p=es[Math.random()*es.length|0];m.tx=p%W;m.ty=p/W|0;m.mode=1}}
 const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy),st=2.5*dt;
 if(d<=st){m.x=m.tx;m.y=m.ty;const i=I(m.tx,m.ty);if(m.mode==0)m.carry=c.sp[i];else if(c.sp[i]==0&&c.tox[i]<SP[m.carry].tol){c.sp[i]=m.carry;c.life[i]=.1}m.tx=null;if(m.mode==1)m.carry=0}
 else{m.x+=dx/d*st;m.y+=dy/d*st}}
function caught(){G.caught++;G.seeds=Math.floor(G.seeds/2);G.px=1;G.py=0;G.heat=0;cur().guards.forEach(g=>{g.st='patrol';g.path=[]});say('The Watch drags you out. Half your seed stock is confiscated.');sfx(110,.6,'square');shake=.6;rumble(1,1,350)}
function guardUpdate(c,gd,dt){const d=Math.hypot(gd.x-G.px,gd.y-G.py),sees=G.heat>0&&d<9&&los(c,gd.x,gd.y,G.px,G.py);
 if(sees){if(gd.st!='chase')sfx(170,.25,'sawtooth');gd.st='chase';gd.lost=4}else if(gd.st=='chase'){gd.lost-=dt;if(gd.lost<=0){gd.st='patrol';gd.path=[]}}
 gd.rt-=dt;
 if(gd.st=='chase'){if(gd.rt<=0){gd.path=astar(c,Math.round(gd.x),Math.round(gd.y),Math.round(G.px),Math.round(G.py));gd.rt=.5}if(d<.8){caught();return}}
 else if(!gd.path.length){const off=c.stacks.find(s=>!s.on&&!s.perm);let tg;if(off)tg=off.nb;else{do{tg=[Math.random()*W|0,Math.random()*H|0]}while(c.t[I(tg[0],tg[1])]!=0)}gd.path=astar(c,Math.round(gd.x),Math.round(gd.y),tg[0],tg[1])}
 if(gd.path.length){const[tx,ty]=gd.path[0],dx=tx-gd.x,dy=ty-gd.y,dd=Math.hypot(dx,dy),sp=(gd.st=='chase'?3.8:2.2)*dt;if(dd<=sp){gd.x=tx;gd.y=ty;gd.path.shift()}else{gd.x+=dx/dd*sp;gd.y+=dy/dd*sp}}
 let near=false;for(const s of c.stacks)if(!s.on&&!s.perm&&Math.hypot(s.x-gd.x,s.y-gd.y)<1.8){near=true;gd.rep+=dt;if(gd.rep>3){s.on=true;gd.rep=0;say('A watchman relights a stack.')}}
 if(!near)gd.rep=0}
function update(dt){const c=cur();G.time+=dt;
 let mx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+GP.x,my=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+GP.y;
 if(mx||my){const l=Math.hypot(mx,my),sp=5*dt;if(okp(c,G.px+mx/l*sp,G.py))G.px+=mx/l*sp;if(okp(c,G.px,G.py+my/l*sp))G.py+=my/l*sp}
 const R=2+(G.notes>=9?1:0),sc=(keys[' ']||GP.scrub)&&G.charge>0;
 if(sc){G.charge=Math.max(0,G.charge-22*dt);const px=Math.round(G.px),py=Math.round(G.py);for(let y=py-R;y<=py+R;y++)for(let x=px-R;x<=px+R;x++)if(x>=0&&y>=0&&x<W&&y<H&&Math.hypot(x-px,y-py)<=R+.3)c.tox[I(x,y)]=Math.max(0,c.tox[I(x,y)]-.7*dt);if(Math.random()<.2)sfx(90+Math.random()*30,.08,'sawtooth',.25)}else G.charge=Math.min(100,G.charge+6*dt);
 G.heat=Math.max(0,G.heat-dt);
 for(const it of c.items)if(!it.got&&Math.hypot(it.x-G.px,it.y-G.py)<.8){it.got=true;G.notes++;G.seeds+=2;say('Found: '+it.txt);sfx(660,.4,'triangle');rumble(.2,.6,160);parts(it.x,it.y,'#e8c860',16);if(G.notes==3)say('Reed unlocked (Q). Reeds scrub toxin quickly but need water.');if(G.notes==6)say('Water-lily unlocked (Q). Delicate, but it cleans the most.');if(G.notes==9)say('Scrubber radius increased.')}
 const ti=I(Math.round(G.px),Math.round(G.py));if(c.sp[ti]&&c.life[ti]>.9&&c.t[ti]==2){c.life[ti]-=.25;G.seeds++;say('Seed pod gathered.')}
 if(keys.e||GP.sab){const s=c.stacks.find(s=>s.on&&Math.hypot(s.x-G.px,s.y-G.py)<1.9);if(s){G.sab=(G.sab||0)+dt;if(G.sab>1.5){s.on=false;G.heat=30;G.sab=0;say('Stack sabotaged. The Watch will hunt you. Guards will relight it.');sfx(80,.5,'square')}}else G.sab=0}else G.sab=0;
 for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++){const a=Math.round(G.px)+x,b=Math.round(G.py)+y;if(a>=0&&b>=0&&a<W&&b<H&&Math.hypot(x,y)<=6)c.seen[I(a,b)]=1}
 c.guards.forEach(g=>guardUpdate(c,g,dt));c.moths.forEach(m=>mothUpdate(c,m,dt));
 acc+=dt;while(acc>=.25){acc-=.25;G.cities.forEach(k=>{if(k==c||k.ci<=G.ci)sim(k)})}
 msg.forEach(m=>m.t-=dt);msg=msg.filter(m=>m.t>0);asv+=dt;if(asv>15){asv=0;save(true)}}
function key(k){const c=cur();
 if(k=='f'){const i=I(Math.round(G.px),Math.round(G.py));if(c.t[i]==2&&!c.sp[i]&&G.seeds>0){if(c.tox[i]>SP[G.sel].tol)say('Too toxic for '+SP[G.sel].n+'. Scrub first.');else{c.sp[i]=G.sel;c.life[i]=.1;G.seeds--;G.planted++;sfx(300,.15,'sine')}}}
 if(k=='q'){do{G.sel=G.sel%3+1}while((G.sel==2&&G.notes<3)||(G.sel==3&&G.notes<6));say('Species: '+SP[G.sel].n)}
 if(k=='p'){const s=c.stacks.find(s=>Math.hypot(s.x-G.px,s.y-G.py)<1.9&&!s.perm);if(s){if(G.notes>=3){G.notes-=3;s.perm=true;s.on=false;say('Permit filed: stack decommissioned for good. (-3 notes)');sfx(440,.4,'triangle')}else say('A permit costs 3 field notes.')}}
 if(k=='t'&&c.t[I(Math.round(G.px),Math.round(G.py))]==6){if(c.done&&G.ci<2){G.ci++;G.px=1;G.py=0;say('Arrived: '+NAMES[G.ci]);sfx(220,.6,'sawtooth')}else say(c.done?'No further rail line.':'Restore this city to 50% first.')}
 if(k=='m'){ST.mute=!ST.mute;applyVol();setSave()}}
const KEY='verdigris1',MEM={};let lastBak=0;
function sget(k){try{return localStorage.getItem(k)}catch(e){return MEM[k]||null}}
function sset(k,v){try{localStorage.setItem(k,v);return true}catch(e){MEM[k]=v;return false}}
function sdel(k){try{localStorage.removeItem(k)}catch(e){}delete MEM[k]}
const num=(v,d,lo,hi)=>{v=+v;return isFinite(v)?Math.max(lo,Math.min(hi,v)):d};
function fixArr(a,n,lo,hi){if(!Array.isArray(a)||a.length!=n)return null;for(let i=0;i<n;i++)a[i]=num(a[i],0,lo,hi);return a}
function validate(d){if(!d||typeof d!='object'||!Array.isArray(d.cities)||d.cities.length!=3)return null;const N=W*H;
 d.diff=num(d.diff,1,0,2)|0;d.ci=num(d.ci,0,0,2)|0;
 for(const c of d.cities){if(!c||!Array.isArray(c.t)||c.t.length!=N||!Array.isArray(c.stacks)||!Array.isArray(c.items)||!Array.isArray(c.guards))return null;
  for(let i=0;i<N;i++)if(![0,1,2,3,4,6].includes(c.t[i]))return null;
  if(!fixArr(c.tox,N,0,1)||!fixArr(c.life,N,0,1)||!fixArr(c.sp,N,0,3)||!fixArr(c.seen,N,0,1))return null;
  for(let i=0;i<N;i++){c.sp[i]|=0;if(c.t[i]!=2){c.sp[i]=0;c.life[i]=0}}
  for(const s of c.stacks){if(!s||!Array.isArray(s.nb)||s.nb.length!=2)return null;s.x=num(s.x,-1,0,W-1)|0;s.y=num(s.y,-1,0,H-1)|0;s.nb=[num(s.nb[0],0,0,W-1)|0,num(s.nb[1],0,0,H-1)|0];s.on=!!s.on;s.perm=!!s.perm;if(c.t[I(s.x,s.y)]!=4)return null}
  for(const it of c.items){if(!it)return null;it.x=num(it.x,0,0,W-1)|0;it.y=num(it.y,0,0,H-1)|0;it.got=!!it.got;it.txt=String(it.txt||'')}
  for(const g of c.guards){if(!g)return null;g.x=num(g.x,1,0,W-1);g.y=num(g.y,0,0,H-1);g.path=[];g.st='patrol';g.lost=0;g.rt=0;g.rep=0}
  c.moths=[];c.done=!!c.done;c.ci=c.ci|0}
 d.seeds=num(d.seeds,0,0,9999)|0;d.notes=num(d.notes,0,0,99)|0;d.charge=num(d.charge,100,0,100);d.heat=Math.min(60,num(d.heat,0,0,60));d.time=num(d.time,0,0,1e9);d.caught=num(d.caught,0,0,1e6)|0;d.planted=num(d.planted,0,0,1e6)|0;
 d.sel=num(d.sel,1,1,3)|0;if((d.sel==2&&d.notes<3)||(d.sel==3&&d.notes<6))d.sel=1;d.seed=num(d.seed,1,0,1e9)|0;d.won=!!d.won;
 d.px=num(d.px,1,0,W-1);d.py=num(d.py,0,0,H-1);if(!okp(d.cities[d.ci],d.px,d.py)){d.px=1;d.py=0}return d}
function save(q){try{if(!G||!G.cities||!isFinite(G.px)||!isFinite(G.py)||!isFinite(G.seeds)){if(!q)say('Save skipped: unstable state.');return}
 const old=sget(KEY);if(old&&Date.now()-lastBak>120000){sset(KEY+'.bak',old);lastBak=Date.now()}
 const ok=sset(KEY,JSON.stringify({v:2,t:Date.now(),d:G}));if(!q)say(ok?'Progress saved.':'Saved for this session only (browser storage blocked).')}catch(e){if(!q)say('Save failed.')}}
function readSave(k){try{const s=sget(k);if(!s)return null;const o=JSON.parse(s);return validate(o&&o.v==2?o.d:o)}catch(e){return null}}
function load(){let d=readSave(KEY),rec=false;if(!d){d=readSave(KEY+'.bak');rec=!!d}
 if(!d){const bad=sget(KEY);if(bad)sset(KEY+'.bad',bad);sdel(KEY);return false}G=d;diff=G.diff;msg=[];if(rec){sset(KEY,JSON.stringify({v:2,t:Date.now(),d:G}));setTimeout(()=>say('Main save was damaged. Recovered from backup.'),100)}return true}
function info(){const d=readSave(KEY)||readSave(KEY+'.bak');return d?`${NAMES[d.ci]} · ${(d.time/60).toFixed(0)} min · ${DF[d.diff].n}`:null}
function has(){return !!info()}
let gT=0,errN=0,errT=0;
function guard(){if(T0<gT)return;gT=T0+1;const c=cur(),N=W*H;

/* ---------- menus ---------- */
function show(title,items,o){o=o||{};OV.className=o.dim?'dim':'';OV.style.display='flex';OV.innerHTML='';if(title){const d=document.createElement('div');d.className='ht';d.textContent=title;OV.append(d)}
 if(o.text){const d=document.createElement('div');d.className='tx';d.innerHTML=o.text;OV.append(d)}
 items.forEach((it,i)=>{const e=document.createElement('div');e.className='it';it.paint=()=>{e.innerHTML=it.t=='s'?`<span>${it.l}</span><b>${Math.round(ST[it.k]*100)}%</b>`:it.t=='g'?`<span>${it.l}</span><b>${ST[it.k]?'ON':'OFF'}</b>`:`<span>${it.l}</span>`+(it.d?`<i>${it.d}</i>`:'')};it.paint();
  e.onmouseenter=()=>setF(i);e.onclick=ev=>{if(it.t=='s'){ST[it.k]=Math.max(0,Math.min(1,Math.round(ev.offsetX/e.offsetWidth*10)/10));it.paint();setSave();applyVol()}else act(i)};OV.append(e);it.e=e});
 MI=items;MB=o.back||null;fi=0;setF(0)}
function setF(i){if(!MI.length)return;MI.forEach(m=>m.e&&m.e.classList.remove('f'));fi=(i+MI.length)%MI.length;MI[fi].e.classList.add('f')}
function adjust(d){const it=MI[fi];if(!it)return;if(it.t=='s'){ST[it.k]=Math.max(0,Math.min(1,+(ST[it.k]+d*.1).toFixed(2)))}else if(it.t=='g'){ST[it.k]=!ST[it.k]}else return;it.paint();setSave();applyVol();sfx(500,.05,'square',.15)}
function act(i){const it=MI[i];if(!it)return;if(it.t=='g')adjust(1);else if(it.f){sfx(400,.08,'square',.2);it.f()}}
function title(){mode='menu';const it=[{l:'New Game',f:newMenu}];const inf=info();if(inf)it.push({l:'Continue',d:inf,f:()=>startLoad(true)});if(inf)it.push({l:'Delete Save',f:delMenu});it.push({l:'Settings',f:()=>settings(title)},{l:'Controls',f:()=>controls(title)},{l:'Credits',f:credits});show('',it)}
function newMenu(){show('Choose Your Posting',[...DF.map((d,i)=>({l:d.n,d:['Slow smoke, one watchman','Standard smoke, two watchmen','Heavy smoke, three watchmen'][i],f:()=>newStart(i)})),{l:'Back',f:title}],{back:title,dim:1})}
function settings(back){show('Settings',[{t:'s',l:'Master',k:'master'},{t:'s',l:'Music',k:'music'},{t:'s',l:'Effects',k:'sfx'},{t:'s',l:'Ambience',k:'amb'},{t:'g',l:'Screen shake',k:'shake'},{t:'g',l:'Toxin hatching (colorblind)',k:'hatch'},{t:'g',l:'Controller rumble',k:'rumble'},{t:'g',l:'Mute all',k:'mute'},{l:'Back',f:back}],{back,dim:1})}
function controls(back){show('Controls',[{l:'Back',f:back}],{back,dim:1,text:`<table><tr><td></td><td><b>Keyboard</b></td><td><b>Controller</b></td></tr><tr><td>Move</td><td>WASD / Arrows</td><td>Left stick / D-pad</td></tr><tr><td>Scrub</td><td>Hold Space</td><td>Hold X or RT</td></tr><tr><td>Plant</td><td>F</td><td>A</td></tr><tr><td>Change species</td><td>Q</td><td>Y</td></tr><tr><td>Sabotage stack</td><td>Hold E</td><td>Hold B or LT</td></tr><tr><td>File permit (3 notes)</td><td>P</td><td>LB</td></tr><tr><td>Rail station</td><td>T</td><td>RB</td></tr><tr><td>Pause</td><td>Esc</td><td>Start</td></tr><tr><td>Mute</td><td>M</td><td></td></tr></table>`})}
function credits(){show('Credits',[{l:'Back',f:title}],{back:title,dim:1,text:'Design, code, art and synthesized sound by Claude.<br>All graphics and audio are generated in code at launch. No external assets.'})}
function pauseMenu(){mode='pause';const r=()=>{mode='play';OV.style.display='none'};show('Paused',[{l:'Resume',f:r},{l:'Settings',f:()=>settings(pauseMenu)},{l:'Controls',f:()=>controls(pauseMenu)},{l:'Save Game',f:()=>{save();pauseMenu()}},{l:'Save and Quit',f:()=>{save(true);title()}}],{back:r,dim:1})}
function win(){save(true);show('The River Returns',[{l:'Main Menu',f:title}],{dim:1,text:`All three cities breathe.<br>Time ${(G.time/60).toFixed(1)} min · Seeds planted ${G.planted} · Times caught ${G.caught} · ${DF[G.diff].n}`})}
function valid(c){const seen={},q=[I(1,0)];seen[q[0]]=1;while(q.length){const u=q.pop(),x=u%W,y=u/W|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=I(nx,ny);if(!seen[n]&&walk(c.t[n])){seen[n]=1;q.push(n)}}}
 return c.items.every(i=>seen[I(i.x,i.y)])&&c.stacks.every(s=>seen[I(s.nb[0],s.nb[1])])&&seen[I(34,0)]}
const TIPS=['Moss tolerates poison. Reeds drink it. Lilies need clean water.','A watchman only hunts you while you are wanted.','Notes buy permits. Permits cannot be undone by the Watch.'];
async function startLoad(cont){if(mode=='load')return;try{await startLoad0(cont)}catch(e){console.error(e);mode='menu';show('Could Not Start',[{l:'Main Menu',f:title}],{dim:1,text:'Loading failed. Your save was not changed.'})}}
async function startLoad0(cont){mode='load';OV.className='dim';OV.style.display='flex';OV.innerHTML=`<div class="ht">Loading</div><div class="bar"><div id="lb"></div></div><div class="tx" id="ll"></div><div class="tx"><i>${TIPS[Date.now()%3]}</i></div>`;ldBar=OV.querySelector('#lb');ldLab=OV.querySelector('#ll');
 const Lp=(p,t)=>{ldBar.style.width=p+'%';ldLab.textContent=t},w=()=>new Promise(r=>setTimeout(r,60));
 Lp(8,'Casting textures');if(!TX.ok)buildTex();await w();ensureAudio();
 if(cont){Lp(50,'Reading the survey ledger');await w();if(!load()){show('Save Unreadable',[{l:'Main Menu',f:title}],{dim:1,text:'No valid save could be recovered. A copy was kept aside.'});mode='menu';return}}
 else{const seed=Date.now()%1000000,cs=[];for(let i=0;i<3;i++){Lp(20+i*22,'Surveying '+NAMES[i]);await w();let s=seed,c;do{c=mk(i,s,DF[diff].g);s+=31}while(!valid(c)&&(s-seed)<1240);cs.push(c)}
  G={seed,diff,ci:0,cities:cs,px:1,py:0,seeds:5,notes:0,charge:100,sel:1,heat:0,time:0,caught:0,planted:0,won:false}}
 Lp(92,'Lighting the boilers');await w();Lp(100,'Ready');await w();P.length=0;msg=[];say(cont?'Save restored.':'Ashfall Row. Soot hides the old river.');mode='play';OV.style.display='none';OV.className=''}
function padPoll(){GP.x=GP.y=GP.scrub=GP.sab=0;const p=pad();if(!p)return;const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed),dz=v=>Math.abs(v)>.25?v:0,
 x=dz(p.axes[0])+(b(15)?1:0)-(b(14)?1:0),y=dz(p.axes[1])+(b(13)?1:0)-(b(12)?1:0),edge=i=>{const n=b(i),o=PB[i];PB[i]=n;return n&&!o};
 const a=edge(0),bb=edge(1),yy=edge(3),lb=edge(4),rb=edge(5),st=edge(9);if(a||bb||yy||lb||rb||st||Math.abs(x)>.5||Math.abs(y)>.5)using=true;
 if(mode=='play'){GP.x=x;GP.y=y;GP.scrub=b(2)||b(7);GP.sab=b(1)||b(6);if(a)key('f');if(yy)key('q');if(lb)key('p');if(rb)key('t');if(st)pauseMenu()}
 else if(mode=='menu'||mode=='pause'){const d=Math.abs(x)>Math.abs(y)?(x>.5?'r':x<-.5?'l':''):(y>.5?'d':y<-.5?'u':'');
  if(d&&(d!=lastDir||T0>rep)){rep=T0+(d==lastDir?.14:.35);if(d=='d')setF(fi+1);if(d=='u')setF(fi-1);if(d=='l')adjust(-1);if(d=='r')adjust(1)}lastDir=d;
  if(a){ensureAudio();act(fi)}if((bb||(st&&mode=='pause'))&&MB)MB()}}
addEventListener('keydown',e=>{const k=e.key.length==1?e.key.toLowerCase():e.key;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();using=false;
 if(mode=='play'){if(k=='Escape'){pauseMenu();return}if(!keys[k])key(k);keys[k]=true;return}
 if(mode=='menu'||mode=='pause'){ensureAudio();if(k=='ArrowDown'||k=='s')setF(fi+1);else if(k=='ArrowUp'||k=='w')setF(fi-1);else if(k=='ArrowLeft'||k=='a')adjust(-1);else if(k=='ArrowRight'||k=='d')adjust(1);else if(k=='Enter'||k==' ')act(fi);else if(k=='Escape'&&MB)MB()}});
addEventListener('keyup',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=false});
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;T0+=dt;padPoll();

 try{if(G&&(mode=='play'||mode=='pause'||mode=='win'))draw(dt);else drawTitle(dt)}catch(e){X.setTransform(1,0,0,1,0,0);crash(e)}
 audioTick();requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode=='play'){save(true);keys={};pauseMenu()}});

['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(AC&&AC.state=='suspended')AC.resume()},{passive:true}));
