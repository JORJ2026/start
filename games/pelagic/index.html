<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07101b">
  <meta name="description" content="A short, strange voyage through a lightless sea. Listen for what is hiding.">
  <title>Pelagic</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="game.js"></script>
</head>
<body>
  <main id="game" aria-label="Pelagic underwater exploration game">
    <canvas id="world" aria-label="Game field"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <header id="hud" class="hud hidden" aria-live="polite">
      <div class="hud-left">
        <div class="eyebrow">NIGHT SIGNAL <span id="level-label">01 / 03</span></div>
        <div class="shard-row" id="shard-row" aria-label="Recovered fragments"></div>
      </div>
      <div class="hud-center"><span class="objective" id="objective">Find the fragments</span></div>
      <div class="hud-right">
        <div class="hull" id="hull" aria-label="Hull integrity"></div>
        <button class="icon-button pause-button" id="pause-button" aria-label="Pause">Ⅱ</button>
      </div>
    </header>
    <div id="toast" class="toast" aria-live="polite"></div>
    <div id="ping-label" class="ping-label">SONAR · SPACE</div>

    <section id="menu" class="screen menu-screen">
      <div class="title-mark"><span class="mark-orbit"></span><span class="mark-core"></span></div>
      <p class="eyebrow">A DEEPWATER EXPEDITION</p>
      <h1>PELAGIC</h1>
      <p class="subtitle">The sea remembers what the light forgets.</p>
      <div class="menu-actions">
        <button class="primary-button" id="start-button">Begin descent <span>↘</span></button>
        <button class="text-button hidden" id="continue-button">Continue voyage</button>
        <div class="menu-secondary">
          <button class="text-button" id="controls-button">Controls</button>
          <button class="text-button" id="settings-button">Sound</button>
          <button class="text-button" id="credits-button">Credits</button>
        </div>
      </div>
      <div class="menu-note" id="best-note"></div>
    </section>

    <section id="overlay" class="screen overlay-screen hidden" aria-modal="true" role="dialog">
      <div class="panel" id="panel"></div>
    </section>

    <div class="touch-controls" id="touch-controls" aria-label="Touch controls">
      <div class="stick" id="stick"><i></i></div>
      <button class="touch-ping" id="touch-ping" aria-label="Send sonar pulse">PING</button>
    </div>
  </main>
</body>
</html>
